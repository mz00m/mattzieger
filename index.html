<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matt Zieger</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0e1a; overflow: hidden; cursor: crosshair; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cols, rows, dots;

const SPACING = 28;
const DOT_BASE = 1.1;
const WAVE_SPEED = 120;       // px per second
const DAMPING = 0.92;         // per-frame amplitude decay
const FREQUENCY = 3.5;        // wave oscillation Hz
const WAVELENGTH = WAVE_SPEED / FREQUENCY;
const TWO_PI = Math.PI * 2;

// Each dot stores its displacement (z) and velocity
// Waves are stored separately and dots sum contributions

let waves = []; // { x, y, t0, amplitude }

function init() {
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
  cols = Math.ceil(W / SPACING) + 2;
  rows = Math.ceil(H / SPACING) + 2;

  // Offset to center the grid
  const ox = (W - (cols - 1) * SPACING) / 2;
  const oy = (H - (rows - 1) * SPACING) / 2;

  dots = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      dots.push({
        x: ox + c * SPACING,
        y: oy + r * SPACING,
        z: 0,        // current displacement
        prevZ: 0,    // for velocity-based rendering
      });
    }
  }
}

function spawnWave(x, y) {
  waves.push({
    x, y,
    t0: performance.now() / 1000,
    amplitude: 10,
  });
  // Cap active waves to prevent slowdown
  if (waves.length > 12) waves.shift();
}

canvas.addEventListener('click', e => spawnWave(e.clientX, e.clientY));
canvas.addEventListener('contextmenu', e => e.preventDefault());

// Touch support
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) spawnWave(t.clientX, t.clientY);
}, { passive: false });

let lastTime = performance.now() / 1000;

function frame(now) {
  now /= 1000;
  const dt = Math.min(now - lastTime, 0.05);
  lastTime = now;

  ctx.fillStyle = '#0a0e1a';
  ctx.fillRect(0, 0, W, H);

  // Prune dead waves (amplitude negligible after ~4 seconds)
  waves = waves.filter(w => (now - w.t0) < 10);

  // Compute each dot's displacement from superposition of all active waves
  for (const dot of dots) {
    dot.prevZ = dot.z;
    let z = 0;

    for (const wave of waves) {
      const dx = dot.x - wave.x;
      const dy = dot.y - wave.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      const elapsed = now - wave.t0;
      const wavefront = elapsed * WAVE_SPEED;

      // Only affect dots the wavefront has reached
      if (dist > wavefront + WAVELENGTH * 0.5) continue;

      // How long ago the wave passed this point
      const localT = elapsed - dist / WAVE_SPEED;
      if (localT < 0) continue;

      // Realistic damped sinusoidal wave
      // Amplitude falls off with 1/sqrt(r) (2D circular wave) and exponential time decay
      const spatialFalloff = 1 / Math.max(1, Math.sqrt(dist / 30));
      const timeDamping = Math.exp(-localT * 1.6);
      const envelope = wave.amplitude * spatialFalloff * timeDamping;

      // Leading edge fade-in (smooth wavefront)
      const edgeFade = Math.min(1, localT * FREQUENCY * 1.5);

      z += envelope * edgeFade * Math.sin(TWO_PI * FREQUENCY * localT);
    }

    dot.z = z;
  }

  // Render dots
  for (const dot of dots) {
    const z = dot.z;
    const absZ = Math.abs(z);

    // Size: base + displacement
    const size = DOT_BASE + absZ * 0.12;

    // Vertical offset (3D perspective — dots move up when displaced)
    const drawY = dot.y - z * 0.6;

    // Color: cool blue base, shifts toward white/cyan on peaks
    const intensity = Math.min(1, absZ / 12);
    const r = Math.round(30 + intensity * 100);
    const g = Math.round(55 + intensity * 180);
    const b = Math.round(90 + intensity * 165);
    const alpha = 0.35 + intensity * 0.65;

    ctx.beginPath();
    ctx.arc(dot.x, drawY, size, 0, TWO_PI);
    ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
    ctx.fill();

    // Glow on high displacement
    if (absZ > 4) {
      ctx.beginPath();
      ctx.arc(dot.x, drawY, size + absZ * 0.2, 0, TWO_PI);
      ctx.fillStyle = `rgba(${r},${g},${b},${intensity * 0.15})`;
      ctx.fill();
    }
  }

  // Subtle connection lines between neighbors when both displaced
  // Only render horizontal/vertical for performance
  const threshold = 2.5;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const i = r * cols + c;
      const d = dots[i];
      if (Math.abs(d.z) < threshold) continue;

      // Right neighbor
      if (c < cols - 1) {
        const dr = dots[i + 1];
        if (Math.abs(dr.z) >= threshold) {
          const avgZ = (Math.abs(d.z) + Math.abs(dr.z)) / 2;
          const lineAlpha = Math.min(0.25, avgZ / 40);
          ctx.beginPath();
          ctx.moveTo(d.x, d.y - d.z * 0.6);
          ctx.lineTo(dr.x, dr.y - dr.z * 0.6);
          ctx.strokeStyle = `rgba(60,130,200,${lineAlpha})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
      // Down neighbor
      if (r < rows - 1) {
        const dd = dots[i + cols];
        if (Math.abs(dd.z) >= threshold) {
          const avgZ = (Math.abs(d.z) + Math.abs(dd.z)) / 2;
          const lineAlpha = Math.min(0.25, avgZ / 40);
          ctx.beginPath();
          ctx.moveTo(d.x, d.y - d.z * 0.6);
          ctx.lineTo(dd.x, dd.y - dd.z * 0.6);
          ctx.strokeStyle = `rgba(60,130,200,${lineAlpha})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }
  }

  requestAnimationFrame(frame);
}

init();
addEventListener('resize', init);
requestAnimationFrame(frame);
</script>
</body>
</html>
