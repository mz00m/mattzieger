<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matt Zieger</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#e8e4d8;overflow:hidden;font-family:'Courier New',monospace}
canvas{display:block;position:absolute;top:0;left:0}
#bg{z-index:0}
#fg{z-index:1;cursor:grab}
#fg:active{cursor:grabbing}
#ui{position:fixed;z-index:10;top:16px;right:16px;display:flex;gap:8px}
#ui button{background:none;border:1px solid rgba(30,50,85,0.25);color:rgba(30,50,85,0.45);
font:9px/1 'Courier New',monospace;letter-spacing:2px;text-transform:uppercase;
padding:7px 16px;cursor:pointer;transition:all .3s}
#ui button:hover{background:rgba(30,50,85,0.05);border-color:rgba(30,50,85,0.45);color:rgba(30,50,85,0.65)}
#info{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);color:rgba(30,50,85,0.25);
font:8px/1.4 'Courier New',monospace;letter-spacing:2px;text-transform:uppercase;pointer-events:none;text-align:center}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="fg"></canvas>
<div id="ui">
  <button onclick="startMachine()">&#9654; start</button>
  <button onclick="resetMachine()">&#8634; reset</button>
</div>
<div id="info">drag objects to interact &middot; click start to trigger chain</div>

<script>
// ════════════════════════════════════════════════════
//  CONSTANTS
// ════════════════════════════════════════════════════
const INK  = [22, 48, 88];   // primary blue-black
const INK2 = [45, 75, 125];  // medium
const INK3 = [80, 110, 155]; // light
const RED  = [160, 55, 40];  // accent

const ink  = (a=1) => `rgba(${INK[0]},${INK[1]},${INK[2]},${a})`;
const ink2 = (a=1) => `rgba(${INK2[0]},${INK2[1]},${INK2[2]},${a})`;
const ink3 = (a=1) => `rgba(${INK3[0]},${INK3[1]},${INK3[2]},${a})`;
const red  = (a=1) => `rgba(${RED[0]},${RED[1]},${RED[2]},${a})`;

const ISO_ANG = Math.PI / 6;
const DX = Math.cos(ISO_ANG);
const DY = -Math.sin(ISO_ANG);

// ════════════════════════════════════════════════════
//  CANVAS SETUP
// ════════════════════════════════════════════════════
const bgC = document.getElementById('bg');
const fgC = document.getElementById('fg');
const bgX = bgC.getContext('2d');
const fgX = fgC.getContext('2d');
let W, H, dpr, cx, cy;

function resize() {
  dpr = devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  for (const c of [bgC, fgC]) {
    c.width = W * dpr; c.height = H * dpr;
    c.style.width = W + 'px'; c.style.height = H + 'px';
  }
  cx = W / 2; cy = H / 2;
  drawBackground();
}

// ════════════════════════════════════════════════════
//  STATIC BACKGROUND — Rendered once
// ════════════════════════════════════════════════════
function drawBackground() {
  const c = bgX;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);

  // Paper base
  c.fillStyle = '#e8e4d8';
  c.fillRect(0, 0, W, H);

  // Paper grain noise
  const imgD = c.createImageData(W * dpr, H * dpr);
  const d = imgD.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * 12;
    d[i] = 232 + n; d[i+1] = 228 + n; d[i+2] = 216 + n; d[i+3] = 255;
  }
  c.putImageData(imgD, 0, 0);
  c.setTransform(dpr, 0, 0, dpr, 0, 0);

  // Subtle aged spots
  for (let i = 0; i < 6; i++) {
    const gx = Math.random() * W, gy = Math.random() * H;
    const gr = c.createRadialGradient(gx, gy, 0, gx, gy, 40 + Math.random() * 80);
    gr.addColorStop(0, 'rgba(155, 135, 100, 0.04)');
    gr.addColorStop(1, 'rgba(155, 135, 100, 0)');
    c.fillStyle = gr;
    c.fillRect(0, 0, W, H);
  }

  // ── Fine grid ──
  c.beginPath();
  for (let x = 0; x < W; x += 20) { c.moveTo(x, 0); c.lineTo(x, H); }
  for (let y = 0; y < H; y += 20) { c.moveTo(0, y); c.lineTo(W, y); }
  c.strokeStyle = ink3(0.04); c.lineWidth = 0.3; c.stroke();

  // Major grid
  c.beginPath();
  for (let x = 0; x < W; x += 100) { c.moveTo(x, 0); c.lineTo(x, H); }
  for (let y = 0; y < H; y += 100) { c.moveTo(0, y); c.lineTo(W, y); }
  c.strokeStyle = ink3(0.07); c.lineWidth = 0.4; c.stroke();

  // ── Border ──
  const m = 30;
  c.strokeStyle = ink2(0.12); c.lineWidth = 1.5;
  c.strokeRect(m, m, W - m * 2, H - m * 2);
  c.strokeStyle = ink3(0.06); c.lineWidth = 0.4;
  c.strokeRect(m + 5, m + 5, W - m * 2 - 10, H - m * 2 - 10);

  // Corner ticks
  const tk = 16;
  c.strokeStyle = ink2(0.18); c.lineWidth = 0.8;
  for (const [bx, by, dx2, dy2] of [
    [m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]
  ]) {
    c.beginPath(); c.moveTo(bx, by + tk * dy2); c.lineTo(bx, by); c.lineTo(bx + tk * dx2, by); c.stroke();
  }

  // ── Title block ──
  const tbW = 220, tbH = 60;
  const tbX = W - m - tbW, tbY = H - m - tbH;
  c.strokeStyle = ink2(0.15); c.lineWidth = 0.6;
  c.strokeRect(tbX, tbY, tbW, tbH);
  c.beginPath(); c.moveTo(tbX, tbY + 20); c.lineTo(tbX + tbW, tbY + 20); c.stroke();
  c.beginPath(); c.moveTo(tbX, tbY + 40); c.lineTo(tbX + tbW, tbY + 40); c.stroke();
  c.beginPath(); c.moveTo(tbX + 110, tbY); c.lineTo(tbX + 110, tbY + 20); c.stroke();

  c.font = '7px Courier New'; c.fillStyle = ink2(0.25);
  c.fillText('INTERACTIVE BLUEPRINT', tbX + 8, tbY + 14);
  c.fillText('REV 06', tbX + 118, tbY + 14);
  c.font = '12px Courier New'; c.fillStyle = ink(0.3);
  c.fillText('MATT ZIEGER', tbX + 8, tbY + 34);
  c.font = '6px Courier New'; c.fillStyle = ink3(0.2);
  c.fillText('SCALE 1:1  SHEET 1/1  2026-03-17', tbX + 8, tbY + 53);

  // ── Scattered annotations ──
  const notes = [
    [m + 20, m + 18, 'SECTION A-A  —  ISOMETRIC ASSEMBLY', 7],
    [m + 20, m + 30, 'INTERACTIVE PHYSICS SIMULATION / RUBE GOLDBERG MACHINE', 6],
    [cx - 280, m + 20, 'STAGE I', 6], [cx - 80, m + 20, 'STAGE II', 6],
    [cx + 80, m + 20, 'STAGE III', 6], [cx + 240, m + 20, 'STAGE IV', 6],
  ];
  for (const [nx, ny, nt, ns] of notes) {
    c.font = ns + 'px Courier New'; c.fillStyle = ink2(0.18); c.fillText(nt, nx, ny);
  }

  // Random dimension-style labels
  const rng = s => { s = Math.sin(s * 127.1 + 311.7) * 43758.5; return s - Math.floor(s); };
  const dimNotes = ['TYP.','(REF)','2x','4x','M6','Ø12','R8','45°','CL','NTS','Ø8','3x','M10'];
  for (let i = 0; i < 35; i++) {
    const nx = m + 40 + rng(i * 7.3) * (W - m * 2 - 80);
    const ny = m + 40 + rng(i * 11.1 + 5) * (H - m * 2 - 100);
    c.font = (4 + rng(i * 3.7) * 2) + 'px Courier New';
    c.fillStyle = ink3(0.08 + rng(i * 5.1) * 0.06);
    c.fillText(dimNotes[i % dimNotes.length], nx, ny);
  }

  // Random construction/projection lines
  c.setLineDash([5, 4]);
  c.strokeStyle = ink3(0.03); c.lineWidth = 0.3;
  for (let i = 0; i < 12; i++) {
    const lx = rng(i * 13.7) * W, ly = rng(i * 17.3) * H;
    const la = rng(i * 23.1) * Math.PI;
    c.beginPath();
    c.moveTo(lx - Math.cos(la) * 400, ly - Math.sin(la) * 400);
    c.lineTo(lx + Math.cos(la) * 400, ly + Math.sin(la) * 400);
    c.stroke();
  }
  c.setLineDash([]);

  // ── Central name watermark ──
  c.save(); c.globalAlpha = 0.025;
  c.font = 'bold 180px Courier New'; c.fillStyle = ink(1);
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('MATT Z.', cx, cy);
  c.restore();

  // Vignette
  const vig = c.createRadialGradient(cx, cy, Math.min(W, H) * 0.3, cx, cy, Math.max(W, H) * 0.75);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.07)');
  c.fillStyle = vig;
  c.fillRect(0, 0, W, H);
}

// ════════════════════════════════════════════════════
//  3D DRAWING HELPERS
// ════════════════════════════════════════════════════

// Hatch a polygon region
function hatch(ctx, pts, angle, spacing, alpha, lineW) {
  if (!pts || pts.length < 3) return;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath(); ctx.clip();

  let mnx = Infinity, mny = Infinity, mxx = -Infinity, mxy = -Infinity;
  for (const p of pts) { mnx = Math.min(mnx, p.x); mny = Math.min(mny, p.y); mxx = Math.max(mxx, p.x); mxy = Math.max(mxy, p.y); }
  const diag = Math.hypot(mxx - mnx, mxy - mny) + 30;
  const ccx = (mnx + mxx) / 2, ccy = (mny + mxy) / 2;
  const ca = Math.cos(angle), sa = Math.sin(angle);

  ctx.beginPath();
  for (let d = -diag; d < diag; d += spacing) {
    ctx.moveTo(ccx + ca * diag + sa * d, ccy + sa * diag - ca * d);
    ctx.lineTo(ccx - ca * diag + sa * d, ccy - sa * diag - ca * d);
  }
  ctx.strokeStyle = ink2(alpha || 0.1);
  ctx.lineWidth = lineW || 0.4;
  ctx.stroke();
  ctx.restore();
}

// 3D isometric box with full face rendering
function draw3DBox(ctx, x, y, w, h, depth, opts = {}) {
  const d = depth || 12;
  const ex = d * 0.86, ey = d * -0.5; // iso projection
  const a = opts.alpha || 1;
  const fillA = opts.fillAlpha || 0.015;

  // ── Right side face ──
  const rf = [{x: x+w, y}, {x: x+w+ex, y: y+ey}, {x: x+w+ex, y: y+h+ey}, {x: x+w, y: y+h}];
  ctx.beginPath(); ctx.moveTo(rf[0].x,rf[0].y); for(let i=1;i<4;i++) ctx.lineTo(rf[i].x,rf[i].y);
  ctx.closePath();
  ctx.fillStyle = ink(0.04 * a); ctx.fill();
  ctx.strokeStyle = ink(0.35 * a); ctx.lineWidth = 0.7; ctx.stroke();
  hatch(ctx, rf, -0.4, 3, 0.1 * a, 0.3);

  // ── Top face ──
  const tf = [{x, y}, {x: x+ex, y: y+ey}, {x: x+w+ex, y: y+ey}, {x: x+w, y}];
  ctx.beginPath(); ctx.moveTo(tf[0].x,tf[0].y); for(let i=1;i<4;i++) ctx.lineTo(tf[i].x,tf[i].y);
  ctx.closePath();
  ctx.fillStyle = ink3(0.02 * a); ctx.fill();
  ctx.strokeStyle = ink(0.3 * a); ctx.lineWidth = 0.6; ctx.stroke();
  hatch(ctx, tf, 1.2, 3.5, 0.07 * a, 0.25);

  // ── Front face ──
  const ff = [{x, y}, {x: x+w, y}, {x: x+w, y: y+h}, {x, y: y+h}];
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+w,y); ctx.lineTo(x+w,y+h); ctx.lineTo(x,y+h); ctx.closePath();
  ctx.fillStyle = ink3(fillA * a); ctx.fill();
  ctx.strokeStyle = ink(0.45 * a); ctx.lineWidth = opts.heavy ? 1.4 : 0.9; ctx.stroke();
  if (opts.hatch !== false) hatch(ctx, ff, 0.6, opts.hatchSp || 4.5, 0.07 * a, 0.3);

  // ── Hidden edges (dashed) ──
  ctx.setLineDash([2, 2.5]);
  ctx.strokeStyle = ink2(0.08 * a); ctx.lineWidth = 0.3;
  ctx.beginPath(); ctx.moveTo(x + ex, y + ey); ctx.lineTo(x + ex, y + h + ey); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + ex, y + h + ey); ctx.lineTo(x, y + h); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + ex, y + h + ey); ctx.lineTo(x + w + ex, y + h + ey); ctx.stroke();
  ctx.setLineDash([]);

  // ── Rivet/bolt details ──
  if (opts.bolts) {
    const bx1 = x + 4, bx2 = x + w - 4, by1 = y + 4, by2 = y + h - 4;
    for (const [bpx, bpy] of [[bx1,by1],[bx2,by1],[bx1,by2],[bx2,by2]]) {
      ctx.beginPath(); ctx.arc(bpx, bpy, 1.5, 0, Math.PI * 2);
      ctx.strokeStyle = ink(0.3 * a); ctx.lineWidth = 0.5; ctx.stroke();
      ctx.beginPath(); ctx.arc(bpx, bpy, 0.5, 0, Math.PI * 2);
      ctx.fillStyle = ink(0.25 * a); ctx.fill();
    }
  }
}

// Detailed 3D sphere with latitude/longitude hatching
function draw3DSphere(ctx, bx, by, r, opts = {}) {
  const a = opts.alpha || 1;

  // Shadow ellipse
  ctx.beginPath(); ctx.ellipse(bx + 4, by + r + 4, r * 0.7, r * 0.15, 0, 0, Math.PI * 2);
  ctx.fillStyle = ink(0.03 * a); ctx.fill();

  // Sphere outline
  ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(232,228,216,0.4)'; ctx.fill();

  // Latitude lines (horizontal ellipses)
  for (let i = -3; i <= 3; i++) {
    const ly = by + (i / 4) * r;
    const lrx = Math.sqrt(r * r - (i / 4 * r) ** 2);
    const lry = lrx * 0.2;
    ctx.beginPath(); ctx.ellipse(bx, ly, lrx, lry, 0, 0, Math.PI * 2);
    ctx.strokeStyle = ink2(0.08 * a); ctx.lineWidth = 0.3; ctx.stroke();
  }

  // Longitude lines (vertical ellipses)
  for (let i = 0; i < 6; i++) {
    const la = (i / 6) * Math.PI;
    ctx.save(); ctx.translate(bx, by);
    ctx.beginPath(); ctx.ellipse(0, 0, Math.cos(la) * r, r, 0, 0, Math.PI * 2);
    ctx.strokeStyle = ink2(0.06 * a); ctx.lineWidth = 0.25; ctx.stroke();
    ctx.restore();
  }

  // Directional hatching (shadow side)
  ctx.save();
  ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2); ctx.clip();
  for (let i = -r * 2; i < r * 1; i += 2) {
    const sx = bx + i;
    // Vary density: denser on left (shadow side)
    const density = Math.max(0, 1 - (i + r) / (r * 2));
    if (Math.random() > density * 0.7 + 0.2) continue;
    ctx.beginPath();
    ctx.moveTo(sx, by - r); ctx.lineTo(sx - r * 0.6, by + r);
    ctx.strokeStyle = ink2((0.04 + density * 0.08) * a); ctx.lineWidth = 0.3; ctx.stroke();
  }
  // Cross-hatch on darkest area
  for (let i = -r * 2; i < -r * 0.3; i += 2.5) {
    const sx = bx + i;
    ctx.beginPath();
    ctx.moveTo(sx, by - r); ctx.lineTo(sx + r * 0.8, by + r);
    ctx.strokeStyle = ink2(0.04 * a); ctx.lineWidth = 0.2; ctx.stroke();
  }
  ctx.restore();

  // Specular highlight
  const hg = ctx.createRadialGradient(bx - r * 0.3, by - r * 0.3, 0, bx - r * 0.3, by - r * 0.3, r * 0.5);
  hg.addColorStop(0, 'rgba(255,255,255,0.15)'); hg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2); ctx.fill();

  // Outline
  ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2);
  ctx.strokeStyle = ink(0.45 * a); ctx.lineWidth = 1.2; ctx.stroke();

  // Center crosshair
  ctx.beginPath(); ctx.moveTo(bx - 5, by); ctx.lineTo(bx + 5, by);
  ctx.moveTo(bx, by - 5); ctx.lineTo(bx, by + 5);
  ctx.strokeStyle = ink2(0.15 * a); ctx.lineWidth = 0.4; ctx.stroke();
}

// Detailed gear
function draw3DGear(ctx, gx, gy, r, teeth, angle, opts = {}) {
  const a = opts.alpha || 1;
  ctx.save(); ctx.translate(gx, gy); ctx.rotate(angle);

  const toothH = r * 0.15;
  const toothW = (Math.PI * 2 / teeth) * 0.35;

  // Gear body
  ctx.beginPath();
  for (let i = 0; i < teeth; i++) {
    const a1 = (i / teeth) * Math.PI * 2;
    const a2 = a1 + toothW;
    const a3 = a2 + toothW * 0.3;
    const a4 = (i + 1) / teeth * Math.PI * 2;
    ctx.lineTo(Math.cos(a1) * r, Math.sin(a1) * r);
    ctx.lineTo(Math.cos(a1) * (r + toothH), Math.sin(a1) * (r + toothH));
    ctx.lineTo(Math.cos(a2) * (r + toothH), Math.sin(a2) * (r + toothH));
    ctx.lineTo(Math.cos(a3) * r, Math.sin(a3) * r);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(232,228,216,0.3)'; ctx.fill();
  ctx.strokeStyle = ink(0.4 * a); ctx.lineWidth = 0.9; ctx.stroke();

  // Inner detail rings
  for (const rr of [0.75, 0.55, 0.35]) {
    ctx.beginPath(); ctx.arc(0, 0, r * rr, 0, Math.PI * 2);
    ctx.strokeStyle = ink2((0.12 + (1 - rr) * 0.1) * a); ctx.lineWidth = 0.4; ctx.stroke();
  }

  // Spokes
  const spokeCount = Math.min(teeth, 6);
  for (let i = 0; i < spokeCount; i++) {
    const sa = (i / spokeCount) * Math.PI * 2;
    ctx.beginPath();
    // Tapered spoke
    const sw = 3;
    ctx.moveTo(Math.cos(sa - 0.05) * r * 0.18, Math.sin(sa - 0.05) * r * 0.18);
    ctx.lineTo(Math.cos(sa - 0.02) * r * 0.52, Math.sin(sa - 0.02) * r * 0.52);
    ctx.lineTo(Math.cos(sa + 0.02) * r * 0.52, Math.sin(sa + 0.02) * r * 0.52);
    ctx.lineTo(Math.cos(sa + 0.05) * r * 0.18, Math.sin(sa + 0.05) * r * 0.18);
    ctx.closePath();
    ctx.fillStyle = ink3(0.03 * a); ctx.fill();
    ctx.strokeStyle = ink2(0.15 * a); ctx.lineWidth = 0.4; ctx.stroke();
  }

  // Lightening holes between spokes
  for (let i = 0; i < spokeCount; i++) {
    const sa = ((i + 0.5) / spokeCount) * Math.PI * 2;
    const hx = Math.cos(sa) * r * 0.42, hy = Math.sin(sa) * r * 0.42;
    ctx.beginPath(); ctx.arc(hx, hy, r * 0.08, 0, Math.PI * 2);
    ctx.strokeStyle = ink2(0.12 * a); ctx.lineWidth = 0.35; ctx.stroke();
  }

  // Hub
  ctx.beginPath(); ctx.arc(0, 0, r * 0.18, 0, Math.PI * 2);
  ctx.strokeStyle = ink(0.4 * a); ctx.lineWidth = 1; ctx.stroke();

  // Keyway
  ctx.beginPath(); ctx.arc(0, 0, r * 0.06, 0, Math.PI * 2);
  ctx.fillStyle = ink(0.3 * a); ctx.fill();
  ctx.fillRect(-1, -r * 0.15, 2, r * 0.09);

  // 3D thickness on top
  const td = 5;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.95, -Math.PI * 0.8, Math.PI * 0.1);
  ctx.strokeStyle = ink2(0.06 * a); ctx.lineWidth = td;
  ctx.stroke();

  ctx.restore();
}

// Detailed cylinder/piston
function draw3DCylinder(ctx, bx, by, rx, ry, h, ang, opts = {}) {
  const a = opts.alpha || 1;
  ctx.save(); ctx.translate(bx, by); ctx.rotate(ang || 0);

  // Shadow
  ctx.beginPath(); ctx.ellipse(4, h + 3, rx * 0.8, ry * 0.6, 0, 0, Math.PI * 2);
  ctx.fillStyle = ink(0.02 * a); ctx.fill();

  // Back ellipse
  ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
  ctx.setLineDash([2, 2]); ctx.strokeStyle = ink2(0.1 * a); ctx.lineWidth = 0.3; ctx.stroke();
  ctx.setLineDash([]);

  // Side lines
  ctx.beginPath(); ctx.moveTo(-rx, 0); ctx.lineTo(-rx, h);
  ctx.moveTo(rx, 0); ctx.lineTo(rx, h);
  ctx.strokeStyle = ink(0.4 * a); ctx.lineWidth = 0.8; ctx.stroke();

  // Body hatching
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(-rx, 0); ctx.lineTo(-rx, h);
  ctx.ellipse(0, h, rx, ry, 0, Math.PI, 0, true);
  ctx.lineTo(rx, 0);
  ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI);
  ctx.closePath(); ctx.clip();
  // Vertical hatching denser on left (shadow)
  for (let i = -rx; i < rx; i += 2) {
    const darkness = 1 - (i + rx) / (rx * 2);
    if (Math.random() > darkness * 0.6 + 0.3) continue;
    ctx.beginPath(); ctx.moveTo(i, -ry); ctx.lineTo(i, h + ry);
    ctx.strokeStyle = ink2((0.03 + darkness * 0.06) * a); ctx.lineWidth = 0.3; ctx.stroke();
  }
  // Horizontal ring lines
  for (let j = 0; j < h; j += 8) {
    ctx.beginPath(); ctx.ellipse(0, j, rx * 0.98, ry * 0.5, 0, 0, Math.PI * 2);
    ctx.strokeStyle = ink3(0.04 * a); ctx.lineWidth = 0.2; ctx.stroke();
  }
  ctx.restore();

  // Front ellipse cap
  ctx.beginPath(); ctx.ellipse(0, h, rx, ry, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(232,228,216,0.3)'; ctx.fill();
  ctx.strokeStyle = ink(0.4 * a); ctx.lineWidth = 0.9; ctx.stroke();

  // Inner cap rings
  ctx.beginPath(); ctx.ellipse(0, h, rx * 0.6, ry * 0.6, 0, 0, Math.PI * 2);
  ctx.strokeStyle = ink2(0.15 * a); ctx.lineWidth = 0.4; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, h, rx * 0.25, ry * 0.25, 0, 0, Math.PI * 2);
  ctx.strokeStyle = ink2(0.2 * a); ctx.lineWidth = 0.5; ctx.stroke();

  // Center mark
  ctx.beginPath(); ctx.moveTo(-4, h); ctx.lineTo(4, h);
  ctx.moveTo(0, h - 3); ctx.lineTo(0, h + 3);
  ctx.strokeStyle = ink2(0.15 * a); ctx.lineWidth = 0.4; ctx.stroke();

  // Piston rod (opts.rod)
  if (opts.rod) {
    const rodLen = opts.rod;
    ctx.beginPath(); ctx.moveTo(-2, h); ctx.lineTo(-2, h + rodLen);
    ctx.lineTo(2, h + rodLen); ctx.lineTo(2, h);
    ctx.strokeStyle = ink(0.3 * a); ctx.lineWidth = 0.6; ctx.stroke();
    // Rod hatching
    for (let i = h; i < h + rodLen; i += 2.5) {
      ctx.beginPath(); ctx.moveTo(-2, i); ctx.lineTo(2, i);
      ctx.strokeStyle = ink3(0.05 * a); ctx.lineWidth = 0.2; ctx.stroke();
    }
  }

  ctx.restore();
}

// Dimension line helper
function dimLine(ctx, x1, y1, x2, y2, label, offset) {
  offset = offset || 14;
  const ang = Math.atan2(y2 - y1, x2 - x1);
  const px = -Math.sin(ang) * offset, py = Math.cos(ang) * offset;

  ctx.strokeStyle = ink2(0.18); ctx.lineWidth = 0.35;
  ctx.beginPath();
  ctx.moveTo(x1, y1); ctx.lineTo(x1 + px, y1 + py);
  ctx.moveTo(x2, y2); ctx.lineTo(x2 + px, y2 + py);
  ctx.moveTo(x1 + px, y1 + py); ctx.lineTo(x2 + px, y2 + py);
  ctx.stroke();

  // Arrowheads
  const as = 3.5;
  for (const [sx, sy, dir] of [[x1+px,y1+py,1],[x2+px,y2+py,-1]]) {
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx + Math.cos(ang + 0.35) * as * dir, sy + Math.sin(ang + 0.35) * as * dir);
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx + Math.cos(ang - 0.35) * as * dir, sy + Math.sin(ang - 0.35) * as * dir);
    ctx.stroke();
  }

  ctx.save();
  ctx.translate((x1 + x2) / 2 + px, (y1 + y2) / 2 + py);
  let ta = ang; if (ta > Math.PI / 2 || ta < -Math.PI / 2) ta += Math.PI;
  ctx.rotate(ta);
  ctx.font = '5px Courier New'; ctx.fillStyle = ink2(0.25);
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillText(label, 0, -2);
  ctx.restore();
}

// ════════════════════════════════════════════════════
//  MATTER.JS PHYSICS
// ════════════════════════════════════════════════════
const { Engine, Bodies, Body, Composite, Constraint, Events, Mouse, MouseConstraint, Vector } = Matter;
const engine = Engine.create({ gravity: { x: 0, y: 0.8 } });
const world = engine.world;

let objects = []; // {body, draw: fn, type: string}
let constraints = [];
let gears = [];
let particles = [];
let started = false;

function addBody(body, drawFn, type) {
  Composite.add(world, body);
  objects.push({ body, draw: drawFn, type: type || '' });
  return body;
}

function addConstraint(con) {
  Composite.add(world, con);
  constraints.push(con);
  return con;
}

function buildMachine() {
  Composite.clear(world, false);
  objects = []; constraints = []; gears = []; particles = [];
  started = false;

  // Walls (invisible)
  const wallOpts = { isStatic: true, friction: 0.4, restitution: 0.3, label: 'wall' };
  Composite.add(world, [
    Bodies.rectangle(cx, H + 20, W * 2, 40, wallOpts),
    Bodies.rectangle(-20, cy, 40, H * 2, wallOpts),
    Bodies.rectangle(W + 20, cy, 40, H * 2, wallOpts),
  ]);

  const midY = cy - 20;

  // ════════════════════════════════════════════════
  // OBJECT 1: Large isometric monolith "MATT Z." text block
  // ════════════════════════════════════════════════
  const monoW = 320, monoH = 80, monoD = 18;
  const monoX = cx - monoW / 2, monoY = midY - monoH / 2;
  const monoBody = addBody(
    Bodies.rectangle(cx, midY, monoW, monoH, { isStatic: true, label: 'monolith', friction: 0.3, restitution: 0.15 }),
    function(ctx) {
      const b = this.body;
      ctx.save(); ctx.translate(b.position.x, b.position.y); ctx.rotate(b.angle);
      const bx = -monoW/2, by = -monoH/2;

      draw3DBox(ctx, bx, by, monoW, monoH, monoD, { heavy: true, hatchSp: 5, bolts: true, fillAlpha: 0.01 });

      // Inner recessed panel
      draw3DBox(ctx, bx + 12, by + 10, monoW - 24, monoH - 20, 4, { alpha: 0.6, hatchSp: 6, fillAlpha: 0.005 });

      // Text
      ctx.font = 'bold 38px Courier New';
      ctx.fillStyle = ink(0.35);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('MATT Z.', 0, 2);

      // Subtle text shadow / engrave effect
      ctx.fillStyle = ink(0.06);
      ctx.fillText('MATT Z.', 0.8, 2.8);

      // Mounting brackets on sides
      for (const sx of [-1, 1]) {
        const mx = sx * (monoW / 2 + 5);
        ctx.beginPath();
        ctx.moveTo(mx, -15); ctx.lineTo(mx + sx * 12, -15);
        ctx.lineTo(mx + sx * 12, 15); ctx.lineTo(mx, 15);
        ctx.strokeStyle = ink(0.2); ctx.lineWidth = 0.6; ctx.stroke();
        // Bolt
        ctx.beginPath(); ctx.arc(mx + sx * 7, 0, 2, 0, Math.PI * 2);
        ctx.strokeStyle = ink(0.25); ctx.lineWidth = 0.5; ctx.stroke();
      }

      ctx.restore();
    },
    'monolith'
  );

  // ════════════════════════════════════════════════
  // OBJECT 2: Large gear (left side)
  // ════════════════════════════════════════════════
  const g1x = cx - 220, g1y = midY + 120;
  gears.push({ x: g1x, y: g1y, r: 50, teeth: 14, angle: 0, speed: 0.4,
    draw(ctx) { draw3DGear(ctx, this.x, this.y, this.r, this.teeth, this.angle); }
  });

  // OBJECT 3: Small meshing gear
  const g2x = g1x + 68, g2y = g1y;
  gears.push({ x: g2x, y: g2y, r: 28, teeth: 8, angle: 0, speed: -0.4 * (50/28),
    draw(ctx) { draw3DGear(ctx, this.x, this.y, this.r, this.teeth, this.angle); }
  });

  // ════════════════════════════════════════════════
  // OBJECT 4: Pendulum (left)
  // ════════════════════════════════════════════════
  const pendAnchorX = cx - 150, pendAnchorY = midY - 130;
  const pendBob = addBody(
    Bodies.circle(pendAnchorX - 40, pendAnchorY + 120, 16, {
      density: 0.006, restitution: 0.4, friction: 0.15, label: 'pendulum'
    }),
    function(ctx) {
      draw3DSphere(ctx, this.body.position.x, this.body.position.y, 16);
    },
    'pendulum'
  );
  const pendCon = addConstraint(
    Constraint.create({ bodyA: pendBob.body, pointB: { x: pendAnchorX, y: pendAnchorY }, length: 130, stiffness: 0.9, damping: 0.002 })
  );

  // ════════════════════════════════════════════════
  // OBJECT 5: Rolling sphere (start ball)
  // ════════════════════════════════════════════════
  const startBall = addBody(
    Bodies.circle(cx - 280, midY - 100, 14, {
      restitution: 0.55, friction: 0.3, density: 0.004, label: 'ball', isStatic: true
    }),
    function(ctx) {
      draw3DSphere(ctx, this.body.position.x, this.body.position.y, 14, { alpha: 1 });
    },
    'startBall'
  );

  // Starting ramp
  addBody(
    Bodies.rectangle(cx - 220, midY - 70, 160, 6, { isStatic: true, angle: 0.25, friction: 0.3, restitution: 0.15, label: 'ramp' }),
    function(ctx) {
      const b = this.body, v = b.vertices;
      const pts = v.map(vv => ({x: vv.x, y: vv.y}));
      // Draw as 3D plank
      ctx.save(); ctx.translate(b.position.x, b.position.y); ctx.rotate(b.angle);
      draw3DBox(ctx, -80, -3, 160, 6, 8, { hatchSp: 3, bolts: false });
      ctx.restore();
    },
    'ramp'
  );

  // ════════════════════════════════════════════════
  // OBJECT 6: Domino chain (5 dominoes on a shelf)
  // ════════════════════════════════════════════════
  const domShelfX = cx - 60, domShelfY = midY + 25;
  addBody(
    Bodies.rectangle(domShelfX + 40, domShelfY + 10, 130, 6, { isStatic: true, friction: 0.6, restitution: 0.05, label: 'shelf' }),
    function(ctx) {
      const b = this.body;
      ctx.save(); ctx.translate(b.position.x, b.position.y); ctx.rotate(b.angle);
      draw3DBox(ctx, -65, -3, 130, 6, 10, { hatchSp: 4 });
      ctx.restore();
    },
    'shelf'
  );

  for (let i = 0; i < 5; i++) {
    addBody(
      Bodies.rectangle(domShelfX + i * 22, domShelfY - 15, 6, 30, {
        friction: 0.6, restitution: 0.05, density: 0.003, label: 'domino'
      }),
      function(ctx) {
        const b = this.body;
        ctx.save(); ctx.translate(b.position.x, b.position.y); ctx.rotate(b.angle);
        draw3DBox(ctx, -3, -15, 6, 30, 5, { hatchSp: 2.5, alpha: 0.9, fillAlpha: 0.03 });
        // Domino dots
        ctx.beginPath(); ctx.arc(0, -6, 1.2, 0, Math.PI * 2); ctx.fillStyle = ink(0.2); ctx.fill();
        ctx.beginPath(); ctx.arc(0, 6, 1.2, 0, Math.PI * 2); ctx.fillStyle = ink(0.2); ctx.fill();
        // Divider line
        ctx.beginPath(); ctx.moveTo(-3, 0); ctx.lineTo(3, 0);
        ctx.strokeStyle = ink(0.15); ctx.lineWidth = 0.4; ctx.stroke();
        ctx.restore();
      },
      'domino'
    );
  }

  // ════════════════════════════════════════════════
  // OBJECT 7: Seesaw / lever mechanism
  // ════════════════════════════════════════════════
  const seesawX = cx + 140, seesawY = midY + 60;
  const seesawArm = addBody(
    Bodies.rectangle(seesawX, seesawY, 160, 7, { friction: 0.5, density: 0.002, label: 'seesaw' }),
    function(ctx) {
      const b = this.body;
      ctx.save(); ctx.translate(b.position.x, b.position.y); ctx.rotate(b.angle);
      draw3DBox(ctx, -80, -3.5, 160, 7, 6, { hatchSp: 3, bolts: true });
      ctx.restore();
    },
    'seesaw'
  );
  addConstraint(Constraint.create({ bodyA: seesawArm.body, pointB: { x: seesawX, y: seesawY }, length: 0, stiffness: 0.95 }));

  // Fulcrum triangle
  const fulcrum = addBody(
    Bodies.polygon(seesawX, seesawY + 20, 3, 18, { isStatic: true, angle: Math.PI, label: 'fulcrum' }),
    function(ctx) {
      const b = this.body, v = b.vertices;
      ctx.beginPath(); ctx.moveTo(v[0].x, v[0].y);
      for (let i = 1; i < v.length; i++) ctx.lineTo(v[i].x, v[i].y);
      ctx.closePath();
      const pts = v.map(vv => ({x: vv.x, y: vv.y}));
      ctx.fillStyle = ink3(0.02); ctx.fill();
      ctx.strokeStyle = ink(0.35); ctx.lineWidth = 0.9; ctx.stroke();
      hatch(ctx, pts, 0.5, 3.5, 0.08);
    },
    'fulcrum'
  );

  // Ball on seesaw right end
  addBody(
    Bodies.circle(seesawX + 60, seesawY - 15, 10, { restitution: 0.6, friction: 0.3, density: 0.004, label: 'ball' }),
    function(ctx) { draw3DSphere(ctx, this.body.position.x, this.body.position.y, 10); },
    'seesawBall'
  );

  // ════════════════════════════════════════════════
  // OBJECT 8: Cylinder / piston (right side)
  // ════════════════════════════════════════════════
  const cylX = cx + 260, cylY = midY - 60;
  gears.push({
    x: cylX, y: cylY, pistonPhase: 0, speed: 1.2,
    draw(ctx) {
      const py = Math.sin(this.pistonPhase) * 12;
      draw3DCylinder(ctx, this.x, this.y + py, 20, 8, 45, 0, { rod: 20 });
      // Piston cap ring
      ctx.beginPath(); ctx.ellipse(this.x, this.y + py, 20, 8, 0, 0, Math.PI * 2);
      ctx.strokeStyle = ink(0.15); ctx.lineWidth = 0.4; ctx.stroke();
    }
  });

  // ════════════════════════════════════════════════
  // OBJECT 9: Newton's cradle (3 balls, top right)
  // ════════════════════════════════════════════════
  const ncX = cx + 180, ncY = midY - 150;
  for (let i = 0; i < 4; i++) {
    const nb = addBody(
      Bodies.circle(ncX + i * 18, ncY + 70, 8, {
        density: 0.006, restitution: 0.99, friction: 0.01, label: 'ball'
      }),
      function(ctx) { draw3DSphere(ctx, this.body.position.x, this.body.position.y, 8); },
      'newton'
    );
    addConstraint(Constraint.create({
      bodyA: nb.body, pointB: { x: ncX + i * 18, y: ncY }, length: 70, stiffness: 0.95, damping: 0.001
    }));
  }

  // Newton's cradle frame
  gears.push({
    x: ncX, y: ncY,
    draw(ctx) {
      // Horizontal bar
      draw3DBox(ctx, this.x - 8, this.y - 4, 62, 5, 6, { hatchSp: 3, alpha: 0.7 });
      // Vertical supports
      draw3DBox(ctx, this.x - 8, this.y - 4, 4, 25, 4, { hatchSp: 2, alpha: 0.5 });
      draw3DBox(ctx, this.x + 50, this.y - 4, 4, 25, 4, { hatchSp: 2, alpha: 0.5 });
    }
  });

  // ════════════════════════════════════════════════
  // OBJECT 10: Second ramp (connects stages)
  // ════════════════════════════════════════════════
  addBody(
    Bodies.rectangle(cx + 40, midY - 20, 120, 6, { isStatic: true, angle: -0.2, friction: 0.3, restitution: 0.15, label: 'ramp2' }),
    function(ctx) {
      const b = this.body;
      ctx.save(); ctx.translate(b.position.x, b.position.y); ctx.rotate(b.angle);
      draw3DBox(ctx, -60, -3, 120, 6, 8, { hatchSp: 3 });
      ctx.restore();
    },
    'ramp2'
  );

  // Bucket at bottom center
  const bktX = cx, bktY = midY + 160;
  for (const [bx2, by2, bw2, bh2, ba2] of [
    [bktX - 30, bktY, 6, 50, 0],
    [bktX + 30, bktY, 6, 50, 0],
    [bktX, bktY + 22, 66, 6, 0],
  ]) {
    addBody(
      Bodies.rectangle(bx2, by2, bw2, bh2, { isStatic: true, angle: ba2, friction: 0.3, restitution: 0.15, label: 'bucket' }),
      function(ctx) {
        const b = this.body;
        ctx.save(); ctx.translate(b.position.x, b.position.y); ctx.rotate(b.angle);
        draw3DBox(ctx, -bw2/2, -bh2/2, bw2, bh2, 5, { hatchSp: 2.5, alpha: 0.7 });
        ctx.restore();
      },
      'bucket'
    );
  }

  // ── Mouse constraint ──
  const mouse = Mouse.create(fgC);
  mouse.pixelRatio = dpr;
  const mc = MouseConstraint.create(engine, {
    mouse,
    constraint: { stiffness: 0.08, render: { visible: false } }
  });
  Composite.add(world, mc);

  // ── Collision particles ──
  Events.on(engine, 'collisionStart', e => {
    for (const pair of e.pairs) {
      const spd = Vector.magnitude(Vector.sub(pair.bodyA.velocity, pair.bodyB.velocity));
      if (spd > 2) {
        const pt = pair.collision.supports?.[0] || pair.bodyA.position;
        for (let i = 0; i < Math.min(spd * 1.5, 8); i++) {
          particles.push({
            x: pt.x, y: pt.y,
            vx: (Math.random() - 0.5) * spd * 0.8,
            vy: (Math.random() - 0.5) * spd * 0.8 - 1,
            life: 1, size: Math.random() * 1.5 + 0.3
          });
        }
      }
    }
  });

  // Store references for start
  window._startBall = startBall;
}

// ════════════════════════════════════════════════════
//  START / RESET
// ════════════════════════════════════════════════════
function startMachine() {
  if (started) return;
  started = true;
  if (window._startBall) {
    Body.setStatic(window._startBall.body, false);
    Body.setVelocity(window._startBall.body, { x: 2, y: 0 });
  }
}

function resetMachine() {
  buildMachine();
}

// ════════════════════════════════════════════════════
//  FOREGROUND RENDER LOOP
// ════════════════════════════════════════════════════
let lastT = performance.now();
let time = 0;

function frame(now) {
  const dt = Math.min((now - lastT) / 1000, 0.033);
  lastT = now; time += dt;

  Engine.update(engine, dt * 1000);

  // Update gears
  for (const g of gears) {
    if (g.angle !== undefined) g.angle += (g.speed || 0) * dt;
    if (g.pistonPhase !== undefined) g.pistonPhase += (g.speed || 0) * dt;
  }

  // Clear foreground
  const c = fgX;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, W, H);

  // ── Draw constraints (pendulum strings, etc.) ──
  for (const con of constraints) {
    if (!con.bodyA) continue;
    const pA = con.bodyA.position;
    const pB = con.pointB;
    if (!pB) continue;

    // String/rod
    c.beginPath(); c.moveTo(pA.x, pA.y); c.lineTo(pB.x, pB.y);
    c.strokeStyle = ink(0.2); c.lineWidth = 0.7;
    c.setLineDash([3, 2]); c.stroke(); c.setLineDash([]);

    // Anchor point
    c.beginPath(); c.arc(pB.x, pB.y, 3, 0, Math.PI * 2);
    c.strokeStyle = ink(0.3); c.lineWidth = 0.6; c.stroke();
    c.beginPath(); c.arc(pB.x, pB.y, 1, 0, Math.PI * 2);
    c.fillStyle = ink(0.3); c.fill();

    // Mount bracket
    draw3DBox(c, pB.x - 6, pB.y - 3, 12, 3, 3, { alpha: 0.4, hatchSp: 2 });
  }

  // ── Draw gear/mechanical decorations ──
  for (const g of gears) g.draw(c);

  // ── Draw physics objects ──
  for (const obj of objects) {
    if (obj.body.label === 'wall') continue;
    obj.draw.call(obj, c);
  }

  // ── Dimension lines on key objects ──
  if (objects.length > 0) {
    // Monolith dimensions
    const mb = objects.find(o => o.type === 'monolith');
    if (mb) {
      const p = mb.body.position;
      dimLine(c, p.x - 160, p.y + 40 + 5, p.x + 160, p.y + 40 + 5, '320mm', 12);
      dimLine(c, p.x + 160 + 5, p.y - 40, p.x + 160 + 5, p.y + 40, '80mm', 12);
    }
  }

  // ── Particles ──
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life -= dt * 3;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    c.beginPath(); c.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    c.fillStyle = ink2(p.life * 0.3); c.fill();
  }

  // ── Finish flag ──
  c.beginPath(); c.moveTo(cx, midY + 185); c.lineTo(cx, midY + 155);
  c.lineTo(cx + 18, midY + 160); c.lineTo(cx, midY + 165);
  c.strokeStyle = red(0.2); c.lineWidth = 0.5; c.stroke();
  c.font = '5px Courier New'; c.fillStyle = red(0.2);
  c.fillText('FINISH', cx + 3, midY + 152);

  requestAnimationFrame(frame);
}

// ════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════
resize();
buildMachine();
requestAnimationFrame(frame);
addEventListener('resize', resize);

// Zoom
fgC.addEventListener('wheel', e => {
  e.preventDefault();
  // Could add zoom later
}, { passive: false });

fgC.addEventListener('contextmenu', e => e.preventDefault());
</script>
