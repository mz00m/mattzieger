<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matt Zieger</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #2a2535; overflow: hidden; cursor: crosshair; }
#wave-canvas {
  display: block;
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
}
</style>
</head>
<body>
<canvas id="wave-canvas"></canvas>

<!-- Water surface simulation: Sargent watercolor style -->
<script>
(function() {
  const canvas = document.getElementById('wave-canvas');
  const ctx = canvas.getContext('2d');

  const SCALE = 3;
  const DAMPING = 0.985;
  const RIPPLE_RADIUS = 14;
  const RIPPLE_STRENGTH = 200;

  let W, H, simW, simH;
  let buf1, buf2;
  let noiseMap, noiseMap2;

  const simCanvas = document.createElement('canvas');
  const simCtx = simCanvas.getContext('2d');
  let imageData, pixels;

  // --- Sargent watercolor palette ---
  // From "Venetian Canal" (amber/lavender) + "In a Levantine Port" (cerulean/teal)
  // Each sub-array: [R, G, B]
  const SHADOWS = [
    [80, 68, 100],   // lavender shadow
    [55, 62, 80],    // slate-violet
    [45, 70, 78],    // deep teal shadow
    [65, 55, 75],    // muted mauve
    [50, 65, 72],    // dark aqua
  ];
  const MIDS = [
    [95, 140, 165],  // cerulean blue
    [80, 130, 135],  // teal-aquamarine
    [110, 145, 140], // sage-aqua
    [140, 115, 72],  // raw sienna
    [120, 100, 65],  // warm ochre
  ];
  const LIGHTS = [
    [210, 190, 130], // golden reflection
    [225, 205, 155], // warm cream
    [175, 195, 205], // pale cerulean
    [240, 222, 175], // bright cream
    [195, 210, 195], // pale aqua
  ];

  function hash(x, y, seed) {
    const v = Math.sin(x * 12.9898 + y * 78.233 + seed) * 43758.5453;
    return v - Math.floor(v); // always 0..1
  }

  function buildNoise() {
    noiseMap = new Float32Array(simW * simH);
    noiseMap2 = new Float32Array(simW * simH);
    for (let y = 0; y < simH; y++) {
      for (let x = 0; x < simW; x++) {
        const i = y * simW + x;
        // Two independent noise channels, each 0..1
        noiseMap[i] = hash(x * 0.07, y * 0.07, 1.0) * 0.5
                    + hash(x * 0.14, y * 0.14, 2.0) * 0.3
                    + hash(x * 0.28, y * 0.28, 3.0) * 0.2;
        noiseMap2[i] = hash(x * 0.09, y * 0.09, 10.0) * 0.5
                     + hash(x * 0.18, y * 0.18, 20.0) * 0.3
                     + hash(x * 0.36, y * 0.36, 30.0) * 0.2;
      }
    }
  }

  function init() {
    W = canvas.width = innerWidth;
    H = canvas.height = innerHeight;
    simW = Math.ceil(W / SCALE);
    simH = Math.ceil(H / SCALE);
    simCanvas.width = simW;
    simCanvas.height = simH;
    buf1 = new Float32Array(simW * simH);
    buf2 = new Float32Array(simW * simH);
    imageData = simCtx.createImageData(simW, simH);
    pixels = imageData.data;
    buildNoise();
  }

  function dropRipple(screenX, screenY) {
    const cx = (screenX / SCALE) | 0;
    const cy = (screenY / SCALE) | 0;
    const r = RIPPLE_RADIUS;
    const r2 = r * r;
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        const d2 = dx * dx + dy * dy;
        if (d2 > r2) continue;
        const sx = cx + dx, sy = cy + dy;
        if (sx < 1 || sx >= simW - 1 || sy < 1 || sy >= simH - 1) continue;
        const t = Math.sqrt(d2) / r;
        buf1[sy * simW + sx] += RIPPLE_STRENGTH * (0.5 + 0.5 * Math.cos(Math.PI * t));
      }
    }
  }

  function simulate() {
    for (let y = 1; y < simH - 1; y++) {
      const row = y * simW;
      for (let x = 1; x < simW - 1; x++) {
        const i = row + x;
        buf2[i] = ((buf1[i-1] + buf1[i+1] + buf1[i-simW] + buf1[i+simW]) * 0.5 - buf2[i]) * DAMPING;
      }
    }
    const tmp = buf1; buf1 = buf2; buf2 = tmp;
  }

  // Palette lookup: pick from array[0..4], interpolating between neighbors
  function palLerp(pal, t) {
    // t is 0..1, maps to palette indices 0..4
    const idx = t * 4;       // 0..4
    const lo = idx | 0;      // integer part
    const hi = lo < 4 ? lo + 1 : 4;
    const frac = idx - lo;
    const a = pal[lo], b = pal[hi];
    return [
      a[0] + (b[0] - a[0]) * frac,
      a[1] + (b[1] - a[1]) * frac,
      a[2] + (b[2] - a[2]) * frac,
    ];
  }

  let globalTime = 0;

  function render() {
    globalTime += 0.016;

    // Slowly drifting light
    const lt = globalTime * 0.25;
    const lx = 0.3 + Math.sin(lt) * 0.06;
    const ly = -0.4 + Math.cos(lt * 0.7) * 0.06;
    const lz = 0.86;

    // Half-vector for specular
    const hx = lx, hy = ly, hz = lz + 1;
    const hlen = Math.sqrt(hx*hx + hy*hy + hz*hz);
    const nhx = hx/hlen, nhy = hy/hlen, nhz = hz/hlen;

    for (let y = 1; y < simH - 1; y++) {
      const row = y * simW;
      const vy = y / simH;
      for (let x = 1; x < simW - 1; x++) {
        const i = row + x;
        const pi = i << 2;

        // Surface normal
        const dzdx = buf1[i+1] - buf1[i-1];
        const dzdy = buf1[i+simW] - buf1[i-simW];
        const nnz = 3.0;
        const invLen = 1 / Math.sqrt(dzdx*dzdx + dzdy*dzdy + nnz*nnz);
        const nx = -dzdx * invLen, ny = -dzdy * invLen, nz = nnz * invLen;

        // Diffuse + specular
        const diffuse = Math.max(0, nx*lx + ny*ly + nz*lz);
        const specDot = nx*nhx + ny*nhy + nz*nhz;
        const spec = specDot > 0 ? Math.pow(specDot, 16) : 0;
        const sparkle = specDot > 0 ? Math.pow(specDot, 80) : 0;

        // Noise (both channels guaranteed 0..1)
        const n1 = noiseMap[i];
        const n2 = noiseMap2[i];

        // Brushstroke shimmer (slow time variation)
        const brush = Math.sin(n1 * 12.0 + globalTime * 0.4) * 0.5 + 0.5;

        // Height
        const h = buf1[i];

        // --- Color mixing ---
        // Luminance maps to shadow/mid/light palette position
        // Use diffuse as primary driver, noise to break it up
        const lum = Math.max(0, Math.min(1, diffuse * 0.7 + 0.15 + (n1 - 0.5) * 0.2));

        // Pick colors from each tier using different noise offsets
        const shad = palLerp(SHADOWS, n1);
        const mid  = palLerp(MIDS, (n2 + brush * 0.2) % 1);
        const lite = palLerp(LIGHTS, (n1 * 0.6 + n2 * 0.4) % 1);

        // Three-way blend: shadow → mid → light
        let r, g, b;
        if (lum < 0.4) {
          const t = lum / 0.4;
          r = shad[0] + (mid[0] - shad[0]) * t;
          g = shad[1] + (mid[1] - shad[1]) * t;
          b = shad[2] + (mid[2] - shad[2]) * t;
        } else {
          const t = (lum - 0.4) / 0.6;
          r = mid[0] + (lite[0] - mid[0]) * t;
          g = mid[1] + (lite[1] - mid[1]) * t;
          b = mid[2] + (lite[2] - mid[2]) * t;
        }

        // Vertical gradient: top = more sky lavender, bottom = deeper
        r += (1 - vy) * 12;
        g += (1 - vy) * 8;
        b += (1 - vy) * 18;

        // Wave height tint
        if (h > 0) {
          const ht = Math.min(1, h * 0.006);
          r += ht * 60;   // golden/amber push
          g += ht * 45;
          b -= ht * 10;
        } else {
          const ht = Math.min(1, -h * 0.004);
          // Teal or lavender in troughs
          if (n2 > 0.5) {
            g += ht * 25;  // teal
            b += ht * 18;
          } else {
            r += ht * 8;   // lavender
            b += ht * 28;
          }
        }

        // Broad specular: warm gold ↔ pale cerulean
        const sw = 0.5 + brush * 0.5;
        r += spec * (160 * sw + 50 * (1-sw));
        g += spec * (130 * sw + 110 * (1-sw));
        b += spec * (50 * sw + 140 * (1-sw));

        // Tight sparkle: cream glints
        r += sparkle * 240;
        g += sparkle * 230;
        b += sparkle * 200;

        // Brushstroke noise
        r += (n1 - 0.5) * 14;
        g += (n2 - 0.5) * 10;
        b += (n1 * 0.5 + n2 * 0.5 - 0.5) * 8;

        // Clamp and write
        pixels[pi]     = r > 255 ? 255 : r < 0 ? 0 : r | 0;
        pixels[pi + 1] = g > 255 ? 255 : g < 0 ? 0 : g | 0;
        pixels[pi + 2] = b > 255 ? 255 : b < 0 ? 0 : b | 0;
        pixels[pi + 3] = 255;
      }
    }

    simCtx.putImageData(imageData, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(simCanvas, 0, 0, simW, simH, 0, 0, W, H);
  }

  // --- Input ---
  canvas.addEventListener('click', e => dropRipple(e.clientX, e.clientY));
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    for (const t of e.changedTouches) dropRipple(t.clientX, t.clientY);
  }, { passive: false });

  let dragging = false;
  canvas.addEventListener('mousedown', () => { dragging = true; });
  canvas.addEventListener('mouseup', () => { dragging = false; });
  canvas.addEventListener('mousemove', e => {
    if (dragging) dropRipple(e.clientX, e.clientY);
  });

  function frame() {
    simulate();
    simulate();
    render();
    requestAnimationFrame(frame);
  }

  init();
  addEventListener('resize', init);
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
