<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matt Zieger</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0e1a; overflow: hidden; cursor: crosshair; }
#wave-canvas {
  display: block;
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
}
#three-canvas {
  display: block;
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}
</style>
</head>
<body>
<canvas id="wave-canvas"></canvas>
<canvas id="three-canvas"></canvas>

<!-- Water surface simulation: standalone, no dependencies -->
<script>
(function() {
  const canvas = document.getElementById('wave-canvas');
  const ctx = canvas.getContext('2d');

  // Simulation runs at reduced resolution for performance
  const SCALE = 3;
  const DAMPING = 0.988;
  const RIPPLE_RADIUS = 12;
  const RIPPLE_STRENGTH = 180;

  let W, H, simW, simH;
  let buf1, buf2;       // wave height double-buffer
  let letterMask;       // Uint8Array: 1 = inside letter (pinned)

  // Offscreen canvas at simulation resolution for fast pixel writes
  const simCanvas = document.createElement('canvas');
  const simCtx = simCanvas.getContext('2d');
  let imageData, pixels;

  function buildLetterMask() {
    const offscreen = document.createElement('canvas');
    offscreen.width = simW;
    offscreen.height = simH;
    const octx = offscreen.getContext('2d');

    const fontSize = Math.min(H * 0.28, W * 0.22);
    octx.save();
    octx.scale(1 / SCALE, 1 / SCALE);
    octx.font = `900 ${fontSize}px "Helvetica Neue", Helvetica, Arial, sans-serif`;
    octx.textAlign = 'center';
    octx.textBaseline = 'middle';
    octx.fillStyle = '#fff';

    const gap = fontSize * 0.15;
    const mW = octx.measureText('M').width;
    const zW = octx.measureText('Z').width;
    const total = mW + gap + zW;

    octx.fillText('M', W / 2 - total / 2 + mW / 2, H / 2);
    octx.fillText('Z', W / 2 + total / 2 - zW / 2, H / 2);
    octx.restore();

    const id = octx.getImageData(0, 0, simW, simH);
    letterMask = new Uint8Array(simW * simH);
    for (let i = 0; i < simW * simH; i++) {
      letterMask[i] = id.data[i * 4 + 3] > 128 ? 1 : 0;
    }
  }

  function init() {
    W = canvas.width = innerWidth;
    H = canvas.height = innerHeight;
    simW = Math.ceil(W / SCALE);
    simH = Math.ceil(H / SCALE);

    simCanvas.width = simW;
    simCanvas.height = simH;

    buf1 = new Float32Array(simW * simH);
    buf2 = new Float32Array(simW * simH);

    imageData = simCtx.createImageData(simW, simH);
    pixels = imageData.data;

    buildLetterMask();
  }

  function dropRipple(screenX, screenY) {
    const cx = (screenX / SCALE) | 0;
    const cy = (screenY / SCALE) | 0;
    const r = RIPPLE_RADIUS;
    const r2 = r * r;

    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        const d2 = dx * dx + dy * dy;
        if (d2 > r2) continue;
        const sx = cx + dx, sy = cy + dy;
        if (sx < 1 || sx >= simW - 1 || sy < 1 || sy >= simH - 1) continue;
        const idx = sy * simW + sx;
        if (letterMask[idx]) continue;
        // Smooth cosine bell shape
        const t = Math.sqrt(d2) / r;
        buf1[idx] += RIPPLE_STRENGTH * (0.5 + 0.5 * Math.cos(Math.PI * t));
      }
    }
  }

  // Propagate wave using classic ripple algorithm
  function simulate() {
    for (let y = 1; y < simH - 1; y++) {
      const row = y * simW;
      for (let x = 1; x < simW - 1; x++) {
        const i = row + x;
        if (letterMask[i]) { buf2[i] = 0; continue; }
        // Average of 4 neighbors, propagate, dampen
        buf2[i] = ((
          buf1[i - 1] + buf1[i + 1] +
          buf1[i - simW] + buf1[i + simW]
        ) * 0.5 - buf2[i]) * DAMPING;
      }
    }
    // Swap buffers
    const tmp = buf1;
    buf1 = buf2;
    buf2 = tmp;
  }

  function render() {
    // Light direction (normalized) — above-right, slightly behind viewer
    const lx = 0.25, ly = -0.45, lz = 0.86;

    // Pre-compute half-vector for Blinn-Phong specular (view = 0,0,1)
    const hx = lx, hy = ly, hz = lz + 1;
    const hlen = Math.sqrt(hx * hx + hy * hy + hz * hz);
    const nhx = hx / hlen, nhy = hy / hlen, nhz = hz / hlen;

    for (let y = 1; y < simH - 1; y++) {
      const row = y * simW;
      for (let x = 1; x < simW - 1; x++) {
        const i = row + x;
        const pi = i << 2;

        // Height gradients for surface normal
        const dzdx = buf1[i + 1] - buf1[i - 1];
        const dzdy = buf1[i + simW] - buf1[i - simW];

        // Surface normal (-dzdx, -dzdy, scale), unnormalized for speed
        const nscale = 4.0; // controls "sharpness" of highlights
        const nnx = -dzdx;
        const nny = -dzdy;
        const nnz = nscale;
        const invLen = 1 / Math.sqrt(nnx * nnx + nny * nny + nnz * nnz);
        const nx = nnx * invLen;
        const ny = nny * invLen;
        const nz = nnz * invLen;

        // Diffuse lighting
        const diffuse = Math.max(0, nx * lx + ny * ly + nz * lz);

        // Specular (Blinn-Phong, exponent 60 for tight highlights)
        const specDot = nx * nhx + ny * nhy + nz * nhz;
        const spec = specDot > 0 ? Math.pow(specDot, 60) : 0;

        // Fresnel-like rim: darker where surface faces camera directly
        const fresnel = 1 - nz;
        const fresnelBoost = fresnel * fresnel * 0.4;

        // Height-based caustic tint
        const h = buf1[i];
        const caustic = Math.max(0, h * 0.003);

        // Base deep water color
        const br = 8 + diffuse * 22 + fresnelBoost * 15 + caustic * 30;
        const bg = 14 + diffuse * 45 + fresnelBoost * 25 + caustic * 50;
        const bb = 32 + diffuse * 70 + fresnelBoost * 50 + caustic * 40;

        // Add specular highlight on top
        const sr = br + spec * 220;
        const sg = bg + spec * 240;
        const sb = bb + spec * 255;

        pixels[pi]     = sr > 255 ? 255 : sr | 0;
        pixels[pi + 1] = sg > 255 ? 255 : sg | 0;
        pixels[pi + 2] = sb > 255 ? 255 : sb | 0;
        pixels[pi + 3] = 255;
      }
    }

    // Write to simulation canvas, then scale up to main canvas
    simCtx.putImageData(imageData, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(simCanvas, 0, 0, simW, simH, 0, 0, W, H);
  }

  // Input
  canvas.addEventListener('click', e => dropRipple(e.clientX, e.clientY));
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    for (const t of e.changedTouches) dropRipple(t.clientX, t.clientY);
  }, { passive: false });

  // Optional: drag to paint ripples
  let dragging = false;
  canvas.addEventListener('mousedown', () => { dragging = true; });
  canvas.addEventListener('mouseup', () => { dragging = false; });
  canvas.addEventListener('mousemove', e => {
    if (dragging) dropRipple(e.clientX, e.clientY);
  });

  function frame() {
    simulate();
    simulate(); // 2 substeps per frame for faster propagation
    render();
    requestAnimationFrame(frame);
  }

  init();
  addEventListener('resize', init);
  requestAnimationFrame(frame);
})();
</script>

<!-- Three.js 3D letters: loads independently, fails gracefully -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

const threeCanvas = document.getElementById('three-canvas');
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 1, 2000);
camera.position.set(0, 0, 500);

const renderer = new THREE.WebGLRenderer({
  canvas: threeCanvas,
  alpha: true,
  antialias: true
});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// Lighting
scene.add(new THREE.AmbientLight(0x4466aa, 0.6));

const keyLight = new THREE.DirectionalLight(0x88bbff, 1.8);
keyLight.position.set(100, 200, 300);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
keyLight.shadow.camera.near = 10;
keyLight.shadow.camera.far = 1000;
keyLight.shadow.camera.left = -300;
keyLight.shadow.camera.right = 300;
keyLight.shadow.camera.top = 200;
keyLight.shadow.camera.bottom = -200;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x6699cc, 0.8);
rimLight.position.set(-150, -50, 200);
scene.add(rimLight);

const bottomLight = new THREE.DirectionalLight(0x223355, 0.4);
bottomLight.position.set(0, -200, 100);
scene.add(bottomLight);

// Shadow plane
const planeMat = new THREE.ShadowMaterial({ opacity: 0.35 });
const plane = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), planeMat);
plane.position.z = -30;
plane.receiveShadow = true;
scene.add(plane);

const letterGroup = new THREE.Group();
scene.add(letterGroup);

// Load font and create letters
const loader = new FontLoader();
loader.load(
  'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/fonts/helvetiker_bold.typeface.json',
  function(font) {
    const matFront = new THREE.MeshPhongMaterial({
      color: 0x1a3055,
      specular: 0x5588bb,
      shininess: 60,
    });
    const matSide = new THREE.MeshPhongMaterial({
      color: 0x0f1f38,
      specular: 0x334466,
      shininess: 30,
    });

    const textParams = {
      font: font,
      size: 100,
      depth: 30,
      curveSegments: 16,
      bevelEnabled: true,
      bevelThickness: 4,
      bevelSize: 3,
      bevelOffset: 0,
      bevelSegments: 8,
    };

    const mGeo = new TextGeometry('M', textParams);
    mGeo.computeBoundingBox();
    const mMesh = new THREE.Mesh(mGeo, [matFront, matSide]);
    mMesh.castShadow = true;

    const zGeo = new TextGeometry('Z', textParams);
    zGeo.computeBoundingBox();
    const zMesh = new THREE.Mesh(zGeo, [matFront, matSide]);
    zMesh.castShadow = true;

    const mBox = mGeo.boundingBox;
    const zBox = zGeo.boundingBox;
    const mWidth = mBox.max.x - mBox.min.x;
    const zWidth = zBox.max.x - zBox.min.x;
    const gap = 30;
    const totalWidth = mWidth + gap + zWidth;
    const mHeight = mBox.max.y - mBox.min.y;

    mMesh.position.set(-totalWidth / 2, -mHeight / 2, 0);
    zMesh.position.set(-totalWidth / 2 + mWidth + gap, -mHeight / 2, 0);

    letterGroup.add(mMesh);
    letterGroup.add(zMesh);
  }
);

function threeFrame(now) {
  const t = now / 1000;
  letterGroup.position.y = Math.sin(t * 0.8) * 6;
  letterGroup.position.z = Math.sin(t * 0.5) * 4;
  letterGroup.rotation.x = Math.sin(t * 0.6) * 0.04;
  letterGroup.rotation.y = Math.sin(t * 0.4) * 0.03;
  renderer.render(scene, camera);
  requestAnimationFrame(threeFrame);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

requestAnimationFrame(threeFrame);
</script>
</body>
</html>
