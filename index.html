<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matt Zieger</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #071222; }
  canvas { display: block; }
  #info {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    color: rgba(80,160,220,0.4); font-family: 'Courier New', monospace;
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    pointer-events: none; user-select: none;
  }
  #label {
    position: absolute; pointer-events: none; user-select: none;
    color: #6cc0f0; font-family: 'Courier New', monospace;
    font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
    background: rgba(7,18,34,0.85); border: 1px solid rgba(60,142,200,0.3);
    padding: 4px 10px; border-radius: 2px; opacity: 0;
    transition: opacity 0.25s;
    white-space: nowrap;
  }
  #label.visible { opacity: 1; }
</style>
</head>
<body>
<div id="info"></div>
<div id="label"></div>
<!-- Three.js r128 CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/*
  Blueprint Bloom — A single flower drawn in technical blueprint style.
  Dark navy background, light blue single-line wireframes, limited shading.
  Interaction: drag to orbit, scroll to zoom, click to restart bloom.
  Customize: PETAL_COUNT, BLOOM_DURATION, colors below.
*/

(function() {
  // === Config ===
  const PETAL_COUNT = 5;
  const INNER_PETAL_COUNT = 5;
  const STAMEN_COUNT = 8;
  const BLOOM_DURATION = 10; // seconds for full bloom
  const BG_COLOR = 0x071222;
  const LINE_COLOR = 0x3c8ec8;
  const BRIGHT_COLOR = 0x8ee8ff;
  const DIM_COLOR = 0x1a4870;
  const GRID_COLOR = 0x0e2040;
  const WHITE_COLOR = 0xa8d8ff;

  // === Scene setup ===
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(BG_COLOR);
  scene.fog = new THREE.FogExp2(BG_COLOR, 0.025);

  const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(0, 2, 8);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  // === Lighting — subtle, blueprint feel ===
  const keyLight = new THREE.DirectionalLight(0x4488cc, 0.8);
  keyLight.position.set(3, 6, 4);
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0x224466, 0.3);
  fillLight.position.set(-4, 3, -2);
  scene.add(fillLight);

  const ambient = new THREE.AmbientLight(0x112244, 0.5);
  scene.add(ambient);

  // === Blueprint grid plane ===
  const gridHelper = new THREE.GridHelper(20, 40, GRID_COLOR, GRID_COLOR);
  gridHelper.position.y = -2.5;
  scene.add(gridHelper);

  // Finer sub-grid
  const subGrid = new THREE.GridHelper(20, 80, 0x091830, 0x091830);
  subGrid.position.y = -2.49;
  scene.add(subGrid);

  // === Flower group ===
  const flower = new THREE.Group();
  scene.add(flower);

  // Line material factory
  function lineMat(color, opacity) {
    return new THREE.LineBasicMaterial({
      color: color || LINE_COLOR,
      transparent: true,
      opacity: opacity !== undefined ? opacity : 1,
      depthWrite: false
    });
  }

  // === Build stem as a curve ===
  const stemGroup = new THREE.Group();
  flower.add(stemGroup);

  function buildStem(growT) {
    // Remove old
    while (stemGroup.children.length) {
      const c = stemGroup.children[0];
      c.geometry && c.geometry.dispose();
      c.material && c.material.dispose();
      stemGroup.remove(c);
    }

    if (growT <= 0) return { x: 0, y: -2.5, z: 0 };

    const stemHeight = 3.5 * growT;
    const points = [];
    const segments = 40;
    for (let i = 0; i <= segments; i++) {
      const t = i / segments;
      const y = -2.5 + stemHeight * t;
      const sway = Math.sin(t * Math.PI) * 0.15 * Math.sin(elapsed * 0.6);
      const x = sway;
      const z = Math.sin(t * Math.PI * 0.5) * 0.05;
      points.push(new THREE.Vector3(x, y, z));
    }

    const geo = new THREE.BufferGeometry().setFromPoints(points);
    const line = new THREE.Line(geo, lineMat(LINE_COLOR, 0.9));
    stemGroup.add(line);

    const tip = points[points.length - 1];
    return { x: tip.x, y: tip.y, z: tip.z };
  }

  // === Build a petal shape (wireframe bezier curves) ===
  function createPetalGeo(length, width, openness) {
    const pts = [];
    const steps = 30;

    // Left edge
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const y = t * length * openness;
      const bulge = Math.sin(t * Math.PI);
      const x = -width * 0.5 * bulge * openness;
      const z = bulge * length * 0.08 * openness; // slight curvature
      pts.push(new THREE.Vector3(x, y, z));
    }
    // Right edge (reverse)
    for (let i = steps; i >= 0; i--) {
      const t = i / steps;
      const y = t * length * openness;
      const bulge = Math.sin(t * Math.PI);
      const x = width * 0.5 * bulge * openness;
      const z = bulge * length * 0.08 * openness;
      pts.push(new THREE.Vector3(x, y, z));
    }
    // Close
    pts.push(pts[0].clone());

    return new THREE.BufferGeometry().setFromPoints(pts);
  }

  // Central vein line
  function createVeinGeo(length, openness) {
    const pts = [];
    const steps = 15;
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      pts.push(new THREE.Vector3(0, t * length * openness * 0.9, Math.sin(t * Math.PI) * length * 0.04 * openness));
    }
    return new THREE.BufferGeometry().setFromPoints(pts);
  }

  // === Petal groups ===
  const petalsOuter = new THREE.Group();
  const petalsInner = new THREE.Group();
  const sepalsGroup = new THREE.Group();
  const stamensGroup = new THREE.Group();
  const centerGroup = new THREE.Group();
  flower.add(petalsOuter, petalsInner, sepalsGroup, stamensGroup, centerGroup);

  function clearGroup(g) {
    while (g.children.length) {
      const c = g.children[0];
      if (c.geometry) c.geometry.dispose();
      if (c.material) c.material.dispose();
      g.remove(c);
    }
  }

  function buildFlowerHead(headPos, bloomOpen, fullBloom, budForm) {
    clearGroup(petalsOuter);
    clearGroup(petalsInner);
    clearGroup(sepalsGroup);
    clearGroup(stamensGroup);
    clearGroup(centerGroup);

    petalsOuter.position.set(headPos.x, headPos.y, headPos.z);
    petalsInner.position.set(headPos.x, headPos.y, headPos.z);
    sepalsGroup.position.set(headPos.x, headPos.y, headPos.z);
    stamensGroup.position.set(headPos.x, headPos.y, headPos.z);
    centerGroup.position.set(headPos.x, headPos.y, headPos.z);

    if (budForm <= 0) return;

    const sway = Math.sin(elapsed * 0.6) * 0.05;

    // Sepals
    for (let i = 0; i < 5; i++) {
      const angle = (i / 5) * Math.PI * 2;
      const sepalLen = 0.5 * budForm;
      const sepalPts = [];
      const steps = 15;
      // Curl back as bloom opens
      const curlBack = bloomOpen * 0.8;
      for (let j = 0; j <= steps; j++) {
        const t = j / steps;
        const r = sepalLen * t;
        const spread = Math.sin(t * Math.PI) * 0.1 * budForm;
        const curlAngle = -Math.PI / 2 + curlBack * Math.PI * 0.4 * t;
        const y = Math.sin(curlAngle + Math.PI / 2) * r;
        const outR = Math.cos(curlAngle + Math.PI / 2) * r + spread;
        const x = Math.cos(angle + sway) * outR;
        const z = Math.sin(angle + sway) * outR;
        sepalPts.push(new THREE.Vector3(x, y, z));
      }
      const geo = new THREE.BufferGeometry().setFromPoints(sepalPts);
      sepalsGroup.add(new THREE.Line(geo, lineMat(DIM_COLOR, 0.6 * budForm)));
    }

    // Outer petals
    if (bloomOpen > 0) {
      for (let i = 0; i < PETAL_COUNT; i++) {
        const angle = (i / PETAL_COUNT) * Math.PI * 2 + Math.PI / PETAL_COUNT;
        const petalLen = 1.6;
        const petalW = 0.9;

        // Create petal outline
        const petalGeo = createPetalGeo(petalLen, petalW, bloomOpen);
        const petalLine = new THREE.Line(petalGeo, lineMat(BRIGHT_COLOR, 0.7 + bloomOpen * 0.3));

        // Position: rotate outward from center
        const spreadAngle = Math.PI / 2 - bloomOpen * Math.PI * 0.35;
        petalLine.rotation.set(0, 0, 0);

        // Rotate around Y to place around flower
        const petalPivot = new THREE.Group();
        petalPivot.rotation.y = angle + sway;

        // Tilt petal outward
        const tiltGroup = new THREE.Group();
        tiltGroup.rotation.x = -spreadAngle;
        tiltGroup.add(petalLine);

        petalPivot.add(tiltGroup);
        petalsOuter.add(petalPivot);

        // Central vein
        const veinGeo = createVeinGeo(petalLen, bloomOpen);
        const veinLine = new THREE.Line(veinGeo, lineMat(DIM_COLOR, 0.4 * bloomOpen));
        const veinTilt = new THREE.Group();
        veinTilt.rotation.x = -spreadAngle;
        veinTilt.add(veinLine);
        const veinPivot = new THREE.Group();
        veinPivot.rotation.y = angle + sway;
        veinPivot.add(veinTilt);
        petalsOuter.add(veinPivot);
      }
    }

    // Inner petals (delayed)
    const innerOpen = Math.max(0, (bloomOpen - 0.3) / 0.7);
    if (innerOpen > 0) {
      for (let i = 0; i < INNER_PETAL_COUNT; i++) {
        const angle = (i / INNER_PETAL_COUNT) * Math.PI * 2;
        const geo = createPetalGeo(1.1, 0.6, innerOpen);
        const line = new THREE.Line(geo, lineMat(LINE_COLOR, 0.5 + innerOpen * 0.3));

        const spreadAngle = Math.PI / 2 - innerOpen * Math.PI * 0.28;
        const pivot = new THREE.Group();
        pivot.rotation.y = angle + sway * 0.7;
        const tilt = new THREE.Group();
        tilt.rotation.x = -spreadAngle;
        tilt.add(line);
        pivot.add(tilt);
        petalsInner.add(pivot);
      }
    }

    // Stamens
    if (fullBloom > 0) {
      for (let i = 0; i < STAMEN_COUNT; i++) {
        const angle = (i / STAMEN_COUNT) * Math.PI * 2;
        const len = 0.5 * fullBloom;
        const pts = [
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(
            Math.cos(angle) * len * 0.3,
            len,
            Math.sin(angle) * len * 0.3
          )
        ];
        const geo = new THREE.BufferGeometry().setFromPoints(pts);
        stamensGroup.add(new THREE.Line(geo, lineMat(DIM_COLOR, 0.6 * fullBloom)));

        // Anther dot (small cross at tip)
        if (fullBloom > 0.5) {
          const tip = pts[1];
          const s = 0.04;
          const crossPts = [
            new THREE.Vector3(tip.x - s, tip.y, tip.z),
            new THREE.Vector3(tip.x + s, tip.y, tip.z),
          ];
          const crossPts2 = [
            new THREE.Vector3(tip.x, tip.y - s, tip.z),
            new THREE.Vector3(tip.x, tip.y + s, tip.z),
          ];
          stamensGroup.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(crossPts),
            lineMat(BRIGHT_COLOR, fullBloom)
          ));
          stamensGroup.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(crossPts2),
            lineMat(BRIGHT_COLOR, fullBloom)
          ));
        }
      }

      // Center circle (pistil)
      const circPts = [];
      for (let i = 0; i <= 32; i++) {
        const a = (i / 32) * Math.PI * 2;
        circPts.push(new THREE.Vector3(Math.cos(a) * 0.12 * fullBloom, Math.sin(a) * 0.12 * fullBloom + 0.15 * fullBloom, 0));
      }
      centerGroup.add(new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(circPts),
        lineMat(WHITE_COLOR, 0.8 * fullBloom)
      ));
    }
  }

  // === Leaves ===
  const leavesGroup = new THREE.Group();
  flower.add(leavesGroup);

  function buildLeaves(stemGrow) {
    clearGroup(leavesGroup);

    const leaf1T = Math.max(0, Math.min(1, (stemGrow - 0.3) * 4));
    const leaf2T = Math.max(0, Math.min(1, (stemGrow - 0.45) * 4));

    function addLeaf(attachY, side, size, t) {
      if (t <= 0) return;
      const sway = Math.sin(elapsed * 0.6) * 0.15;
      const stemX = Math.sin(((-2.5 - attachY) / -4.5) * Math.PI) * 0.15 * sway;

      const pts = [];
      const steps = 25;
      const leafLen = size * t;
      const leafW = size * 0.3 * t;

      // Top edge
      for (let i = 0; i <= steps; i++) {
        const lt = i / steps;
        const x = lt * leafLen * side;
        const y = Math.sin(lt * Math.PI) * leafW;
        const z = Math.sin(lt * Math.PI) * 0.05 * t;
        pts.push(new THREE.Vector3(stemX + x, attachY + y, z));
      }
      // Bottom edge (reverse)
      for (let i = steps; i >= 0; i--) {
        const lt = i / steps;
        const x = lt * leafLen * side;
        const y = -Math.sin(lt * Math.PI) * leafW * 0.6;
        const z = Math.sin(lt * Math.PI) * 0.05 * t;
        pts.push(new THREE.Vector3(stemX + x, attachY + y, z));
      }
      pts.push(pts[0].clone());

      leavesGroup.add(new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(pts),
        lineMat(LINE_COLOR, 0.5 * t)
      ));

      // Midrib
      const midPts = [
        new THREE.Vector3(stemX, attachY, 0),
        new THREE.Vector3(stemX + leafLen * 0.85 * side, attachY, 0.03 * t)
      ];
      leavesGroup.add(new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(midPts),
        lineMat(DIM_COLOR, 0.4 * t)
      ));
    }

    addLeaf(-0.7, 1, 0.9, leaf1T);
    addLeaf(0.2, -1, 0.7, leaf2T);
  }

  // === Dimension annotation lines (blueprint detail) ===
  const annotGroup = new THREE.Group();
  scene.add(annotGroup);

  function buildAnnotations(stemGrow, headY) {
    clearGroup(annotGroup);
    if (stemGrow < 0.5) return;

    const alpha = Math.min(1, (stemGrow - 0.5) * 4) * 0.35;
    const x = 1.2;
    const bot = -2.5;
    const top = headY;

    // Vertical dimension line
    const vPts = [new THREE.Vector3(x, bot, 0), new THREE.Vector3(x, top, 0)];
    annotGroup.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(vPts),
      lineMat(DIM_COLOR, alpha)
    ));

    // Tick marks
    const tickSize = 0.12;
    [bot, top].forEach(y => {
      annotGroup.add(new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(x - tickSize, y, 0),
          new THREE.Vector3(x + tickSize, y, 0)
        ]),
        lineMat(DIM_COLOR, alpha)
      ));
    });

    // Leader lines
    annotGroup.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0.1, bot, 0), new THREE.Vector3(x - 0.05, bot, 0)
      ]),
      lineMat(DIM_COLOR, alpha * 0.5)
    ));
    annotGroup.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0.1, top, 0), new THREE.Vector3(x - 0.05, top, 0)
      ]),
      lineMat(DIM_COLOR, alpha * 0.5)
    ));
  }

  // === Ground cross mark ===
  const groundMark = new THREE.Group();
  scene.add(groundMark);
  {
    const s = 0.15;
    const y = -2.5;
    groundMark.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(-s, y, -s), new THREE.Vector3(s, y, s)
      ]),
      lineMat(DIM_COLOR, 0.4)
    ));
    groundMark.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(-s, y, s), new THREE.Vector3(s, y, -s)
      ]),
      lineMat(DIM_COLOR, 0.4)
    ));
    // Circle around cross
    const cpts = [];
    for (let i = 0; i <= 32; i++) {
      const a = (i / 32) * Math.PI * 2;
      cpts.push(new THREE.Vector3(Math.cos(a) * s * 1.5, y, Math.sin(a) * s * 1.5));
    }
    groundMark.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(cpts),
      lineMat(DIM_COLOR, 0.3)
    ));
  }

  // === Seedlings ===
  const SEEDLING_COUNT = 5;
  const SEEDLING_DELAY = 1.5; // seconds after bloom starts — sprout alongside the flower
  const SEEDLING_STAGGER = 1.8; // seconds between each seedling popping up
  const EXTRA_SEEDLING_COUNT = 120; // additional decorative seedlings
  const EXTRA_SEEDLING_DELAY = SEEDLING_DELAY + SEEDLING_COUNT * SEEDLING_STAGGER; // start right after the first 5
  const seedlingsGroup = new THREE.Group();
  scene.add(seedlingsGroup);

  // Seedling data: position, link, label
  const seedlingData = [];
  const seedlingHitboxes = []; // invisible meshes for raycasting
  const labelEl = document.getElementById('label');

  function initSeedlings() {
    seedlingData.length = 0;
    seedlingHitboxes.length = 0;
    clearGroup(seedlingsGroup);

    const links = [
      { url: 'https://jobsdata.ai', label: 'jobsdata.ai', height: 0.85 },
      { url: 'https://linkedin.com/in/mattzieger', label: 'linkedin', height: 0.7 },
      { url: 'https://instagram.com/mattzieger', label: 'instagram', height: 0.55 },
      { url: 'https://opportunityai.org', label: 'Opportunity AI', height: 0.8 },
      { url: 'https://www.gitlabfoundation.org/futureofwork', label: 'AI for Economic Opportunity Fund', height: 0.6 },
    ];

    // Shuffle placement angles but keep them spaced out
    const baseAngles = [];
    for (let i = 0; i < SEEDLING_COUNT; i++) {
      baseAngles.push((i / SEEDLING_COUNT) * Math.PI * 2 + (Math.random() - 0.5) * 0.5);
    }
    // Shuffle to randomize which angle gets which link
    for (let i = baseAngles.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [baseAngles[i], baseAngles[j]] = [baseAngles[j], baseAngles[i]];
    }

    for (let i = 0; i < SEEDLING_COUNT; i++) {
      const angle = baseAngles[i];
      const dist = 1.8 + Math.random() * 1.2; // distance from center — more spread out
      const x = Math.cos(angle) * dist;
      const z = Math.sin(angle) * dist;

      seedlingData.push({
        x, z,
        angle: angle,
        url: links[i].url,
        label: links[i].label,
        height: links[i].height, // taller for linked seedlings
        leafAngle: Math.random() * Math.PI * 2,
        isExtra: false,
      });
    }

    // Generate extra decorative seedlings further out
    for (let i = 0; i < EXTRA_SEEDLING_COUNT; i++) {
      const angle = Math.random() * Math.PI * 2; // fully random direction
      const dist = 2.8 + Math.random() * 5.0; // spread across a wide area
      const x = Math.cos(angle) * dist;
      const z = Math.sin(angle) * dist;

      seedlingData.push({
        x, z,
        dist, // store distance for color fading
        angle: angle,
        url: null,
        label: null,
        height: 0.25 + Math.random() * 0.45, // various heights
        leafAngle: Math.random() * Math.PI * 2,
        isExtra: true,
      });
    }
  }

  initSeedlings();

  function buildSeedlings(bloomProgress) {
    clearGroup(seedlingsGroup);
    seedlingHitboxes.length = 0;

    for (let i = 0; i < seedlingData.length; i++) {
      const sd = seedlingData[i];
      // Staggered appearance — extra seedlings use their own delay
      let seedlingStart;
      if (sd.isExtra) {
        // Easing stagger: fast at first, slowing down over time
        const ei = i - SEEDLING_COUNT;
        const t = ei / (EXTRA_SEEDLING_COUNT - 1); // 0..1
        // Cubic ease-in: later seedlings appear much more slowly
        const maxTime = 60; // total seconds for all extra seedlings
        seedlingStart = EXTRA_SEEDLING_DELAY + t * t * t * maxTime;
      } else {
        seedlingStart = SEEDLING_DELAY + i * SEEDLING_STAGGER;
      }
      const growT = easeInOut(clamp01((bloomTime - seedlingStart) / 1.2));
      if (growT <= 0) continue;

      const groundY = -2.5;
      const sproutH = sd.height * growT;
      const sway = Math.sin(elapsed * 0.9 + i * 2) * 0.02 * growT;
      let lineCol;
      if (sd.url) {
        lineCol = BRIGHT_COLOR;
      } else if (sd.isExtra && sd.dist) {
        // Fade color toward background as distance increases
        const fadeFactor = clamp01((sd.dist - 2.8) / 5.0); // 0 at closest, 1 at farthest
        const baseColor = new THREE.Color(DIM_COLOR);
        const fadeColor = new THREE.Color(0x0a1a2a); // very dark blue, near background
        baseColor.lerp(fadeColor, fadeFactor * 0.8);
        lineCol = baseColor;
      } else {
        lineCol = LINE_COLOR;
      }

      const sproutGroup = new THREE.Group();
      sproutGroup.position.set(sd.x, groundY, sd.z);
      // Rotate each seedling to face a random direction
      sproutGroup.rotation.y = sd.leafAngle;
      seedlingsGroup.add(sproutGroup);

      // Curved stem — starts underground, arcs upward like a real sprout
      const stemPts = [];
      const steps = 20;
      for (let j = 0; j <= steps; j++) {
        const t = j / steps;
        // Hypocotyl arch: starts bent, straightens as it grows
        const archBend = Math.max(0, 1 - growT * 1.5) * 0.6;
        const y = sproutH * (t - archBend * Math.sin(t * Math.PI) * 0.3);
        const x = sway + Math.sin(t * Math.PI) * archBend * sproutH * 0.4;
        const z = 0;
        stemPts.push(new THREE.Vector3(x, y, z));
      }
      sproutGroup.add(new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(stemPts),
        lineMat(lineCol, sd.url ? 0.8 + growT * 0.2 : (sd.isExtra ? (0.35 + growT * 0.25) * (1 - (sd.dist ? clamp01((sd.dist - 2.8) / 5.0) * 0.5 : 0)) : 0.6 + growT * 0.4))
      ));

      // Cotyledon leaves — two rounded leaves that open outward from the tip
      if (growT > 0.3) {
        const leafT = clamp01((growT - 0.3) / 0.7);
        const tipPt = stemPts[stemPts.length - 1];
        const leafLen = 0.12 + 0.06 * leafT;
        const leafW = 0.07 + 0.04 * leafT;
        // Spread angle: leaves start closed (pointing up) and open outward
        const spreadAngle = leafT * 1.1; // radians from vertical

        for (let side = -1; side <= 1; side += 2) {
          const leafPts = [];
          const leafSteps = 16;
          // Rounded oval cotyledon shape
          for (let j = 0; j <= leafSteps; j++) {
            const t = j / leafSteps;
            const a = t * Math.PI * 2;
            // Oval: wider in middle, pointed at tip and base
            const along = Math.sin(a) * leafLen; // along the leaf axis
            const across = Math.sin(a) * Math.sin(t * Math.PI) * leafW; // width bulge

            // Rotate leaf outward by spreadAngle on the side axis
            const lx = tipPt.x + side * (Math.sin(spreadAngle) * along + Math.cos(spreadAngle) * across * 0.3);
            const ly = tipPt.y + Math.cos(spreadAngle) * along - Math.sin(spreadAngle) * Math.abs(across) * 0.2;
            const lz = tipPt.z + across;
            leafPts.push(new THREE.Vector3(lx, ly, lz));
          }
          sproutGroup.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(leafPts),
            lineMat(lineCol, 0.55 * leafT + 0.25)
          ));

          // Tiny leaf vein (midrib)
          const vMid = new THREE.Vector3(
            tipPt.x + side * Math.sin(spreadAngle) * leafLen * 0.75,
            tipPt.y + Math.cos(spreadAngle) * leafLen * 0.75,
            tipPt.z
          );
          sproutGroup.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([tipPt.clone(), vMid]),
            lineMat(DIM_COLOR, 0.35 * leafT)
          ));
        }

        // Tiny seed shell splitting open at the base of cotyledons (detail)
        if (growT > 0.5) {
          const shellT = clamp01((growT - 0.5) / 0.5);
          const shellPts = [];
          const shellR = 0.04;
          const shellOpen = shellT * 0.4;
          for (let j = 0; j <= 8; j++) {
            const a = (j / 8) * Math.PI - Math.PI * 0.5; // half-circle
            shellPts.push(new THREE.Vector3(
              tipPt.x + Math.cos(a) * shellR + shellOpen * 0.03,
              tipPt.y + Math.sin(a) * shellR * 0.5 - 0.02,
              tipPt.z
            ));
          }
          sproutGroup.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(shellPts),
            lineMat(DIM_COLOR, 0.3 * shellT)
          ));
        }
      }

      // Small ground disturbance — dirt pushing up
      if (growT > 0.1) {
        const dirtT = clamp01(growT / 0.5);
        const dirtPts = [];
        const dirtR = 0.08 * dirtT;
        for (let j = 0; j <= 10; j++) {
          const a = (j / 10) * Math.PI * 2;
          const bump = 1 + Math.sin(j * 1.5) * 0.3;
          dirtPts.push(new THREE.Vector3(
            Math.cos(a) * dirtR * bump,
            Math.sin(a * 2) * 0.01 * dirtT,
            Math.sin(a) * dirtR * bump
          ));
        }
        dirtPts.push(dirtPts[0].clone());
        sproutGroup.add(new THREE.Line(
          new THREE.BufferGeometry().setFromPoints(dirtPts),
          lineMat(DIM_COLOR, 0.25 * dirtT)
        ));
      }

      // Invisible hitbox for raycasting (only for linked seedlings)
      if (sd.url && growT > 0.3) {
        const hitGeo = new THREE.CylinderGeometry(0.22, 0.22, sproutH + 0.4, 8);
        const hitMat = new THREE.MeshBasicMaterial({ visible: false });
        const hitMesh = new THREE.Mesh(hitGeo, hitMat);
        hitMesh.position.set(sd.x, groundY + sproutH * 0.5, sd.z);
        hitMesh.userData = { url: sd.url, label: sd.label, index: i };
        seedlingsGroup.add(hitMesh);
        seedlingHitboxes.push(hitMesh);
      }
    }
  }

  // === Raycaster for seedling interaction ===
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  let hoveredSeedling = null;

  function updateHover(clientX, clientY) {
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);

    const intersects = raycaster.intersectObjects(seedlingHitboxes);
    if (intersects.length > 0) {
      const data = intersects[0].object.userData;
      hoveredSeedling = data;
      renderer.domElement.style.cursor = 'pointer';
      labelEl.textContent = data.label;
      labelEl.classList.add('visible');
      labelEl.style.left = clientX + 12 + 'px';
      labelEl.style.top = clientY - 28 + 'px';
    } else {
      hoveredSeedling = null;
      renderer.domElement.style.cursor = 'default';
      labelEl.classList.remove('visible');
    }
  }

  // === Manual orbit controls ===
  let isDragging = false;
  let dragMoved = false;
  let prevMouse = { x: 0, y: 0 };
  let downMouse = { x: 0, y: 0 };
  let spherical = { theta: 0, phi: Math.PI / 2.8, radius: 8 };

  renderer.domElement.addEventListener('mousedown', e => {
    isDragging = true;
    dragMoved = false;
    prevMouse = { x: e.clientX, y: e.clientY };
    downMouse = { x: e.clientX, y: e.clientY };
  });
  renderer.domElement.addEventListener('mousemove', e => {
    updateHover(e.clientX, e.clientY);
    if (!isDragging) return;
    const dx = e.clientX - prevMouse.x;
    const dy = e.clientY - prevMouse.y;
    if (Math.abs(e.clientX - downMouse.x) > 4 || Math.abs(e.clientY - downMouse.y) > 4) {
      dragMoved = true;
    }
    spherical.theta -= dx * 0.005;
    spherical.phi = Math.max(0.3, Math.min(Math.PI - 0.3, spherical.phi - dy * 0.005));
    prevMouse = { x: e.clientX, y: e.clientY };
  });
  renderer.domElement.addEventListener('mouseup', e => {
    isDragging = false;
    if (!dragMoved) {
      // It was a click, not a drag
      if (hoveredSeedling && hoveredSeedling.url) {
        window.open(hoveredSeedling.url, '_blank', 'noopener');
      }
    }
  });
  renderer.domElement.addEventListener('mouseleave', () => {
    isDragging = false;
    hoveredSeedling = null;
    renderer.domElement.style.cursor = 'default';
    labelEl.classList.remove('visible');
  });

  // Touch
  let touchStartPos = { x: 0, y: 0 };
  renderer.domElement.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
      isDragging = true;
      dragMoved = false;
      prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      touchStartPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
  }, { passive: true });
  renderer.domElement.addEventListener('touchmove', e => {
    if (!isDragging || e.touches.length !== 1) return;
    const dx = e.touches[0].clientX - prevMouse.x;
    const dy = e.touches[0].clientY - prevMouse.y;
    if (Math.abs(e.touches[0].clientX - touchStartPos.x) > 10 || Math.abs(e.touches[0].clientY - touchStartPos.y) > 10) {
      dragMoved = true;
    }
    spherical.theta -= dx * 0.005;
    spherical.phi = Math.max(0.3, Math.min(Math.PI - 0.3, spherical.phi - dy * 0.005));
    prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  renderer.domElement.addEventListener('touchend', e => {
    isDragging = false;
    if (!dragMoved) {
      // Check for seedling tap
      updateHover(touchStartPos.x, touchStartPos.y);
      if (hoveredSeedling && hoveredSeedling.url) {
        window.open(hoveredSeedling.url, '_blank', 'noopener');
      }
    }
  });

  // Zoom
  renderer.domElement.addEventListener('wheel', e => {
    spherical.radius = Math.max(3, Math.min(18, spherical.radius + e.deltaY * 0.008));
  }, { passive: true });

  let bloomTime = 0;
  let animationDone = false;

  // === Resize ===
  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  // === Reduced motion ===
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // === Animation ===
  const clock = new THREE.Clock();
  let elapsed = 0;

  function easeInOut(t) { return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2; }
  function clamp01(t) { return Math.max(0, Math.min(1, t)); }

  function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();
    elapsed += dt;
    bloomTime += dt;

    const bloomProgress = clamp01(bloomTime / BLOOM_DURATION);

    // Phase timings
    const stemGrow = easeInOut(clamp01(bloomProgress * 3));
    const budForm = easeInOut(clamp01((bloomProgress - 0.2) * 4));
    const bloomOpen = easeInOut(clamp01((bloomProgress - 0.4) * 2.0));
    const fullBloom = easeInOut(clamp01((bloomProgress - 0.7) * 3.3));

    // Only rebuild geometry while animating; once done, use group transforms for sway
    if (!animationDone) {
      const headPos = buildStem(stemGrow);
      buildLeaves(stemGrow);
      buildFlowerHead(headPos, bloomOpen, fullBloom, budForm);
      buildAnnotations(stemGrow, headPos.y);
      buildSeedlings(bloomProgress);

      // Check if all animations are complete
      const lastSeedlingEnd = EXTRA_SEEDLING_DELAY + 60 + 1.2; // matches cubic easing maxTime
      if (bloomTime > lastSeedlingEnd && bloomProgress >= 1) {
        animationDone = true;
      }
    }

    // Gentle sway via group rotation (no geometry rebuild needed)
    const swayAngle = Math.sin(elapsed * 0.6) * 0.02;
    flower.rotation.x = swayAngle;
    seedlingsGroup.rotation.x = swayAngle * 0.5;

    // Camera orbit with gentle auto-rotation
    if (!isDragging && !prefersReduced) {
      spherical.theta += dt * 0.08;
    }

    camera.position.x = spherical.radius * Math.sin(spherical.phi) * Math.sin(spherical.theta);
    camera.position.y = spherical.radius * Math.cos(spherical.phi);
    camera.position.z = spherical.radius * Math.sin(spherical.phi) * Math.cos(spherical.theta);
    camera.lookAt(0, 0.3, 0);

    renderer.render(scene, camera);
  }

  animate();
})();
</script>
</body>
</html>
