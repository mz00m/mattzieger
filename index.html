<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matt Zieger — Interactive Blueprint</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #e8e0d0;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: crosshair;
  }
  canvas { display: block; width: 100vw; height: 100vh; }
  #ui {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(25, 55, 100, 0.4);
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    pointer-events: none;
    user-select: none;
    text-align: center;
  }
  .btn {
    position: fixed;
    top: 18px;
    background: none;
    border: 1.5px solid rgba(25, 55, 100, 0.35);
    color: rgba(25, 55, 100, 0.55);
    font-family: 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 8px 18px;
    cursor: pointer;
    transition: all 0.3s;
  }
  .btn:hover {
    background: rgba(25, 55, 100, 0.07);
    border-color: rgba(25, 55, 100, 0.6);
  }
  #startBtn { right: 18px; }
  #resetBtn { right: 130px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button class="btn" id="startBtn">&#9654; START</button>
<button class="btn" id="resetBtn">&#8634; RESET</button>
<div id="ui">click start to begin the chain reaction &middot; drag objects to interact &middot; scroll to zoom</div>

<script>
// ══════════════════════════════════════════════════════════════
//  MATTER.JS
// ══════════════════════════════════════════════════════════════
const { Engine, Bodies, Body, Composite, Constraint, Events, Mouse, MouseConstraint, Vector } = Matter;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, dpr;

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', () => {
  resize();
  if (mouse) mouse.pixelRatio = dpr;
});

// ── Colors ──
const INK = 'rgba(20, 50, 95, ';
const INK_L = 'rgba(40, 80, 140, ';
const INK_D = 'rgba(30, 60, 110, ';
const INK_F = 'rgba(25, 55, 100, ';
const RED = 'rgba(160, 40, 30, ';
const GREEN = 'rgba(30, 100, 60, ';
const PAPER = '#e8e0d0';

// ── Engine ──
const engine = Engine.create({ gravity: { x: 0, y: 1.0 } });
const world = engine.world;

// ── Camera ──
let camX = 0, camY = 0, zoom = 1, targetZoom = 1;

// ── State ──
let balls = [], staticBodies = [], dominoes = [], gears = [];
let pendulums = [], pegs = [], impactParticles = [];
let started = false, startBall = null, weightBody = null;
let S = 1, time = 0;
let mouse = null, mouseConstraint = null;

// ══════════════════════════════════════════════════════════════
//  3D ISOMETRIC LETTER SYSTEM
// ══════════════════════════════════════════════════════════════
// Each letter is defined as a set of 2D box segments { x, y, w, h }
// These get rendered as 3D isometric blocks and also become physics colliders

const ISO_ANGLE = Math.PI / 6; // 30° isometric
const ISO_DEPTH = 18;          // extrusion depth
const LETTER_SCALE = 2.8;

// Letter definitions (relative coordinates, will be scaled)
function getLetterBoxes(char) {
  const B = 8; // block unit
  switch(char) {
    case 'M': return [
      { x: 0, y: 0, w: B, h: B*5 },           // left pillar
      { x: B, y: 0, w: B, h: B*2 },            // left top
      { x: B*2, y: B, w: B, h: B*2 },          // center V
      { x: B*3, y: 0, w: B, h: B*2 },          // right top
      { x: B*4, y: 0, w: B, h: B*5 },          // right pillar
    ];
    case 'A': return [
      { x: 0, y: B, w: B, h: B*4 },            // left pillar
      { x: B, y: 0, w: B*2, h: B },             // top bar
      { x: B*3, y: B, w: B, h: B*4 },           // right pillar
      { x: B, y: B*2, w: B*2, h: B },           // cross bar
    ];
    case 'T': return [
      { x: 0, y: 0, w: B*4, h: B },             // top bar
      { x: B*1.5, y: B, w: B, h: B*4 },         // stem
    ];
    case 'Z': return [
      { x: 0, y: 0, w: B*4, h: B },             // top bar
      { x: B*2.5, y: B, w: B*1.5, h: B },       // upper diagonal part
      { x: B, y: B*2, w: B*2, h: B },           // middle
      { x: 0, y: B*3, w: B*1.5, h: B },         // lower diagonal part
      { x: 0, y: B*4, w: B*4, h: B },           // bottom bar
    ];
    case '.': return [
      { x: 0, y: B*3.5, w: B, h: B*1.5 },      // dot
    ];
    default: return [];
  }
}

// ── Draw a single 3D isometric block ──
function drawIsoBlock(ctx, x, y, w, h, depth, alpha) {
  const d = depth || ISO_DEPTH;
  const dx = d * Math.cos(ISO_ANGLE);
  const dy = -d * Math.sin(ISO_ANGLE);
  const a = alpha || 1;

  // Front face
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.fillStyle = INK_F + (0.03 * a) + ')';
  ctx.fill();
  ctx.strokeStyle = INK + (0.45 * a) + ')';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // Front face crosshatch
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.clip();
  for (let i = -h; i < w + h; i += 6) {
    ctx.beginPath();
    ctx.moveTo(x + i, y);
    ctx.lineTo(x + i - h * 0.7, y + h);
    ctx.strokeStyle = INK_F + (0.06 * a) + ')';
    ctx.lineWidth = 0.3;
    ctx.stroke();
  }
  ctx.restore();

  // Top face
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + dx, y + dy);
  ctx.lineTo(x + w + dx, y + dy);
  ctx.lineTo(x + w, y);
  ctx.closePath();
  ctx.fillStyle = INK_F + (0.02 * a) + ')';
  ctx.fill();
  ctx.strokeStyle = INK + (0.35 * a) + ')';
  ctx.lineWidth = 0.8;
  ctx.stroke();

  // Top face hatching
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + dx, y + dy);
  ctx.lineTo(x + w + dx, y + dy);
  ctx.lineTo(x + w, y);
  ctx.closePath();
  ctx.clip();
  for (let i = 0; i < w + d; i += 5) {
    ctx.beginPath();
    ctx.moveTo(x + i, y);
    ctx.lineTo(x + i + dx, y + dy);
    ctx.strokeStyle = INK_F + (0.05 * a) + ')';
    ctx.lineWidth = 0.3;
    ctx.stroke();
  }
  ctx.restore();

  // Right face
  ctx.beginPath();
  ctx.moveTo(x + w, y);
  ctx.lineTo(x + w + dx, y + dy);
  ctx.lineTo(x + w + dx, y + h + dy);
  ctx.lineTo(x + w, y + h);
  ctx.closePath();
  ctx.fillStyle = INK_F + (0.05 * a) + ')';
  ctx.fill();
  ctx.strokeStyle = INK + (0.4 * a) + ')';
  ctx.lineWidth = 0.8;
  ctx.stroke();

  // Right face hatching
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x + w, y);
  ctx.lineTo(x + w + dx, y + dy);
  ctx.lineTo(x + w + dx, y + h + dy);
  ctx.lineTo(x + w, y + h);
  ctx.closePath();
  ctx.clip();
  for (let i = 0; i < h + d; i += 4) {
    ctx.beginPath();
    ctx.moveTo(x + w, y + i);
    ctx.lineTo(x + w + dx, y + i + dy);
    ctx.strokeStyle = INK_F + (0.08 * a) + ')';
    ctx.lineWidth = 0.3;
    ctx.stroke();
  }
  ctx.restore();

  // Hidden edge (dashed)
  ctx.setLineDash([3, 3]);
  ctx.beginPath();
  ctx.moveTo(x + dx, y + dy);
  ctx.lineTo(x + dx, y + h + dy);
  ctx.strokeStyle = INK_D + (0.12 * a) + ')';
  ctx.lineWidth = 0.4;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x + dx, y + h + dy);
  ctx.lineTo(x, y + h);
  ctx.stroke();
  ctx.setLineDash([]);
}

// ── Build all letters as physics + visual ──
const letterData = []; // { char, boxes: [{ x,y,w,h }], originX, originY }

function buildLetters() {
  const text = 'MATT Z.';
  const spacing = 40 * LETTER_SCALE;
  const totalWidth = text.length * spacing;
  const startX = -totalWidth / 2;
  const startY = -60;

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === ' ') continue;
    const boxes = getLetterBoxes(ch);
    const ox = startX + i * spacing;
    const oy = startY;
    const scaledBoxes = [];

    for (const b of boxes) {
      const sx = ox + b.x * LETTER_SCALE;
      const sy = oy + b.y * LETTER_SCALE;
      const sw = b.w * LETTER_SCALE;
      const sh = b.h * LETTER_SCALE;
      scaledBoxes.push({ x: sx, y: sy, w: sw, h: sh });

      // Physics collider
      const body = Bodies.rectangle(sx + sw/2, sy + sh/2, sw, sh, {
        isStatic: true, friction: 0.3, restitution: 0.2, label: 'letter'
      });
      Composite.add(world, body);
      staticBodies.push(body);
    }

    letterData.push({ char: ch, boxes: scaledBoxes, originX: ox, originY: oy });
  }
}

function drawLetters(ctx) {
  for (const ld of letterData) {
    for (const b of ld.boxes) {
      drawIsoBlock(ctx, b.x, b.y, b.w, b.h, ISO_DEPTH * LETTER_SCALE * 0.7);
    }
  }
}

// ══════════════════════════════════════════════════════════════
//  BUILD RUBE GOLDBERG MACHINE AROUND LETTERS
// ══════════════════════════════════════════════════════════════
function buildScene() {
  Composite.clear(world, false);
  // Re-add mouse constraint if it was already created
  if (mouseConstraint) Composite.add(world, mouseConstraint);
  balls = []; staticBodies = []; dominoes = []; gears = [];
  pendulums = []; pegs = []; impactParticles = [];
  started = false; startBall = null; weightBody = null;
  letterData.length = 0;

  S = Math.min(W / 1600, H / 1000);
  if (S < 0.45) S = 0.45;
  camX = 0; camY = 30; zoom = 1; targetZoom = 1;

  const rampOpts = { isStatic: true, friction: 0.3, restitution: 0.15, label: 'ramp' };

  // ── Build the 3D letters ──
  buildLetters();

  // ── Boundaries ──
  const wallOpts = { isStatic: true, friction: 0.4, restitution: 0.3, label: 'wall' };
  const floor = Bodies.rectangle(0, 430, 2000, 20, wallOpts);
  Composite.add(world, floor);
  staticBodies.push(floor);

  // ════════════════════════════════════════════════
  // STAGE 1: Ball release — high above the "M"
  // ════════════════════════════════════════════════
  const mLetter = letterData[0]; // M
  const mTopY = mLetter.originY - 30;
  const mLeftX = mLetter.originX - 20;

  // Starting platform
  const startPlat = Bodies.rectangle(mLeftX - 60, mTopY - 100, 100, 6, { ...rampOpts, angle: 0.05 });
  Composite.add(world, startPlat);
  staticBodies.push(startPlat);

  // Start ball
  startBall = Bodies.circle(mLeftX - 90, mTopY - 115, 10, {
    restitution: 0.5, friction: 0.3, density: 0.004, label: 'ball', isStatic: true
  });
  Composite.add(world, startBall);
  balls.push(startBall);

  // Ramp from start down to M top
  const r1 = Bodies.rectangle(mLeftX + 10, mTopY - 55, 140, 5, { ...rampOpts, angle: 0.4 });
  Composite.add(world, r1); staticBodies.push(r1);

  // Ramp across M top (ball rolls right)
  const mTopRight = mLetter.boxes[mLetter.boxes.length - 1];
  const r2 = Bodies.rectangle(mTopRight.x + mTopRight.w + 30, mTopY + 5, 80, 5, { ...rampOpts, angle: 0.3 });
  Composite.add(world, r2); staticBodies.push(r2);

  // ════════════════════════════════════════════════
  // STAGE 2: Ramp cascade between M and A
  // ════════════════════════════════════════════════
  const aLetter = letterData[1]; // A
  const r3 = Bodies.rectangle(aLetter.originX - 30, mTopY + 55, 100, 5, { ...rampOpts, angle: -0.3 });
  Composite.add(world, r3); staticBodies.push(r3);

  const r4 = Bodies.rectangle(aLetter.originX + 40, mTopY + 110, 110, 5, { ...rampOpts, angle: 0.25 });
  Composite.add(world, r4); staticBodies.push(r4);

  // ════════════════════════════════════════════════
  // STAGE 3: Dominoes on top of A's crossbar area
  // ════════════════════════════════════════════════
  const aCrossbar = aLetter.boxes[3]; // crossbar of A
  const domPlatY = aCrossbar.y - 15;

  const domPlat = Bodies.rectangle(aCrossbar.x + aCrossbar.w / 2, domPlatY + 2, 120, 5, rampOpts);
  Composite.add(world, domPlat); staticBodies.push(domPlat);

  for (let i = 0; i < 7; i++) {
    const d = Bodies.rectangle(aCrossbar.x + 10 + i * 15, domPlatY - 14, 5, 28, {
      friction: 0.6, restitution: 0.05, density: 0.003, label: 'domino'
    });
    Composite.add(world, d);
    dominoes.push(d);
  }

  // ════════════════════════════════════════════════
  // STAGE 4: Pendulum between A and first T
  // ════════════════════════════════════════════════
  const t1Letter = letterData[2]; // first T
  const pendAnchorX = (aLetter.originX + t1Letter.originX) / 2 + 30;
  const pendAnchorY = mTopY - 80;
  const pendBob = Bodies.circle(pendAnchorX + 30, pendAnchorY + 120, 14, {
    density: 0.005, restitution: 0.4, friction: 0.2, label: 'ball'
  });
  const pendCon = Constraint.create({
    bodyA: pendBob,
    pointB: { x: pendAnchorX, y: pendAnchorY },
    length: 130, stiffness: 0.9, damping: 0.002, label: 'pendulum'
  });
  Composite.add(world, [pendBob, pendCon]);
  pendulums.push({ bob: pendBob, constraint: pendCon, anchorX: pendAnchorX, anchorY: pendAnchorY });
  balls.push(pendBob);

  // ════════════════════════════════════════════════
  // STAGE 5: Ramps around the T's
  // ════════════════════════════════════════════════
  const t1Top = t1Letter.boxes[0]; // T top bar
  const t2Letter = letterData[3]; // second T

  // Ramp from pendulum area down through T1
  const r5 = Bodies.rectangle(t1Letter.originX + 50, t1Top.y + t1Top.h + 30, 80, 5, { ...rampOpts, angle: 0.35 });
  Composite.add(world, r5); staticBodies.push(r5);

  // Bridge between T's
  const r6 = Bodies.rectangle((t1Letter.originX + t2Letter.originX) / 2 + 30, t1Top.y + t1Top.h + 80, 100, 5, { ...rampOpts, angle: -0.2 });
  Composite.add(world, r6); staticBodies.push(r6);

  // ════════════════════════════════════════════════
  // STAGE 6: Seesaw at the space between T and Z
  // ════════════════════════════════════════════════
  const zLetter = letterData[4]; // Z
  const seesawX = (t2Letter.originX + zLetter.originX) / 2 + 40;
  const seesawY = zLetter.originY + 60;

  const seesawArm = Bodies.rectangle(seesawX, seesawY, 160, 6, {
    friction: 0.5, density: 0.002, label: 'seesaw'
  });
  const seesawBase = Bodies.polygon(seesawX, seesawY + 16, 3, 18, {
    isStatic: true, label: 'base', angle: Math.PI
  });
  const seesawPin = Constraint.create({
    bodyA: seesawArm, pointB: { x: seesawX, y: seesawY },
    length: 0, stiffness: 0.9
  });
  Composite.add(world, [seesawArm, seesawBase, seesawPin]);
  staticBodies.push(seesawBase);

  // Launch ball on seesaw
  const launchBall = Bodies.circle(seesawX + 60, seesawY - 15, 9, {
    restitution: 0.6, friction: 0.3, density: 0.003, label: 'ball'
  });
  Composite.add(world, launchBall);
  balls.push(launchBall);

  // Weight to drop on seesaw
  weightBody = Bodies.rectangle(seesawX - 50, seesawY - 120, 24, 24, {
    density: 0.01, restitution: 0.1, friction: 0.5, label: 'weight', isStatic: true
  });
  Composite.add(world, weightBody);
  balls.push(weightBody);

  // Ramp leading to seesaw
  const r7 = Bodies.rectangle(seesawX - 60, seesawY - 35, 90, 5, { ...rampOpts, angle: 0.3 });
  Composite.add(world, r7); staticBodies.push(r7);

  // ════════════════════════════════════════════════
  // STAGE 7: Peg board beneath Z letter
  // ════════════════════════════════════════════════
  const zBottom = zLetter.boxes[zLetter.boxes.length - 1];
  const pegStartX = zLetter.originX + 5;
  const pegStartY = zBottom.y + zBottom.h + 20;

  for (let row = 0; row < 5; row++) {
    for (let col = 0; col < 4 + (row % 2); col++) {
      const px = pegStartX + col * 22 - (row % 2 === 0 ? 11 : 0);
      const py = pegStartY + row * 22;
      const peg = Bodies.circle(px, py, 3.5, {
        isStatic: true, restitution: 0.5, friction: 0.1, label: 'peg'
      });
      Composite.add(world, peg);
      pegs.push(peg);
    }
  }

  // ════════════════════════════════════════════════
  // STAGE 8: Funnel under dot → final ramps
  // ════════════════════════════════════════════════
  const dotLetter = letterData[5]; // "."
  const dotBox = dotLetter.boxes[0];

  // Funnel walls
  const fL = Bodies.rectangle(dotBox.x - 25, dotBox.y + dotBox.h + 40, 50, 5, { ...rampOpts, angle: 0.6 });
  const fR = Bodies.rectangle(dotBox.x + dotBox.w + 25, dotBox.y + dotBox.h + 40, 50, 5, { ...rampOpts, angle: -0.6 });
  Composite.add(world, [fL, fR]); staticBodies.push(fL, fR);

  // Final collection ramps
  const r8 = Bodies.rectangle(dotBox.x, dotBox.y + dotBox.h + 100, 120, 5, { ...rampOpts, angle: -0.3 });
  Composite.add(world, r8); staticBodies.push(r8);

  const r9 = Bodies.rectangle(dotBox.x - 100, dotBox.y + dotBox.h + 150, 100, 5, { ...rampOpts, angle: 0.25 });
  Composite.add(world, r9); staticBodies.push(r9);

  // ════════════════════════════════════════════════
  // STAGE 9: Newton's cradle (decorative, top right)
  // ════════════════════════════════════════════════
  for (let i = 0; i < 5; i++) {
    const nbX = zLetter.originX + 50 + i * 18;
    const nbY = mTopY - 130;
    const nBob = Bodies.circle(nbX, nbY + 70, 8, {
      density: 0.005, restitution: 0.99, friction: 0.01, label: 'ball'
    });
    const nCon = Constraint.create({
      bodyA: nBob, pointB: { x: nbX, y: nbY },
      length: 70, stiffness: 0.95, damping: 0.001
    });
    Composite.add(world, [nBob, nCon]);
    pendulums.push({ bob: nBob, constraint: nCon, anchorX: nbX, anchorY: nbY });
    balls.push(nBob);
  }

  // ════════════════════════════════════════════════
  // GEARS (decorative, bottom left)
  // ════════════════════════════════════════════════
  const gx = mLetter.originX - 30;
  const gy = mLetter.originY + 160;
  gears.push(
    { x: gx, y: gy, radius: 38, teeth: 10, angle: 0, speed: 0.7 },
    { x: gx + 60, y: gy, radius: 26, teeth: 7, angle: 0, speed: -0.7 * (38/26) },
    { x: gx + 60 + 42, y: gy, radius: 18, teeth: 5, angle: 0, speed: 0.7 * (38/18) }
  );

  // Second gear set bottom right
  const gx2 = zLetter.originX + 60;
  const gy2 = zLetter.originY + 200;
  gears.push(
    { x: gx2, y: gy2, radius: 30, teeth: 8, angle: 0, speed: -1.0 },
    { x: gx2 + 48, y: gy2, radius: 22, teeth: 6, angle: 0, speed: 1.0 * (30/22) }
  );

  // ════════════════════════════════════════════════
  // EXTRA: Bucket at bottom center
  // ════════════════════════════════════════════════
  const bkX = 0, bkY = 380;
  const bkL = Bodies.rectangle(bkX - 30, bkY, 6, 50, rampOpts);
  const bkR = Bodies.rectangle(bkX + 30, bkY, 6, 50, rampOpts);
  const bkB = Bodies.rectangle(bkX, bkY + 22, 66, 6, rampOpts);
  Composite.add(world, [bkL, bkR, bkB]);
  staticBodies.push(bkL, bkR, bkB);

  // Extra ramp feeding to bucket
  const r10 = Bodies.rectangle(bkX - 80, bkY - 40, 100, 5, { ...rampOpts, angle: 0.3 });
  Composite.add(world, r10); staticBodies.push(r10);

  // ════════════════════════════════════════════════
  // Trampoline
  // ════════════════════════════════════════════════
  const tramp = Bodies.rectangle(bkX + 130, bkY + 10, 60, 8, {
    isStatic: true, restitution: 0.92, friction: 0.2, label: 'trampoline'
  });
  Composite.add(world, tramp);
  staticBodies.push(tramp);

  // Extra loose balls for fun
  for (let i = 0; i < 3; i++) {
    const eb = Bodies.circle(mLeftX + 160 + i * 50, mTopY - 140 - i * 20, 7, {
      restitution: 0.5, friction: 0.3, density: 0.003, label: 'ball', isStatic: true
    });
    Composite.add(world, eb);
    balls.push(eb);
  }
}

buildScene();

// ── Mouse ──
mouse = Mouse.create(canvas);
mouseConstraint = MouseConstraint.create(engine, {
  mouse, constraint: { stiffness: 0.08, render: { visible: false } }
});
mouse.pixelRatio = dpr;
Composite.add(world, mouseConstraint);

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  targetZoom *= e.deltaY > 0 ? 0.93 : 1.07;
  targetZoom = Math.max(0.3, Math.min(3, targetZoom));
}, { passive: false });

// ── Start / Reset ──
document.getElementById('startBtn').addEventListener('click', () => {
  if (!started && startBall) {
    started = true;
    Body.setStatic(startBall, false);
    // Release extra balls
    setTimeout(() => {
      for (const b of balls) {
        if (b.isStatic && b.label === 'ball') Body.setStatic(b, false);
      }
    }, 1200);
    // Drop weight
    setTimeout(() => {
      if (weightBody) Body.setStatic(weightBody, false);
    }, 3000);
  }
});
document.getElementById('resetBtn').addEventListener('click', buildScene);

// ── Collision particles ──
Events.on(engine, 'collisionStart', event => {
  for (const pair of event.pairs) {
    const speed = Vector.magnitude(Vector.sub(pair.bodyA.velocity, pair.bodyB.velocity));
    if (speed > 2.5) {
      const pt = pair.collision.supports?.[0] || pair.bodyA.position;
      for (let i = 0; i < Math.min(speed * 1.5, 10); i++) {
        impactParticles.push({
          x: pt.x, y: pt.y,
          vx: (Math.random() - 0.5) * speed * 1.2,
          vy: (Math.random() - 0.5) * speed * 1.2 - 1,
          life: 1, size: Math.random() * 2 + 0.5
        });
      }
    }
  }
});

// ══════════════════════════════════════════════════════════════
//  DRAWING HELPERS
// ══════════════════════════════════════════════════════════════
function drawGear(ctx, g) {
  ctx.save();
  ctx.translate(g.x, g.y);
  ctx.rotate(g.angle);

  ctx.beginPath();
  ctx.arc(0, 0, g.radius, 0, Math.PI * 2);
  ctx.strokeStyle = INK + '0.45)';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(0, 0, g.radius * 0.55, 0, Math.PI * 2);
  ctx.strokeStyle = INK + '0.18)';
  ctx.lineWidth = 0.5;
  ctx.stroke();

  for (let i = 0; i < g.teeth; i++) {
    const a1 = (i / g.teeth) * Math.PI * 2;
    const a2 = ((i + 0.38) / g.teeth) * Math.PI * 2;
    const r1 = g.radius, r2 = g.radius + 6;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a1)*r1, Math.sin(a1)*r1);
    ctx.lineTo(Math.cos(a1)*r2, Math.sin(a1)*r2);
    ctx.lineTo(Math.cos(a2)*r2, Math.sin(a2)*r2);
    ctx.lineTo(Math.cos(a2)*r1, Math.sin(a2)*r1);
    ctx.strokeStyle = INK + '0.35)';
    ctx.lineWidth = 0.7;
    ctx.stroke();
  }

  for (let i = 0; i < 4; i++) {
    const a = (i/4) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*3, Math.sin(a)*3);
    ctx.lineTo(Math.cos(a)*g.radius*0.5, Math.sin(a)*g.radius*0.5);
    ctx.strokeStyle = INK_D + '0.2)';
    ctx.lineWidth = 0.6;
    ctx.stroke();
  }

  ctx.beginPath();
  ctx.arc(0, 0, 3, 0, Math.PI * 2);
  ctx.fillStyle = INK + '0.35)';
  ctx.fill();

  ctx.restore();
}

function drawBody(ctx, body) {
  const v = body.vertices;
  if (!v || v.length < 2) return;
  const label = body.label || '';

  if (label === 'wall' || label === 'letter') return;

  // Circle bodies (balls, pegs)
  if (label === 'ball' || label === 'pendulum-bob') {
    const r = body.circleRadius || 10;
    ctx.beginPath();
    ctx.arc(body.position.x, body.position.y, r, 0, Math.PI * 2);
    ctx.strokeStyle = INK + '0.6)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Crosshatch fill
    ctx.save();
    ctx.beginPath();
    ctx.arc(body.position.x, body.position.y, r, 0, Math.PI * 2);
    ctx.clip();
    for (let i = -r*2; i < r*2; i += 3) {
      ctx.beginPath();
      ctx.moveTo(body.position.x + i, body.position.y - r);
      ctx.lineTo(body.position.x + i - r*0.8, body.position.y + r);
      ctx.strokeStyle = INK_F + '0.1)';
      ctx.lineWidth = 0.3;
      ctx.stroke();
    }
    ctx.restore();

    // Center
    ctx.beginPath();
    ctx.arc(body.position.x, body.position.y, 1.5, 0, Math.PI * 2);
    ctx.fillStyle = INK + '0.5)';
    ctx.fill();
    return;
  }

  if (label === 'peg') {
    ctx.beginPath();
    ctx.arc(body.position.x, body.position.y, body.circleRadius || 3.5, 0, Math.PI * 2);
    ctx.fillStyle = INK + '0.3)';
    ctx.fill();
    ctx.strokeStyle = INK + '0.5)';
    ctx.lineWidth = 0.7;
    ctx.stroke();
    return;
  }

  // Color by type
  let strokeA = 0.5, lw = 1.2, fillA = 0;
  let color = INK;

  if (label === 'ramp' || label === 'platform') { lw = 1.5; fillA = 0.03; }
  if (label === 'domino') { strokeA = 0.5; lw = 1; fillA = 0.05; }
  if (label === 'seesaw') { lw = 1.8; }
  if (label === 'weight') { strokeA = 0.6; lw = 1.5; fillA = 0.07; }
  if (label === 'base') { color = INK_D; strokeA = 0.35; }
  if (label === 'trampoline') { color = RED; strokeA = 0.5; lw = 2; }

  ctx.beginPath();
  ctx.moveTo(v[0].x, v[0].y);
  for (let i = 1; i < v.length; i++) ctx.lineTo(v[i].x, v[i].y);
  ctx.closePath();
  if (fillA > 0) { ctx.fillStyle = color + fillA + ')'; ctx.fill(); }
  ctx.strokeStyle = color + strokeA + ')';
  ctx.lineWidth = lw;
  ctx.stroke();

  // Weight crosshatch
  if (label === 'weight') {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(v[0].x, v[0].y);
    for (let i = 1; i < v.length; i++) ctx.lineTo(v[i].x, v[i].y);
    ctx.closePath(); ctx.clip();
    for (let i = -50; i < 50; i += 4) {
      ctx.beginPath();
      ctx.moveTo(body.position.x + i, body.position.y - 30);
      ctx.lineTo(body.position.x + i + 20, body.position.y + 30);
      ctx.strokeStyle = INK_F + '0.08)';
      ctx.lineWidth = 0.3;
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawConstraintLine(ctx, con) {
  if (!con.bodyA || !con.pointB) return;
  const pA = con.bodyA.position;
  const pB = con.pointB;

  ctx.beginPath();
  ctx.moveTo(pA.x, pA.y);
  ctx.lineTo(pB.x, pB.y);
  ctx.strokeStyle = INK + '0.25)';
  ctx.lineWidth = 0.7;
  ctx.setLineDash([4, 3]);
  ctx.stroke();
  ctx.setLineDash([]);

  // Anchor
  ctx.beginPath();
  ctx.arc(pB.x, pB.y, 3, 0, Math.PI * 2);
  ctx.fillStyle = INK + '0.35)';
  ctx.fill();

  // Mount bar
  ctx.beginPath();
  ctx.moveTo(pB.x - 7, pB.y); ctx.lineTo(pB.x + 7, pB.y);
  ctx.strokeStyle = INK_D + '0.3)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  for (let i = -7; i <= 7; i += 3) {
    ctx.beginPath();
    ctx.moveTo(pB.x + i, pB.y);
    ctx.lineTo(pB.x + i - 3, pB.y - 4);
    ctx.strokeStyle = INK_D + '0.15)';
    ctx.lineWidth = 0.4;
    ctx.stroke();
  }
}

function drawGrid(ctx) {
  const gs = 50, sgs = 10;
  const sx = Math.floor((camX - W/2/zoom) / gs) * gs;
  const sy = Math.floor((camY - H/2/zoom) / gs) * gs;
  const ex = camX + W/2/zoom + gs;
  const ey = camY + H/2/zoom + gs;

  // Small
  const ssx = Math.floor((camX - W/2/zoom) / sgs) * sgs;
  const ssy = Math.floor((camY - H/2/zoom) / sgs) * sgs;
  ctx.beginPath();
  for (let x = ssx; x < ex; x += sgs) { ctx.moveTo(x, camY-H/2/zoom); ctx.lineTo(x, ey); }
  for (let y = ssy; y < ey; y += sgs) { ctx.moveTo(camX-W/2/zoom, y); ctx.lineTo(ex, y); }
  ctx.strokeStyle = 'rgba(120,140,160,0.05)';
  ctx.lineWidth = 0.3;
  ctx.stroke();

  // Major
  ctx.beginPath();
  for (let x = sx; x < ex; x += gs) { ctx.moveTo(x, camY-H/2/zoom); ctx.lineTo(x, ey); }
  for (let y = sy; y < ey; y += gs) { ctx.moveTo(camX-W/2/zoom, y); ctx.lineTo(ex, y); }
  ctx.strokeStyle = 'rgba(100,120,150,0.09)';
  ctx.lineWidth = 0.4;
  ctx.stroke();
}

function drawDimLine(ctx, x1, y1, x2, y2, label, off) {
  off = off || 16;
  const dx = x2-x1, dy = y2-y1, ang = Math.atan2(dy,dx);
  const px = -Math.sin(ang)*off, py = Math.cos(ang)*off;

  ctx.beginPath();
  ctx.moveTo(x1,y1); ctx.lineTo(x1+px,y1+py);
  ctx.moveTo(x2,y2); ctx.lineTo(x2+px,y2+py);
  ctx.moveTo(x1+px,y1+py); ctx.lineTo(x2+px,y2+py);
  ctx.strokeStyle = INK_D + '0.2)';
  ctx.lineWidth = 0.4;
  ctx.stroke();

  const as = 3.5;
  for (const [sx2,sy2,dir] of [[x1+px,y1+py,1],[x2+px,y2+py,-1]]) {
    ctx.beginPath();
    ctx.moveTo(sx2,sy2);
    ctx.lineTo(sx2+Math.cos(ang+0.4)*as*dir, sy2+Math.sin(ang+0.4)*as*dir);
    ctx.moveTo(sx2,sy2);
    ctx.lineTo(sx2+Math.cos(ang-0.4)*as*dir, sy2+Math.sin(ang-0.4)*as*dir);
    ctx.stroke();
  }

  const lx = (x1+x2)/2+px, ly = (y1+y2)/2+py;
  ctx.save();
  ctx.translate(lx, ly);
  let ta = ang; if (ta > Math.PI/2 || ta < -Math.PI/2) ta += Math.PI;
  ctx.rotate(ta);
  ctx.font = '6px Courier New';
  ctx.fillStyle = INK_D + '0.3)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillText(label, 0, -2);
  ctx.restore();
}

function drawParticles(ctx, dt) {
  for (let i = impactParticles.length - 1; i >= 0; i--) {
    const p = impactParticles[i];
    p.x += p.vx * dt * 60; p.y += p.vy * dt * 60;
    p.vy += 0.15; p.life -= dt * 3;
    if (p.life <= 0) { impactParticles.splice(i, 1); continue; }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = INK + (p.life * 0.35) + ')';
    ctx.fill();
  }
}

function drawBorder(ctx) {
  const bx = -600, by = -350, bw = 1200, bh = 810;

  ctx.strokeStyle = INK_D + '0.12)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(bx, by, bw, bh);
  ctx.strokeStyle = INK_D + '0.06)';
  ctx.lineWidth = 0.5;
  ctx.strokeRect(bx+7, by+7, bw-14, bh-14);

  // Corner marks
  const c = 16;
  ctx.strokeStyle = INK_D + '0.18)';
  ctx.lineWidth = 1;
  for (const [cx2,cy2] of [[bx,by],[bx+bw,by],[bx,by+bh],[bx+bw,by+bh]]) {
    const dx2 = cx2===bx?1:-1, dy2 = cy2===by?1:-1;
    ctx.beginPath();
    ctx.moveTo(cx2, cy2+c*dy2); ctx.lineTo(cx2,cy2); ctx.lineTo(cx2+c*dx2,cy2);
    ctx.stroke();
  }

  // Title block
  const tbx = bx+bw-200, tby = by+bh-60, tbw = 200, tbh = 60;
  ctx.strokeStyle = INK_D + '0.18)';
  ctx.lineWidth = 0.7;
  ctx.strokeRect(tbx, tby, tbw, tbh);
  ctx.beginPath();
  ctx.moveTo(tbx, tby+20); ctx.lineTo(tbx+tbw, tby+20);
  ctx.moveTo(tbx, tby+40); ctx.lineTo(tbx+tbw, tby+40);
  ctx.stroke();

  ctx.font = '7px Courier New';
  ctx.fillStyle = INK_D + '0.3)';
  ctx.fillText('RUBE GOLDBERG — INTERACTIVE', tbx+6, tby+14);
  ctx.font = '8px Courier New';
  ctx.fillStyle = INK + '0.35)';
  ctx.fillText('MATT ZIEGER', tbx+6, tby+34);
  ctx.font = '6px Courier New';
  ctx.fillStyle = INK_D + '0.25)';
  ctx.fillText('SCALE 1:1  REV 05  2026-03-17', tbx+6, tby+53);
}

function drawFlowArrows(ctx) {
  const pulse = (Math.sin(time * 2) + 1) / 2;
  const a = 0.08 + pulse * 0.08;

  if (letterData.length < 5) return;

  const arrows = [];
  // Build flow path through letters
  for (let i = 0; i < letterData.length - 1; i++) {
    const cur = letterData[i], next = letterData[i+1];
    const ax = (cur.originX + next.originX) / 2 + 30;
    const ay = cur.originY + 50;
    const angle = Math.atan2(next.originY - cur.originY, next.originX - cur.originX);
    arrows.push({ x: ax, y: ay, angle });
  }

  for (const arr of arrows) {
    ctx.save();
    ctx.translate(arr.x, arr.y);
    ctx.rotate(arr.angle);
    ctx.beginPath();
    ctx.moveTo(-10, 0); ctx.lineTo(10, 0);
    ctx.moveTo(5, -4); ctx.lineTo(10, 0); ctx.lineTo(5, 4);
    ctx.strokeStyle = GREEN + a + ')';
    ctx.lineWidth = 0.8;
    ctx.stroke();
    ctx.restore();
  }
}

function drawAnnotations(ctx) {
  if (letterData.length < 5) return;

  ctx.font = '6px Courier New';
  ctx.fillStyle = INK_D + '0.25)';

  const labels = [
    { txt: 'STAGE 1 — BALL RELEASE', x: letterData[0].originX - 50, y: letterData[0].originY - 140 },
    { txt: 'STAGE 2 — RAMP CASCADE', x: letterData[0].originX + 60, y: letterData[0].originY - 20 },
    { txt: 'STAGE 3 — DOMINO CHAIN', x: letterData[1].originX, y: letterData[1].originY - 50 },
    { txt: 'STAGE 4 — PENDULUM', x: (letterData[1].originX+letterData[2].originX)/2-10, y: letterData[1].originY - 120 },
    { txt: 'STAGE 5 — SEESAW LAUNCH', x: letterData[3].originX + 50, y: letterData[3].originY - 80 },
    { txt: 'STAGE 6 — GALTON BOARD', x: letterData[4].originX - 10, y: letterData[4].originY + 140 },
    { txt: "NEWTON'S CRADLE", x: letterData[4].originX + 40, y: letterData[0].originY - 155 },
    { txt: 'GEAR TRAIN — 3-STAGE', x: letterData[0].originX - 50, y: letterData[0].originY + 145 },
    { txt: 'COLLECTION BUCKET', x: -40, y: 340 },
  ];

  for (const l of labels) {
    ctx.fillText(l.txt, l.x, l.y);
    // Leader tick
    ctx.beginPath();
    ctx.moveTo(l.x, l.y + 2);
    ctx.lineTo(l.x + 12, l.y + 8);
    ctx.strokeStyle = INK_D + '0.12)';
    ctx.lineWidth = 0.3;
    ctx.stroke();
  }

  // Section circles
  const sections = 'ABCDEF';
  const sectionPos = [
    { x: letterData[0].originX - 80, y: letterData[0].originY - 100 },
    { x: letterData[1].originX + 20, y: letterData[1].originY - 30 },
    { x: (letterData[2].originX+letterData[3].originX)/2, y: letterData[2].originY - 100 },
    { x: letterData[4].originX + 20, y: letterData[4].originY + 80 },
    { x: 0, y: 360 },
    { x: letterData[4].originX + 50, y: letterData[0].originY - 140 },
  ];

  for (let i = 0; i < sectionPos.length; i++) {
    const sp = sectionPos[i];
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, 10, 0, Math.PI * 2);
    ctx.strokeStyle = RED + '0.25)';
    ctx.lineWidth = 0.8;
    ctx.stroke();
    ctx.font = '8px Courier New';
    ctx.fillStyle = RED + '0.35)';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(sections[i], sp.x, sp.y + 1);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }

  // Dimension lines on letters
  if (letterData.length > 0) {
    const m = letterData[0];
    const lastBox = m.boxes[m.boxes.length - 1];
    drawDimLine(ctx, m.boxes[0].x, m.boxes[0].y + m.boxes[0].h + 5,
      lastBox.x + lastBox.w, lastBox.y + lastBox.h + 5,
      Math.round(lastBox.x + lastBox.w - m.boxes[0].x) + 'mm', 12);
  }
}

// ── Paper texture ──
const paperCvs = document.createElement('canvas');
const paperCtx = paperCvs.getContext('2d');
paperCvs.width = 256; paperCvs.height = 256;
paperCtx.fillStyle = PAPER;
paperCtx.fillRect(0, 0, 256, 256);
for (let i = 0; i < 6000; i++) {
  paperCtx.fillStyle = `rgba(0,0,0,${Math.random()*0.035})`;
  paperCtx.fillRect(Math.random()*256, Math.random()*256, 1, 1);
}
for (let i = 0; i < 3; i++) {
  const gx = Math.random()*256, gy = Math.random()*256;
  const grad = paperCtx.createRadialGradient(gx,gy,0,gx,gy,40+Math.random()*50);
  grad.addColorStop(0, 'rgba(170,150,120,0.05)');
  grad.addColorStop(1, 'rgba(170,150,120,0)');
  paperCtx.fillStyle = grad;
  paperCtx.fillRect(0,0,256,256);
}
const paperPat = ctx.createPattern(paperCvs, 'repeat');

// ══════════════════════════════════════════════════════════════
//  MAIN LOOP
// ══════════════════════════════════════════════════════════════
let lastTime = performance.now();

function frame(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.033);
  lastTime = now;
  time += dt;

  // Update mouse for camera transform so dragging works in world space
  if (mouse) {
    mouse.scale.x = 1 / zoom;
    mouse.scale.y = 1 / zoom;
    mouse.offset.x = camX - W / (2 * zoom);
    mouse.offset.y = camY - H / (2 * zoom);
  }

  Engine.update(engine, dt * 1000);
  for (const g of gears) g.angle += g.speed * dt;
  zoom += (targetZoom - zoom) * 0.1;

  // ── Paper background ──
  ctx.fillStyle = paperPat || PAPER;
  ctx.fillRect(0, 0, W, H);

  // ── Camera ──
  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.scale(zoom, zoom);
  ctx.translate(-camX, -camY);

  drawGrid(ctx);

  // Construction lines (faint dashed)
  ctx.setLineDash([5, 4]);
  ctx.strokeStyle = INK_F + '0.05)';
  ctx.lineWidth = 0.3;
  for (let y = -300; y <= 400; y += 100) {
    ctx.beginPath(); ctx.moveTo(-600,y); ctx.lineTo(600,y); ctx.stroke();
  }
  for (let x = -600; x <= 600; x += 100) {
    ctx.beginPath(); ctx.moveTo(x,-350); ctx.lineTo(x,460); ctx.stroke();
  }
  ctx.setLineDash([]);

  drawBorder(ctx);
  drawFlowArrows(ctx);

  // ── 3D Letters ──
  drawLetters(ctx);

  // ── Gears ──
  for (const g of gears) drawGear(ctx, g);

  // ── Physics bodies ──
  const allBodies = Matter.Composite.allBodies(world);
  for (const b of allBodies) drawBody(ctx, b);

  // ── Constraints ──
  for (const p of pendulums) drawConstraintLine(ctx, p.constraint);

  // ── Seesaw pivot ──
  // find seesaw pin (it's a constraint with pointB)
  const allCons = Matter.Composite.allConstraints(world);
  for (const con of allCons) {
    if (con.label === 'seesaw-pin' || con.label === 'constraint') {
      // skip mouse constraint
    }
  }

  // ── Annotations ──
  drawAnnotations(ctx);

  // ── Particles ──
  drawParticles(ctx, dt);

  // Bucket flag
  ctx.beginPath();
  ctx.moveTo(0, 350); ctx.lineTo(0, 320);
  ctx.lineTo(25, 325); ctx.lineTo(0, 330);
  ctx.strokeStyle = RED + '0.25)';
  ctx.lineWidth = 0.7;
  ctx.stroke();
  ctx.font = '7px Courier New';
  ctx.fillStyle = RED + '0.3)';
  ctx.fillText('FINISH', 5, 315);

  // Spring coils under trampoline
  const trampBodies = staticBodies.filter(b => b.label === 'trampoline');
  for (const t of trampBodies) {
    for (let i = 0; i < 3; i++) {
      const sx = t.position.x - 15 + i * 15;
      ctx.beginPath();
      for (let j = 0; j <= 8; j++) {
        const tt = j/8;
        const px = sx + Math.sin(tt * Math.PI * 4) * 3;
        const py = t.position.y + 4 + tt * 16;
        if (j === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.strokeStyle = RED + '0.2)';
      ctx.lineWidth = 0.6;
      ctx.stroke();
    }
  }

  ctx.restore();

  // ── Vignette ──
  const vig = ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.max(W,H)*0.75);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.1)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);

  // Subtle scanlines
  ctx.fillStyle = 'rgba(0,0,0,0.012)';
  for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

canvas.addEventListener('contextmenu', e => e.preventDefault());

// ── Pan ──
let panning = false, psx = 0, psy = 0, pcx = 0, pcy = 0;
canvas.addEventListener('mousedown', e => {
  if (e.button === 1 || e.button === 2) {
    panning = true; psx = e.clientX; psy = e.clientY; pcx = camX; pcy = camY;
  }
});
canvas.addEventListener('mousemove', e => {
  if (panning) { camX = pcx - (e.clientX - psx)/zoom; camY = pcy - (e.clientY - psy)/zoom; }
});
canvas.addEventListener('mouseup', e => { if (e.button===1||e.button===2) panning = false; });

let lastTD = 0;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    lastTD = d; panning = true;
    psx = (e.touches[0].clientX+e.touches[1].clientX)/2;
    psy = (e.touches[0].clientY+e.touches[1].clientY)/2;
    pcx = camX; pcy = camY;
  }
}, {passive:false});
canvas.addEventListener('touchmove', e => {
  if (e.touches.length === 2) {
    e.preventDefault();
    const mx2 = (e.touches[0].clientX+e.touches[1].clientX)/2;
    const my2 = (e.touches[0].clientY+e.touches[1].clientY)/2;
    camX = pcx-(mx2-psx)/zoom; camY = pcy-(my2-psy)/zoom;
    const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    if (lastTD > 0) { targetZoom *= d/lastTD; targetZoom = Math.max(0.3, Math.min(3, targetZoom)); }
    lastTD = d;
  }
}, {passive:false});
canvas.addEventListener('touchend', () => { panning = false; lastTD = 0; });
</script>
</body>
