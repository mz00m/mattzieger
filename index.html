<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matt Zieger</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0e1a; overflow: hidden; cursor: crosshair; }
#wave-canvas {
  display: block;
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
}
</style>
</head>
<body>
<canvas id="wave-canvas"></canvas>

<!-- Water surface simulation: standalone, no dependencies -->
<script>
(function() {
  const canvas = document.getElementById('wave-canvas');
  const ctx = canvas.getContext('2d');

  // Simulation runs at reduced resolution for performance
  const SCALE = 3;
  const DAMPING = 0.988;
  const RIPPLE_RADIUS = 12;
  const RIPPLE_STRENGTH = 180;

  let W, H, simW, simH;
  let buf1, buf2;       // wave height double-buffer

  // Offscreen canvas at simulation resolution for fast pixel writes
  const simCanvas = document.createElement('canvas');
  const simCtx = simCanvas.getContext('2d');
  let imageData, pixels;

  function init() {
    W = canvas.width = innerWidth;
    H = canvas.height = innerHeight;
    simW = Math.ceil(W / SCALE);
    simH = Math.ceil(H / SCALE);

    simCanvas.width = simW;
    simCanvas.height = simH;

    buf1 = new Float32Array(simW * simH);
    buf2 = new Float32Array(simW * simH);

    imageData = simCtx.createImageData(simW, simH);
    pixels = imageData.data;
  }

  function dropRipple(screenX, screenY) {
    const cx = (screenX / SCALE) | 0;
    const cy = (screenY / SCALE) | 0;
    const r = RIPPLE_RADIUS;
    const r2 = r * r;

    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        const d2 = dx * dx + dy * dy;
        if (d2 > r2) continue;
        const sx = cx + dx, sy = cy + dy;
        if (sx < 1 || sx >= simW - 1 || sy < 1 || sy >= simH - 1) continue;
        const idx = sy * simW + sx;
        // Smooth cosine bell shape
        const t = Math.sqrt(d2) / r;
        buf1[idx] += RIPPLE_STRENGTH * (0.5 + 0.5 * Math.cos(Math.PI * t));
      }
    }
  }

  // Propagate wave using classic ripple algorithm
  function simulate() {
    for (let y = 1; y < simH - 1; y++) {
      const row = y * simW;
      for (let x = 1; x < simW - 1; x++) {
        const i = row + x;
        // Average of 4 neighbors, propagate, dampen
        buf2[i] = ((
          buf1[i - 1] + buf1[i + 1] +
          buf1[i - simW] + buf1[i + simW]
        ) * 0.5 - buf2[i]) * DAMPING;
      }
    }
    // Swap buffers
    const tmp = buf1;
    buf1 = buf2;
    buf2 = tmp;
  }

  // --- Impressionist palette (Monet / Sargent water) ---
  // Multiple broken-color hues that blend based on surface angle + position
  // Deep shadows: indigo-violet, mid: cerulean-teal, highlights: warm gold-peach
  const palette = [
    // [R, G, B] — shadow tones (cool violets, deep blues)
    { r: 18, g: 12, b: 48 },   // deep indigo
    { r: 25, g: 28, b: 62 },   // ultramarine shadow
    { r: 14, g: 30, b: 52 },   // prussian blue
    // mid tones (broken greens, ceruleans)
    { r: 28, g: 58, b: 82 },   // cerulean
    { r: 22, g: 65, b: 70 },   // viridian-teal
    { r: 38, g: 72, b: 64 },   // sage reflection
    // light tones (lavender, warm sky reflections)
    { r: 70, g: 90, b: 130 },  // reflected sky
    { r: 85, g: 100, b: 145 }, // light lavender
    { r: 100, g: 115, b: 140 },// Sargent grey-blue
  ];

  // Warm highlight colors (golden sunlight on water)
  const warmHighR = 255, warmHighG = 220, warmHighB = 160;
  const coolHighR = 180, coolHighG = 210, coolHighB = 255;

  // Pre-compute a static noise texture for "brushstroke" variation
  let noiseMap;
  function buildNoise() {
    noiseMap = new Float32Array(simW * simH);
    // Simple layered value noise
    for (let oct = 0; oct < 3; oct++) {
      const freq = (oct + 1) * 0.07;
      const amp = 1 / (oct + 1);
      for (let y = 0; y < simH; y++) {
        for (let x = 0; x < simW; x++) {
          // Hash-based pseudo-noise
          const v = Math.sin(x * freq * 12.9898 + y * freq * 78.233 + oct * 43.12) * 43758.5453;
          noiseMap[y * simW + x] += (v - Math.floor(v)) * amp;
        }
      }
    }
  }

  const origInit = init;
  init = function() {
    origInit();
    buildNoise();
  };

  let globalTime = 0;

  function render() {
    globalTime += 0.016;

    // Slowly drifting light direction for gentle shimmer
    const lt = globalTime * 0.3;
    const lx = 0.25 + Math.sin(lt) * 0.05;
    const ly = -0.45 + Math.cos(lt * 0.7) * 0.05;
    const lz = 0.86;

    // Half-vector for specular
    const hx = lx, hy = ly, hz = lz + 1;
    const hlen = Math.sqrt(hx * hx + hy * hy + hz * hz);
    const nhx = hx / hlen, nhy = hy / hlen, nhz = hz / hlen;

    const invSimW = 1 / simW;
    const invSimH = 1 / simH;

    for (let y = 1; y < simH - 1; y++) {
      const row = y * simW;
      const vy = y * invSimH; // 0..1 vertical position
      for (let x = 1; x < simW - 1; x++) {
        const i = row + x;
        const pi = i << 2;
        const vx = x * invSimW; // 0..1 horizontal position

        // Height gradients → surface normal
        const dzdx = buf1[i + 1] - buf1[i - 1];
        const dzdy = buf1[i + simW] - buf1[i - simW];
        const nscale = 3.5;
        const nnx = -dzdx, nny = -dzdy, nnz = nscale;
        const invLen = 1 / Math.sqrt(nnx * nnx + nny * nny + nnz * nnz);
        const nx = nnx * invLen, ny = nny * invLen, nz = nnz * invLen;

        // Diffuse
        const diffuse = Math.max(0, nx * lx + ny * ly + nz * lz);

        // Specular — softer exponent (20) for broader, painterly highlights
        const specDot = nx * nhx + ny * nhy + nz * nhz;
        const spec = specDot > 0 ? Math.pow(specDot, 20) : 0;
        // Also a tight sparkle for Sargent-like glints
        const sparkle = specDot > 0 ? Math.pow(specDot, 80) : 0;

        // Noise-based "brushstroke" variation to break up color
        const noise = noiseMap[i];
        const brushShift = Math.sin(noise * 18.0 + globalTime * 0.5) * 0.5 + 0.5;

        // Palette index driven by diffuse + noise → broken color
        const palIdx = (diffuse * 6 + noise * 3) % 9;
        const palLow = palIdx | 0;
        const palHigh = (palLow + 1) % 9;
        const palT = palIdx - palLow;
        const cLow = palette[palLow];
        const cHigh = palette[palHigh];

        // Interpolated base color from palette
        let baseR = cLow.r + (cHigh.r - cLow.r) * palT;
        let baseG = cLow.g + (cHigh.g - cLow.g) * palT;
        let baseB = cLow.b + (cHigh.b - cLow.b) * palT;

        // Vertical gradient: upper = sky reflection (lighter), lower = deeper
        const depthGrad = 1 - vy * 0.3;
        baseR *= depthGrad;
        baseG *= depthGrad;
        baseB *= depthGrad;

        // Add diffuse lighting with warm/cool split
        // Lit areas get warm, shadow areas stay cool (impressionist color theory)
        const warmT = diffuse * 0.6 + brushShift * 0.15;
        baseR += diffuse * (30 + warmT * 25);
        baseG += diffuse * (40 + warmT * 15);
        baseB += diffuse * (50 - warmT * 10);

        // Height tint: peaks get warmer (golden), troughs get cooler (violet)
        const h = buf1[i];
        if (h > 0) {
          const ht = Math.min(1, h * 0.008);
          baseR += ht * 40;
          baseG += ht * 25;
          baseB -= ht * 10;
        } else {
          const ht = Math.min(1, -h * 0.006);
          baseR += ht * 8;
          baseG += ht * 5;
          baseB += ht * 25;
        }

        // Broad specular: warm golden highlight (Monet's sunlight on water)
        const specWarmT = brushShift * 0.4 + 0.6;
        baseR += spec * (warmHighR * specWarmT + coolHighR * (1 - specWarmT)) * 0.6;
        baseG += spec * (warmHighG * specWarmT + coolHighG * (1 - specWarmT)) * 0.5;
        baseB += spec * (warmHighB * specWarmT + coolHighB * (1 - specWarmT)) * 0.4;

        // Tight sparkle: pure white glints (Sargent wet-on-wet strokes)
        baseR += sparkle * 200;
        baseG += sparkle * 200;
        baseB += sparkle * 220;

        // Subtle color noise to mimic visible brushstrokes
        const strokeNoise = (noise - 0.5) * 12;
        baseR += strokeNoise;
        baseG += strokeNoise * 0.8;
        baseB -= strokeNoise * 0.5;

        pixels[pi]     = baseR > 255 ? 255 : baseR < 0 ? 0 : baseR | 0;
        pixels[pi + 1] = baseG > 255 ? 255 : baseG < 0 ? 0 : baseG | 0;
        pixels[pi + 2] = baseB > 255 ? 255 : baseB < 0 ? 0 : baseB | 0;
        pixels[pi + 3] = 255;
      }
    }

    // Write to simulation canvas, then scale up to main canvas
    simCtx.putImageData(imageData, 0, 0);
    // No smoothing — keeps the painterly pixelation (like visible brushstrokes)
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(simCanvas, 0, 0, simW, simH, 0, 0, W, H);
  }

  // Input
  canvas.addEventListener('click', e => dropRipple(e.clientX, e.clientY));
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    for (const t of e.changedTouches) dropRipple(t.clientX, t.clientY);
  }, { passive: false });

  // Optional: drag to paint ripples
  let dragging = false;
  canvas.addEventListener('mousedown', () => { dragging = true; });
  canvas.addEventListener('mouseup', () => { dragging = false; });
  canvas.addEventListener('mousemove', e => {
    if (dragging) dropRipple(e.clientX, e.clientY);
  });

  function frame() {
    simulate();
    simulate(); // 2 substeps per frame for faster propagation
    render();
    requestAnimationFrame(frame);
  }

  init();
  addEventListener('resize', init);
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
