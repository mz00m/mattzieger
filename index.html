<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matt Zieger</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #2a2535; overflow: hidden; cursor: crosshair; }
#wave-canvas {
  display: block;
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
}
</style>
</head>
<body>
<canvas id="wave-canvas"></canvas>

<!-- Water surface simulation: standalone, no dependencies -->
<script>
(function() {
  const canvas = document.getElementById('wave-canvas');
  const ctx = canvas.getContext('2d');

  // Simulation runs at reduced resolution for performance
  const SCALE = 3;
  const DAMPING = 0.988;
  const RIPPLE_RADIUS = 12;
  const RIPPLE_STRENGTH = 180;

  let W, H, simW, simH;
  let buf1, buf2;       // wave height double-buffer

  // Offscreen canvas at simulation resolution for fast pixel writes
  const simCanvas = document.createElement('canvas');
  const simCtx = simCanvas.getContext('2d');
  let imageData, pixels;

  function init() {
    W = canvas.width = innerWidth;
    H = canvas.height = innerHeight;
    simW = Math.ceil(W / SCALE);
    simH = Math.ceil(H / SCALE);

    simCanvas.width = simW;
    simCanvas.height = simH;

    buf1 = new Float32Array(simW * simH);
    buf2 = new Float32Array(simW * simH);

    imageData = simCtx.createImageData(simW, simH);
    pixels = imageData.data;
  }

  function dropRipple(screenX, screenY) {
    const cx = (screenX / SCALE) | 0;
    const cy = (screenY / SCALE) | 0;
    const r = RIPPLE_RADIUS;
    const r2 = r * r;

    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        const d2 = dx * dx + dy * dy;
        if (d2 > r2) continue;
        const sx = cx + dx, sy = cy + dy;
        if (sx < 1 || sx >= simW - 1 || sy < 1 || sy >= simH - 1) continue;
        const idx = sy * simW + sx;
        // Smooth cosine bell shape
        const t = Math.sqrt(d2) / r;
        buf1[idx] += RIPPLE_STRENGTH * (0.5 + 0.5 * Math.cos(Math.PI * t));
      }
    }
  }

  // Propagate wave using classic ripple algorithm
  function simulate() {
    for (let y = 1; y < simH - 1; y++) {
      const row = y * simW;
      for (let x = 1; x < simW - 1; x++) {
        const i = row + x;
        // Average of 4 neighbors, propagate, dampen
        buf2[i] = ((
          buf1[i - 1] + buf1[i + 1] +
          buf1[i - simW] + buf1[i + simW]
        ) * 0.5 - buf2[i]) * DAMPING;
      }
    }
    // Swap buffers
    const tmp = buf1;
    buf1 = buf2;
    buf2 = tmp;
  }

  // --- Sargent watercolor palette ---
  // Merged from "Venetian Canal" + "In a Levantine Port":
  //   Shadows: lavender, mauve, violet-grey (canal) + deep teal (port)
  //   Mids: cerulean blue, teal-aquamarine (port) + ochre, sienna (canal)
  //   Highlights: golden amber, warm cream (both)
  //
  // Shadow palette (cool: lavender, mauve, deep teal)
  const shadowColors = [
    { r: 80, g: 68, b: 100 },   // lavender shadow
    { r: 55, g: 62, b: 80 },    // slate-violet
    { r: 45, g: 70, b: 78 },    // deep teal shadow
    { r: 65, g: 55, b: 75 },    // muted mauve
    { r: 50, g: 65, b: 72 },    // dark aqua shadow
  ];
  // Mid palette (cerulean, teal-green, ochre, sienna — the full Sargent range)
  const midColors = [
    { r: 95, g: 140, b: 165 },  // cerulean blue
    { r: 80, g: 130, b: 135 },  // teal-aquamarine
    { r: 110, g: 145, b: 140 }, // sage-aqua
    { r: 140, g: 115, b: 72 },  // raw sienna
    { r: 120, g: 100, b: 65 },  // warm ochre
  ];
  // Highlight palette (golden, cream, pale cerulean — sunlit water)
  const lightColors = [
    { r: 210, g: 190, b: 130 }, // golden reflection
    { r: 225, g: 205, b: 155 }, // warm cream
    { r: 175, g: 195, b: 205 }, // pale cerulean light
    { r: 240, g: 222, b: 175 }, // bright cream
    { r: 195, g: 210, b: 195 }, // pale aqua highlight
  ];

  // Pre-compute a static noise texture for "brushstroke" variation
  let noiseMap, noiseMap2;
  function buildNoise() {
    noiseMap = new Float32Array(simW * simH);
    noiseMap2 = new Float32Array(simW * simH);
    for (let oct = 0; oct < 3; oct++) {
      const freq = (oct + 1) * 0.07;
      const amp = 1 / (oct + 1);
      for (let y = 0; y < simH; y++) {
        for (let x = 0; x < simW; x++) {
          const v = Math.sin(x * freq * 12.9898 + y * freq * 78.233 + oct * 43.12) * 43758.5453;
          noiseMap[y * simW + x] += (v - Math.floor(v)) * amp;
          // Second noise layer offset for color variation
          const v2 = Math.sin(x * freq * 7.31 + y * freq * 91.17 + oct * 67.5) * 23421.631;
          noiseMap2[y * simW + x] += (v2 - Math.floor(v2)) * amp;
        }
      }
    }
  }

  const origInit = init;
  init = function() {
    origInit();
    buildNoise();
  };

  let globalTime = 0;

  // Helper: lerp between two palette colors
  function lerpColor(a, b, t) {
    return {
      r: a.r + (b.r - a.r) * t,
      g: a.g + (b.g - a.g) * t,
      b: a.b + (b.b - a.b) * t,
    };
  }

  function render() {
    globalTime += 0.016;

    // Slowly drifting light for gentle shimmer
    const lt = globalTime * 0.25;
    const lx = 0.3 + Math.sin(lt) * 0.06;
    const ly = -0.4 + Math.cos(lt * 0.7) * 0.06;
    const lz = 0.86;

    // Half-vector for specular
    const hx = lx, hy = ly, hz = lz + 1;
    const hlen = Math.sqrt(hx * hx + hy * hy + hz * hz);
    const nhx = hx / hlen, nhy = hy / hlen, nhz = hz / hlen;

    const invSimH = 1 / simH;

    for (let y = 1; y < simH - 1; y++) {
      const row = y * simW;
      const vy = y * invSimH;
      for (let x = 1; x < simW - 1; x++) {
        const i = row + x;
        const pi = i << 2;

        // Surface normal from height gradients
        const dzdx = buf1[i + 1] - buf1[i - 1];
        const dzdy = buf1[i + simW] - buf1[i - simW];
        const nscale = 3.0;
        const nnx = -dzdx, nny = -dzdy, nnz = nscale;
        const invLen = 1 / Math.sqrt(nnx * nnx + nny * nny + nnz * nnz);
        const nx = nnx * invLen, ny = nny * invLen, nz = nnz * invLen;

        // Diffuse
        const diffuse = Math.max(0, nx * lx + ny * ly + nz * lz);

        // Broad specular (warm glow, like Sargent's golden reflections)
        const specDot = nx * nhx + ny * nhy + nz * nhz;
        const spec = specDot > 0 ? Math.pow(specDot, 14) : 0;
        // Tight sparkle glints (wet-on-wet bright strokes)
        const sparkle = specDot > 0 ? Math.pow(specDot, 90) : 0;

        // Noise for broken color
        const n1 = noiseMap[i];
        const n2 = noiseMap2[i];
        const brushShift = Math.sin(n1 * 14.0 + globalTime * 0.4) * 0.5 + 0.5;

        // Height value
        const h = buf1[i];

        // --- Sargent broken-color mixing ---
        // Map diffuse + noise into a warm-cool continuum:
        //   dark/shadow → lavender-mauve (cool)
        //   mid → ochre-sienna (warm)
        //   light → golden-cream (warm)
        const luminance = diffuse * 0.65 + 0.35; // base brightness

        // Pick from shadow palette (5 colors)
        const sIdx = n1 * 4.99;
        const si = sIdx | 0;
        const shadow = lerpColor(shadowColors[si], shadowColors[(si + 1) % 5], sIdx - si);

        // Pick from mid palette (5 colors) — noise + brush shift for variety
        const mIdx = (n2 + brushShift * 0.3) * 4.99 % 5;
        const mi = mIdx | 0;
        const mid = lerpColor(midColors[mi], midColors[(mi + 1) % 5], mIdx - mi);

        // Pick from light palette (5 colors)
        const lIdx = (n1 + n2) * 2.49 % 5;
        const li = lIdx | 0;
        const light = lerpColor(lightColors[li], lightColors[(li + 1) % 5], lIdx - li);

        // Blend shadow → mid → light based on luminance
        let baseR, baseG, baseB;
        if (luminance < 0.5) {
          const t = luminance * 2;
          baseR = shadow.r + (mid.r - shadow.r) * t;
          baseG = shadow.g + (mid.g - shadow.g) * t;
          baseB = shadow.b + (mid.b - shadow.b) * t;
        } else {
          const t = (luminance - 0.5) * 2;
          baseR = mid.r + (light.r - mid.r) * t;
          baseG = mid.g + (light.g - mid.g) * t;
          baseB = mid.b + (light.b - mid.b) * t;
        }

        // Vertical gradient: top slightly lighter (sky reflection), bottom deeper
        const depthShift = (1 - vy) * 0.15;
        baseR += depthShift * 20;
        baseG += depthShift * 15;
        baseB += depthShift * 25; // top gets a touch more lavender

        // Wave height tint: peaks → warmer gold, troughs → cooler teal/lavender
        if (h > 0) {
          const ht = Math.min(1, h * 0.007);
          baseR += ht * 50;  // push toward amber/gold
          baseG += ht * 38;
          baseB -= ht * 12;
        } else {
          const ht = Math.min(1, -h * 0.005);
          // Alternate between teal and lavender in troughs based on noise
          const tealBias = n2 > 0.5 ? 1 : 0;
          baseR -= ht * 8 * tealBias;
          baseG += ht * (15 + tealBias * 15);  // teal push
          baseB += ht * (25 + tealBias * 8);   // blue push
        }

        // Broad specular: alternates warm gold ↔ pale cerulean based on position
        const specWarm = 0.55 + brushShift * 0.45;
        baseR += spec * (170 * specWarm + 60 * (1 - specWarm));
        baseG += spec * (140 * specWarm + 120 * (1 - specWarm));
        baseB += spec * (60 * specWarm + 150 * (1 - specWarm));

        // Tight sparkle: warm cream glints
        baseR += sparkle * 235;
        baseG += sparkle * 225;
        baseB += sparkle * 195;

        // Brushstroke noise: slight per-pixel color variation
        const strokeR = (n1 - 0.5) * 16;
        const strokeG = (n2 - 0.5) * 12;
        const strokeB = ((n1 + n2) * 0.5 - 0.5) * 10;
        baseR += strokeR;
        baseG += strokeG;
        baseB += strokeB;

        pixels[pi]     = baseR > 255 ? 255 : baseR < 0 ? 0 : baseR | 0;
        pixels[pi + 1] = baseG > 255 ? 255 : baseG < 0 ? 0 : baseG | 0;
        pixels[pi + 2] = baseB > 255 ? 255 : baseB < 0 ? 0 : baseB | 0;
        pixels[pi + 3] = 255;
      }
    }

    // Write to sim canvas, scale up — no smoothing for visible brushstroke quality
    simCtx.putImageData(imageData, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(simCanvas, 0, 0, simW, simH, 0, 0, W, H);
  }

  // Input
  canvas.addEventListener('click', e => dropRipple(e.clientX, e.clientY));
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    for (const t of e.changedTouches) dropRipple(t.clientX, t.clientY);
  }, { passive: false });

  // Optional: drag to paint ripples
  let dragging = false;
  canvas.addEventListener('mousedown', () => { dragging = true; });
  canvas.addEventListener('mouseup', () => { dragging = false; });
  canvas.addEventListener('mousemove', e => {
    if (dragging) dropRipple(e.clientX, e.clientY);
  });

  function frame() {
    simulate();
    simulate(); // 2 substeps per frame for faster propagation
    render();
    requestAnimationFrame(frame);
  }

  init();
  addEventListener('resize', init);
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
