<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matt Zieger</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0e1a; overflow: hidden; cursor: crosshair; }
#wave-canvas {
  display: block;
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
}
#three-canvas {
  display: block;
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}
</style>
</head>
<body>
<canvas id="wave-canvas"></canvas>
<canvas id="three-canvas"></canvas>

<!-- Wave simulation: standalone, no dependencies -->
<script>
(function() {
  const canvas = document.getElementById('wave-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, cols, rows, dots;

  const SPACING = 28;
  const DOT_BASE = 1.1;
  const WAVE_SPEED = 120;
  const FREQUENCY = 3.5;
  const WAVELENGTH = WAVE_SPEED / FREQUENCY;
  const TWO_PI = Math.PI * 2;

  let letterMask = null;
  let waves = [];

  function buildLetterMask() {
    const offscreen = document.createElement('canvas');
    offscreen.width = W;
    offscreen.height = H;
    const octx = offscreen.getContext('2d');

    const fontSize = Math.min(H * 0.28, W * 0.22);
    octx.font = `900 ${fontSize}px "Helvetica Neue", Helvetica, Arial, sans-serif`;
    octx.textAlign = 'center';
    octx.textBaseline = 'middle';
    octx.fillStyle = '#fff';

    const gap = fontSize * 0.15;
    const mW = octx.measureText('M').width;
    const zW = octx.measureText('Z').width;
    const total = mW + gap + zW;
    const cx = W / 2, cy = H / 2;

    octx.fillText('M', cx - total / 2 + mW / 2, cy);
    octx.fillText('Z', cx + total / 2 - zW / 2, cy);

    const imageData = octx.getImageData(0, 0, W, H);
    const data = imageData.data;

    letterMask = new Array(dots.length);
    for (let i = 0; i < dots.length; i++) {
      const px = Math.round(dots[i].x);
      const py = Math.round(dots[i].y);
      if (px >= 0 && px < W && py >= 0 && py < H) {
        letterMask[i] = data[(py * W + px) * 4 + 3] > 128;
      } else {
        letterMask[i] = false;
      }
    }
  }

  function initWave() {
    W = canvas.width = innerWidth;
    H = canvas.height = innerHeight;
    cols = Math.ceil(W / SPACING) + 2;
    rows = Math.ceil(H / SPACING) + 2;

    const ox = (W - (cols - 1) * SPACING) / 2;
    const oy = (H - (rows - 1) * SPACING) / 2;

    dots = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        dots.push({ x: ox + c * SPACING, y: oy + r * SPACING, z: 0, prevZ: 0 });
      }
    }
    buildLetterMask();
  }

  function spawnWave(x, y) {
    waves.push({ x, y, t0: performance.now() / 1000, amplitude: 10 });
    if (waves.length > 12) waves.shift();
  }

  canvas.addEventListener('click', e => spawnWave(e.clientX, e.clientY));
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    for (const t of e.changedTouches) spawnWave(t.clientX, t.clientY);
  }, { passive: false });

  let lastTime = performance.now() / 1000;

  function waveFrame(now) {
    now /= 1000;
    lastTime = now;

    ctx.fillStyle = '#0a0e1a';
    ctx.fillRect(0, 0, W, H);

    waves = waves.filter(w => (now - w.t0) < 10);

    for (const dot of dots) {
      dot.prevZ = dot.z;
      let z = 0;

      for (const wave of waves) {
        const dx = dot.x - wave.x;
        const dy = dot.y - wave.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        const elapsed = now - wave.t0;
        const wavefront = elapsed * WAVE_SPEED;

        if (dist > wavefront + WAVELENGTH * 0.5) continue;

        const localT = elapsed - dist / WAVE_SPEED;
        if (localT < 0) continue;

        const spatialFalloff = 1 / Math.max(1, Math.sqrt(dist / 30));
        const timeDamping = Math.exp(-localT * 1.6);
        const envelope = wave.amplitude * spatialFalloff * timeDamping;
        const edgeFade = Math.min(1, localT * FREQUENCY * 1.5);

        z += envelope * edgeFade * Math.sin(TWO_PI * FREQUENCY * localT);
      }

      dot.z = z;
    }

    // Zero out letter-masked dots
    for (let i = 0; i < dots.length; i++) {
      if (letterMask[i]) dots[i].z = 0;
    }

    for (let i = 0; i < dots.length; i++) {
      if (letterMask[i]) continue;
      const dot = dots[i];
      const absZ = Math.abs(dot.z);
      const size = DOT_BASE + absZ * 0.12;
      const drawY = dot.y - dot.z * 0.6;
      const intensity = Math.min(1, absZ / 12);
      const r = Math.round(30 + intensity * 100);
      const g = Math.round(55 + intensity * 180);
      const b = Math.round(90 + intensity * 165);
      const alpha = 0.35 + intensity * 0.65;

      ctx.beginPath();
      ctx.arc(dot.x, drawY, size, 0, TWO_PI);
      ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
      ctx.fill();

      if (absZ > 4) {
        ctx.beginPath();
        ctx.arc(dot.x, drawY, size + absZ * 0.2, 0, TWO_PI);
        ctx.fillStyle = `rgba(${r},${g},${b},${intensity * 0.15})`;
        ctx.fill();
      }
    }

    const threshold = 2.0;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const i = r * cols + c;
        if (letterMask[i]) continue;
        const d = dots[i];
        if (Math.abs(d.z) < threshold) continue;

        if (c < cols - 1 && !letterMask[i + 1]) {
          const dr = dots[i + 1];
          if (Math.abs(dr.z) >= threshold) {
            const lineAlpha = Math.min(0.25, (Math.abs(d.z) + Math.abs(dr.z)) / 80);
            ctx.beginPath();
            ctx.moveTo(d.x, d.y - d.z * 0.6);
            ctx.lineTo(dr.x, dr.y - dr.z * 0.6);
            ctx.strokeStyle = `rgba(60,130,200,${lineAlpha})`;
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        }
        if (r < rows - 1 && !letterMask[i + cols]) {
          const dd = dots[i + cols];
          if (Math.abs(dd.z) >= threshold) {
            const lineAlpha = Math.min(0.25, (Math.abs(d.z) + Math.abs(dd.z)) / 80);
            ctx.beginPath();
            ctx.moveTo(d.x, d.y - d.z * 0.6);
            ctx.lineTo(dd.x, dd.y - dd.z * 0.6);
            ctx.strokeStyle = `rgba(60,130,200,${lineAlpha})`;
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        }
      }
    }

    requestAnimationFrame(waveFrame);
  }

  initWave();
  addEventListener('resize', initWave);
  requestAnimationFrame(waveFrame);
})();
</script>

<!-- Three.js 3D letters: loads independently, fails gracefully -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

const threeCanvas = document.getElementById('three-canvas');
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 1, 2000);
camera.position.set(0, 0, 500);

const renderer = new THREE.WebGLRenderer({
  canvas: threeCanvas,
  alpha: true,
  antialias: true
});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// Lighting
scene.add(new THREE.AmbientLight(0x4466aa, 0.6));

const keyLight = new THREE.DirectionalLight(0x88bbff, 1.8);
keyLight.position.set(100, 200, 300);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
keyLight.shadow.camera.near = 10;
keyLight.shadow.camera.far = 1000;
keyLight.shadow.camera.left = -300;
keyLight.shadow.camera.right = 300;
keyLight.shadow.camera.top = 200;
keyLight.shadow.camera.bottom = -200;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x6699cc, 0.8);
rimLight.position.set(-150, -50, 200);
scene.add(rimLight);

const bottomLight = new THREE.DirectionalLight(0x223355, 0.4);
bottomLight.position.set(0, -200, 100);
scene.add(bottomLight);

// Shadow plane
const planeMat = new THREE.ShadowMaterial({ opacity: 0.35 });
const plane = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), planeMat);
plane.position.z = -30;
plane.receiveShadow = true;
scene.add(plane);

const letterGroup = new THREE.Group();
scene.add(letterGroup);

// Load font and create letters
const loader = new FontLoader();
loader.load(
  'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/fonts/helvetiker_bold.typeface.json',
  function(font) {
    const matFront = new THREE.MeshPhongMaterial({
      color: 0x1a3055,
      specular: 0x5588bb,
      shininess: 60,
    });
    const matSide = new THREE.MeshPhongMaterial({
      color: 0x0f1f38,
      specular: 0x334466,
      shininess: 30,
    });

    const textParams = {
      font: font,
      size: 100,
      depth: 30,
      curveSegments: 16,
      bevelEnabled: true,
      bevelThickness: 4,
      bevelSize: 3,
      bevelOffset: 0,
      bevelSegments: 8,
    };

    const mGeo = new TextGeometry('M', textParams);
    mGeo.computeBoundingBox();
    const mMesh = new THREE.Mesh(mGeo, [matFront, matSide]);
    mMesh.castShadow = true;

    const zGeo = new TextGeometry('Z', textParams);
    zGeo.computeBoundingBox();
    const zMesh = new THREE.Mesh(zGeo, [matFront, matSide]);
    zMesh.castShadow = true;

    const mBox = mGeo.boundingBox;
    const zBox = zGeo.boundingBox;
    const mWidth = mBox.max.x - mBox.min.x;
    const zWidth = zBox.max.x - zBox.min.x;
    const gap = 30;
    const totalWidth = mWidth + gap + zWidth;
    const mHeight = mBox.max.y - mBox.min.y;

    mMesh.position.set(-totalWidth / 2, -mHeight / 2, 0);
    zMesh.position.set(-totalWidth / 2 + mWidth + gap, -mHeight / 2, 0);

    letterGroup.add(mMesh);
    letterGroup.add(zMesh);
  }
);

function threeFrame(now) {
  const t = now / 1000;
  letterGroup.position.y = Math.sin(t * 0.8) * 6;
  letterGroup.position.z = Math.sin(t * 0.5) * 4;
  letterGroup.rotation.x = Math.sin(t * 0.6) * 0.04;
  letterGroup.rotation.y = Math.sin(t * 0.4) * 0.03;
  renderer.render(scene, camera);
  requestAnimationFrame(threeFrame);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

requestAnimationFrame(threeFrame);
</script>
</body>
</html>
