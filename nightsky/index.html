<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Night Sky — Satellites & Space Objects</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    overflow: hidden; background: #071222;
    font-family: 'Courier New', monospace; color: #3c8ec8;
  }
  canvas { display: block; cursor: crosshair; }

  /* ── Blueprint UI elements ── */
  .panel {
    background: rgba(7,18,34,0.88);
    border: 1px solid rgba(60,142,200,0.25);
    padding: 10px 14px; border-radius: 1px;
  }

  #header {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    text-align: center; pointer-events: none; user-select: none;
  }
  #header h1 {
    font-size: 12px; letter-spacing: 4px; text-transform: uppercase;
    color: rgba(60,142,200,0.5); font-weight: normal; margin-bottom: 3px;
  }
  #header .sub {
    font-size: 9px; letter-spacing: 2px; color: rgba(60,142,200,0.28);
    text-transform: uppercase;
  }

  #stats {
    position: absolute; top: 14px; left: 14px;
    font-size: 9px; letter-spacing: 1px; color: rgba(60,142,200,0.4);
    line-height: 2; text-transform: uppercase; pointer-events: none;
  }
  #stats .val { color: #3c8ec8; }

  #controls {
    position: absolute; top: 14px; right: 14px;
    display: flex; flex-direction: column; gap: 5px;
  }
  .btn {
    background: rgba(7,18,34,0.85); border: 1px solid rgba(60,142,200,0.2);
    color: rgba(60,142,200,0.5); font-family: 'Courier New', monospace;
    font-size: 9px; letter-spacing: 1px; text-transform: uppercase;
    padding: 5px 10px; cursor: pointer; transition: all 0.2s; border-radius: 1px;
  }
  .btn:hover { border-color: rgba(60,142,200,0.5); }
  .btn.on { border-color: #3c8ec8; color: #8ee8ff; }

  /* ── Upcoming passes panel ── */
  #passes {
    position: absolute; bottom: 60px; left: 14px;
    max-width: 320px; max-height: 260px; overflow-y: auto;
  }
  #passes h2 {
    font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
    color: rgba(60,142,200,0.4); font-weight: normal; margin-bottom: 8px;
    border-bottom: 1px solid rgba(60,142,200,0.12); padding-bottom: 6px;
  }
  .pass-item {
    font-size: 9px; line-height: 1.9; letter-spacing: 0.5px;
    color: rgba(60,142,200,0.45); border-bottom: 1px solid rgba(60,142,200,0.06);
    padding: 4px 0; cursor: pointer; transition: color 0.15s;
  }
  .pass-item:hover { color: #8ee8ff; }
  .pass-item .name { color: #3c8ec8; text-transform: uppercase; }
  .pass-item .bright { color: #8ee8ff; }
  .pass-item .dim { color: rgba(60,142,200,0.3); }
  .pass-item .time { color: rgba(142,232,255,0.6); }

  /* ── Time bar ── */
  #timebar {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    font-size: 9px; letter-spacing: 1px; text-transform: uppercase;
  }
  #timebar input[type=range] { width: 160px; accent-color: #1a4870; }
  #time-display { color: rgba(60,142,200,0.45); min-width: 160px; text-align: center; }

  /* ── Tooltip ── */
  #tip {
    position: absolute; pointer-events: none; z-index: 20;
    font-size: 9px; letter-spacing: 0.5px; line-height: 1.9;
    color: #3c8ec8; background: rgba(7,18,34,0.92);
    border: 1px solid rgba(60,142,200,0.3);
    padding: 8px 12px; border-radius: 1px;
    opacity: 0; transition: opacity 0.12s;
    text-transform: uppercase;
  }
  #tip.show { opacity: 1; }

  /* ── Legend ── */
  #legend {
    position: absolute; bottom: 14px; right: 14px;
    font-size: 9px; line-height: 2.2; color: rgba(60,142,200,0.35);
    text-transform: uppercase; letter-spacing: 1px; pointer-events: none;
  }
  .dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    margin-right: 5px; vertical-align: middle;
  }

  /* ── Location prompt ── */
  #loc-prompt {
    position: fixed; inset: 0; background: #071222;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; z-index: 100;
  }
  #loc-prompt .box {
    text-align: center; max-width: 360px;
  }
  #loc-prompt h2 {
    font-size: 12px; letter-spacing: 4px; text-transform: uppercase;
    font-weight: normal; margin-bottom: 6px; color: rgba(60,142,200,0.5);
  }
  #loc-prompt p {
    font-size: 9px; color: rgba(60,142,200,0.3); line-height: 2;
    margin-bottom: 20px; letter-spacing: 1px; text-transform: uppercase;
  }
  #loc-prompt .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  #loc-prompt input {
    background: rgba(7,18,34,0.9); border: 1px solid rgba(60,142,200,0.2);
    color: #3c8ec8; font-family: 'Courier New', monospace; font-size: 10px;
    padding: 7px 10px; width: 85px; text-align: center; border-radius: 1px;
    margin: 0 3px;
  }
  #loc-prompt input::placeholder { color: rgba(60,142,200,0.2); }
  #manual-row { display: none; margin-top: 14px; }

  /* ── Loading ── */
  #loading {
    position: fixed; inset: 0; background: #071222;
    display: none; flex-direction: column; align-items: center;
    justify-content: center; z-index: 99;
  }
  .spin {
    width: 30px; height: 30px; border: 1px solid rgba(60,142,200,0.15);
    border-top-color: #3c8ec8; border-radius: 50%;
    animation: sp 1s linear infinite; margin-bottom: 14px;
  }
  @keyframes sp { to { transform: rotate(360deg); } }
  #load-msg {
    font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
    color: rgba(60,142,200,0.35);
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(60,142,200,0.15); border-radius: 2px; }
</style>
</head>
<body>

<!-- Location prompt -->
<div id="loc-prompt">
  <div class="box">
    <h2>Night Sky</h2>
    <p>Track satellites, rockets &amp; debris overhead</p>
    <div class="actions">
      <button class="btn" id="btn-geo" style="padding:8px 18px;font-size:10px;">Use My Location</button>
      <button class="btn" id="btn-man" style="padding:8px 18px;font-size:10px;">Enter Coords</button>
    </div>
    <div id="manual-row">
      <input id="inp-lat" placeholder="Lat">
      <input id="inp-lon" placeholder="Lon">
      <button class="btn" id="btn-go" style="margin-top:10px;padding:6px 16px;">Go</button>
    </div>
  </div>
</div>

<!-- Loading -->
<div id="loading"><div class="spin"></div><div id="load-msg">Acquiring signal...</div></div>

<!-- Main UI -->
<div id="header"><h1>Night Sky</h1><div class="sub" id="loc-label"></div></div>

<div id="stats">
  <div>Tracked: <span class="val" id="n-total">0</span></div>
  <div>Above horizon: <span class="val" id="n-vis">0</span></div>
</div>

<div id="controls">
  <button class="btn on" id="t-sat" data-c="sat">Satellites</button>
  <button class="btn on" id="t-rb" data-c="rb">Rockets</button>
  <button class="btn on" id="t-deb" data-c="deb">Debris</button>
  <button class="btn" id="t-arcs">Arcs</button>
  <button class="btn" id="t-grid">Grid</button>
</div>

<div id="passes" class="panel" style="display:none;">
  <h2>Visible — next 30 min</h2>
  <div id="pass-list"></div>
</div>

<div id="timebar" class="panel">
  <button class="btn" id="t-back">&lt;</button>
  <input type="range" id="t-slider" min="-360" max="360" value="0">
  <button class="btn" id="t-fwd">&gt;</button>
  <div id="time-display"></div>
  <button class="btn" id="t-now">Now</button>
</div>

<div id="legend">
  <div><span class="dot" style="background:#3c8ec8;"></span>Satellite</div>
  <div><span class="dot" style="background:#8ee8ff;"></span>Rocket body</div>
  <div><span class="dot" style="background:#1a4870;"></span>Debris</div>
</div>

<div id="tip"></div>

<!-- libs -->
<script src="https://cdn.jsdelivr.net/npm/satellite.js@5.0.0/dist/satellite.min.js"></script>
<script>
(function() {
  'use strict';

  // ═══════════════════════════════════════
  //  CONFIG — Blueprint palette
  // ═══════════════════════════════════════
  const BG        = '#071222';
  const LINE      = '#3c8ec8';
  const BRIGHT    = '#8ee8ff';
  const DIM       = '#1a4870';
  const GRID_COL  = '#0e2040';
  const CAT_COLORS = { sat: LINE, rb: BRIGHT, deb: DIM };

  const TLE_URLS = {
    sat: [
      'https://celestrak.org/NORAD/elements/gp.php?GROUP=visual&FORMAT=tle',
      'https://celestrak.org/NORAD/elements/gp.php?GROUP=stations&FORMAT=tle',
    ],
    rb: [
      'https://celestrak.org/NORAD/elements/gp.php?GROUP=rocket-body&FORMAT=tle',
    ],
    deb: [
      'https://celestrak.org/NORAD/elements/gp.php?GROUP=cosmos-2251-debris&FORMAT=tle',
      'https://celestrak.org/NORAD/elements/gp.php?GROUP=iridium-33-debris&FORMAT=tle',
      'https://celestrak.org/NORAD/elements/gp.php?GROUP=1999-025&FORMAT=tle',
    ],
  };

  const PROXY = 'https://api.allorigins.win/raw?url=';

  // ═══════════════════════════════════════
  //  STATE
  // ═══════════════════════════════════════
  let obs = { lat: 0, lon: 0, alt: 0 };
  let objects = [];            // { name, satrec, cat }
  let tOff = 0;               // time offset in minutes
  let show = { sat: true, rb: true, deb: true };
  let showArcs = false, showGrid = false;
  let canvas, ctx, W, H, cx, cy, R;
  let mouseX = -1, mouseY = -1;
  let hovered = null;          // object index
  let upcomingPasses = [];
  let highlightedName = null;

  const $ = id => document.getElementById(id);

  // ═══════════════════════════════════════
  //  LOCATION
  // ═══════════════════════════════════════
  $('btn-geo').onclick = () => {
    if (!navigator.geolocation) { alert('No geolocation'); return; }
    $('btn-geo').textContent = 'Locating...';
    navigator.geolocation.getCurrentPosition(
      p => start(p.coords.latitude, p.coords.longitude, p.coords.altitude || 0),
      () => { $('btn-geo').textContent = 'Use My Location'; alert('Location denied — enter manually.'); },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  };
  $('btn-man').onclick = () => $('manual-row').style.display = 'block';
  $('btn-go').onclick = () => {
    const la = parseFloat($('inp-lat').value), lo = parseFloat($('inp-lon').value);
    if (isNaN(la) || isNaN(lo)) { alert('Invalid coordinates'); return; }
    start(la, lo, 0);
  };

  // ═══════════════════════════════════════
  //  START
  // ═══════════════════════════════════════
  function start(lat, lon, alt) {
    obs = { lat, lon, alt };
    $('loc-prompt').style.display = 'none';
    $('loading').style.display = 'flex';
    $('loc-label').textContent =
      Math.abs(lat).toFixed(2) + '°' + (lat >= 0 ? 'N' : 'S') + '  ' +
      Math.abs(lon).toFixed(2) + '°' + (lon >= 0 ? 'E' : 'W');

    initCanvas();
    fetchAll();
  }

  // ═══════════════════════════════════════
  //  CANVAS (2D polar sky chart — blueprint style)
  // ═══════════════════════════════════════
  function initCanvas() {
    canvas = document.createElement('canvas');
    document.body.insertBefore(canvas, document.body.firstChild);
    ctx = canvas.getContext('2d');
    resize();
    window.addEventListener('resize', resize);

    canvas.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
    canvas.addEventListener('mouseleave', () => { mouseX = -1; mouseY = -1; });
  }

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    cx = W / 2;
    cy = H / 2;
    R = Math.min(W, H) * 0.42;
  }

  // Azimuth/elevation → pixel position on polar chart
  // Zenith at center, horizon at edge
  function skyToXY(az, el) {
    const r = R * (1 - el / 90);           // 90° → center, 0° → edge
    const a = (az - 90) * Math.PI / 180;   // N at top
    return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
  }

  // ═══════════════════════════════════════
  //  FETCH TLE
  // ═══════════════════════════════════════
  async function fetchAll() {
    let total = 0;

    for (const [cat, urls] of Object.entries(TLE_URLS)) {
      for (const url of urls) {
        $('load-msg').textContent = 'Loading ' + cat + '...';
        const n = await tryFetch(url, cat);
        total += n;
      }
    }

    if (total === 0) {
      // retry with proxy
      $('load-msg').textContent = 'Retrying with proxy...';
      for (const [cat, urls] of Object.entries(TLE_URLS)) {
        for (const url of urls) {
          total += await tryFetch(PROXY + encodeURIComponent(url), cat);
        }
      }
    }

    if (total === 0) { fallback(); }

    computeUpcoming();
    $('passes').style.display = 'block';
    $('loading').style.display = 'none';
    loop();
  }

  async function tryFetch(url, cat) {
    try {
      const r = await fetch(url);
      if (!r.ok) return 0;
      return parseTLE(await r.text(), cat);
    } catch { return 0; }
  }

  function parseTLE(text, cat) {
    const lines = text.trim().split('\n').map(l => l.trim()).filter(Boolean);
    let n = 0;
    for (let i = 0; i < lines.length - 2; i++) {
      if (lines[i + 1].startsWith('1 ') && lines[i + 2].startsWith('2 ')) {
        try {
          const sr = satellite.twoline2satrec(lines[i + 1], lines[i + 2]);
          if (sr.error === 0) { objects.push({ name: lines[i], satrec: sr, cat }); n++; }
        } catch {}
        i += 2;
      }
    }
    return n;
  }

  function fallback() {
    parseTLE(
      'ISS (ZARYA)\n1 25544U 98067A   24001.50000000  .00016717  00000-0  10270-3 0  9002\n2 25544  51.6400 208.9163 0006703 300.2547  59.7856 15.49560532999999',
      'sat'
    );
  }

  // ═══════════════════════════════════════
  //  LOOK ANGLES
  // ═══════════════════════════════════════
  function now() { return new Date(Date.now() + tOff * 60000); }

  function lookAngles(satrec, date) {
    const gmst = satellite.gstime(date);
    const pv = satellite.propagate(satrec, date);
    if (!pv.position) return null;
    const ecf = satellite.eciToEcf(pv.position, gmst);
    const la = satellite.ecfToLookAngles(
      { longitude: satellite.degreesToRadians(obs.lon),
        latitude:  satellite.degreesToRadians(obs.lat),
        height:    obs.alt / 1000 },
      ecf
    );
    return {
      az:  satellite.degreesLat(la.azimuth),
      el:  satellite.degreesLong(la.elevation),
      rng: la.rangeSat,
      vel: pv.velocity
    };
  }

  // ═══════════════════════════════════════
  //  UPCOMING PASSES (next 30 min)
  // ═══════════════════════════════════════
  function computeUpcoming() {
    upcomingPasses = [];
    const t0 = now();

    objects.forEach((obj, idx) => {
      if (obj.cat === 'deb') return; // skip debris for pass list
      let maxEl = -90, bestAz = 0, bestTime = null;
      let isVisible = false;

      // scan every 30 seconds for 30 minutes
      for (let s = 0; s <= 1800; s += 30) {
        const t = new Date(t0.getTime() + s * 1000);
        const la = lookAngles(obj.satrec, t);
        if (!la) continue;
        if (la.el > 0) {
          isVisible = true;
          if (la.el > maxEl) {
            maxEl = la.el;
            bestAz = la.az;
            bestTime = t;
          }
        }
      }

      if (isVisible && maxEl > 5) {
        upcomingPasses.push({ idx, name: obj.name, maxEl, bestAz, bestTime, cat: obj.cat });
      }
    });

    // sort by peak elevation (brightest/best first)
    upcomingPasses.sort((a, b) => b.maxEl - a.maxEl);
    upcomingPasses = upcomingPasses.slice(0, 20);
    renderPassList();
  }

  function renderPassList() {
    const el = $('pass-list');
    if (upcomingPasses.length === 0) {
      el.innerHTML = '<div class="pass-item dim">No objects above horizon</div>';
      return;
    }
    el.innerHTML = upcomingPasses.map((p, i) => {
      const t = p.bestTime;
      const timeStr = t.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: false });
      const bright = p.maxEl > 45 ? ' bright' : '';
      const dir = azToDir(p.bestAz);
      return '<div class="pass-item" data-name="' + p.name + '">' +
        '<span class="name' + bright + '">' + p.name.substring(0, 22) + '</span> ' +
        '<span class="dim">·</span> ' +
        '<span class="time">' + timeStr + '</span> ' +
        '<span class="dim">·</span> ' +
        dir + ' ' + p.bestAz.toFixed(0) + '° az ' +
        '<span class="dim">·</span> ' +
        p.maxEl.toFixed(0) + '° peak' +
        '</div>';
    }).join('');

    // hover highlight
    el.querySelectorAll('.pass-item').forEach(item => {
      item.addEventListener('mouseenter', () => highlightedName = item.dataset.name);
      item.addEventListener('mouseleave', () => highlightedName = null);
    });
  }

  function azToDir(az) {
    const dirs = ['N','NE','E','SE','S','SW','W','NW'];
    return dirs[Math.round(az / 45) % 8];
  }

  // ═══════════════════════════════════════
  //  DRAW
  // ═══════════════════════════════════════
  function draw() {
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    drawGrid();
    drawCardinals();

    const date = now();
    let visCount = 0, totalCount = 0;
    hovered = null;
    let closestDist = 14;

    // collect visible objects
    const visible = [];
    objects.forEach((obj, idx) => {
      if (!show[obj.cat]) return;
      const la = lookAngles(obj.satrec, date);
      if (!la) return;
      totalCount++;
      if (la.el < 0) return;
      visCount++;
      visible.push({ idx, obj, la });
    });

    // Draw arcs first (behind dots)
    if (showArcs) {
      visible.forEach(v => drawArc(v.obj, v.la, date));
    }

    // Draw dots
    visible.forEach(v => {
      const { obj, la, idx } = v;
      const p = skyToXY(la.az, la.el);
      const col = CAT_COLORS[obj.cat];
      const isHighlighted = obj.name === highlightedName;
      const size = isHighlighted ? 5 : (obj.cat === 'deb' ? 1.5 : 2.5);

      // Glow for highlighted
      if (isHighlighted) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 12, 0, Math.PI * 2);
        ctx.fillStyle = col + '18';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
        ctx.fillStyle = col + '30';
        ctx.fill();
      }

      // Dot
      ctx.beginPath();
      ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
      ctx.fillStyle = isHighlighted ? BRIGHT : col;
      ctx.globalAlpha = obj.cat === 'deb' ? 0.4 : 0.85;
      ctx.fill();
      ctx.globalAlpha = 1;

      // Label for highlighted
      if (isHighlighted) {
        ctx.font = '9px Courier New';
        ctx.fillStyle = BRIGHT;
        ctx.textAlign = 'left';
        ctx.fillText(obj.name.substring(0, 22).toUpperCase(), p.x + 10, p.y - 6);
        ctx.fillStyle = DIM;
        ctx.fillText(
          'AZ ' + la.az.toFixed(1) + '°  EL ' + la.el.toFixed(1) + '°  ' +
          la.rng.toFixed(0) + ' KM',
          p.x + 10, p.y + 6
        );
      }

      // Hover detection
      if (mouseX >= 0) {
        const dx = mouseX - p.x, dy = mouseY - p.y;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < closestDist) { closestDist = d; hovered = { obj, la, px: p.x, py: p.y }; }
      }
    });

    // Stats
    $('n-total').textContent = totalCount;
    $('n-vis').textContent = visCount;

    // Tooltip
    const tip = $('tip');
    if (hovered) {
      const h = hovered;
      const speed = h.la.vel ? Math.sqrt(h.la.vel.x**2 + h.la.vel.y**2 + h.la.vel.z**2).toFixed(1) : '?';
      const catLabel = { sat: 'satellite', rb: 'rocket body', deb: 'debris' }[h.obj.cat];
      tip.innerHTML =
        '<div style="color:' + BRIGHT + '">' + h.obj.name + '</div>' +
        catLabel + '<br>' +
        'az ' + h.la.az.toFixed(1) + '°  el ' + h.la.el.toFixed(1) + '°<br>' +
        'range ' + h.la.rng.toFixed(0) + ' km<br>' +
        'speed ' + speed + ' km/s';
      tip.style.left = (h.px + 16) + 'px';
      tip.style.top = (h.py - 16) + 'px';
      tip.classList.add('show');
    } else {
      tip.classList.remove('show');
    }
  }

  // Draw orbital arc (trajectory over next 60 min)
  function drawArc(obj, currentLa, date) {
    const col = CAT_COLORS[obj.cat];
    ctx.beginPath();
    ctx.strokeStyle = col;
    ctx.lineWidth = 0.6;
    let started = false;

    for (let m = 0; m <= 60; m += 1) {
      const t = new Date(date.getTime() + m * 60000);
      const la = lookAngles(obj.satrec, t);
      if (!la || la.el < 0) {
        if (started) { ctx.stroke(); ctx.beginPath(); started = false; }
        continue;
      }
      const p = skyToXY(la.az, la.el);
      if (!started) { ctx.moveTo(p.x, p.y); started = true; }
      else ctx.lineTo(p.x, p.y);

      // Tick marks every 15 min
      if (m > 0 && m % 15 === 0) {
        ctx.fillStyle = col;
        ctx.globalAlpha = 0.5;
        ctx.fillRect(p.x - 1, p.y - 1, 2, 2);
        ctx.globalAlpha = 1;
      }
    }
    if (started) {
      ctx.globalAlpha = obj.cat === 'deb' ? 0.15 : 0.25;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  // Blueprint grid — altitude/azimuth circles
  function drawGrid() {
    ctx.strokeStyle = GRID_COL;
    ctx.lineWidth = 0.5;

    // Horizon circle
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.strokeStyle = LINE;
    ctx.globalAlpha = 0.25;
    ctx.stroke();
    ctx.globalAlpha = 1;

    if (!showGrid) return;

    ctx.strokeStyle = GRID_COL;
    ctx.globalAlpha = 0.4;

    // Altitude rings at 15° intervals
    for (let alt = 15; alt <= 75; alt += 15) {
      const r = R * (1 - alt / 90);
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.stroke();

      // label
      ctx.font = '8px Courier New';
      ctx.fillStyle = GRID_COL;
      ctx.textAlign = 'center';
      ctx.fillText(alt + '°', cx + r + 14, cy + 3);
    }

    // Azimuth lines every 30°
    for (let az = 0; az < 360; az += 30) {
      const a = (az - 90) * Math.PI / 180;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + R * Math.cos(a), cy + R * Math.sin(a));
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // Cardinal direction labels
  function drawCardinals() {
    const dirs = [
      { l: 'N', az: 0 }, { l: 'E', az: 90 },
      { l: 'S', az: 180 }, { l: 'W', az: 270 }
    ];
    ctx.font = '11px Courier New';
    ctx.fillStyle = LINE;
    ctx.globalAlpha = 0.35;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    dirs.forEach(d => {
      const a = (d.az - 90) * Math.PI / 180;
      const r = R + 16;
      ctx.fillText(d.l, cx + r * Math.cos(a), cy + r * Math.sin(a));
    });

    // Zenith crosshair
    ctx.beginPath();
    ctx.moveTo(cx - 4, cy); ctx.lineTo(cx + 4, cy);
    ctx.moveTo(cx, cy - 4); ctx.lineTo(cx, cy + 4);
    ctx.strokeStyle = DIM;
    ctx.lineWidth = 0.5;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // ═══════════════════════════════════════
  //  CONTROLS
  // ═══════════════════════════════════════
  ['t-sat', 't-rb', 't-deb'].forEach(id => {
    $(id).onclick = function() {
      this.classList.toggle('on');
      show[this.dataset.c] = this.classList.contains('on');
    };
  });
  $('t-arcs').onclick = function() {
    showArcs = !showArcs;
    this.classList.toggle('on', showArcs);
  };
  $('t-grid').onclick = function() {
    showGrid = !showGrid;
    this.classList.toggle('on', showGrid);
  };

  const slider = $('t-slider');
  slider.oninput = () => { tOff = parseInt(slider.value); };
  $('t-back').onclick = () => { tOff = Math.max(-360, tOff - 10); slider.value = tOff; };
  $('t-fwd').onclick = () => { tOff = Math.min(360, tOff + 10); slider.value = tOff; };
  $('t-now').onclick = () => { tOff = 0; slider.value = 0; };

  // ═══════════════════════════════════════
  //  LOOP
  // ═══════════════════════════════════════
  let lastPassUpdate = 0;

  function loop() {
    draw();

    // Update time display
    const d = now();
    $('time-display').textContent = d.toLocaleString(undefined, {
      month: 'short', day: 'numeric',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
    });

    // Refresh upcoming passes every 60s
    const t = performance.now();
    if (t - lastPassUpdate > 60000) { computeUpcoming(); lastPassUpdate = t; }

    requestAnimationFrame(loop);
  }

})();
</script>
</body>
</html>
